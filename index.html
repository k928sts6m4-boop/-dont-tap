<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEURO — Doctor NEX</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#050816;color:#fff;font-family:Arial,sans-serif}
body{
 background:
 radial-gradient(circle at 50% -10%,#20376c 0,#080d20 38%,#03050c 100%);
}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.app{width:100%;max-width:650px;min-height:100vh;margin:auto;padding:12px}

/* LOGO */
.logo{
 text-align:center;font-size:43px;font-weight:900;letter-spacing:6px;
 color:#69eaff;text-shadow:0 0 15px #00d9ff,0 0 40px #007bff
}
.subtitle{text-align:center;color:#94a8ca;font-size:11px;letter-spacing:3px}

/* PANEL */
.panel{
 background:rgba(9,17,39,.82);
 border:1px solid rgba(71,190,255,.22);
 border-radius:24px;
 box-shadow:0 15px 50px rgba(0,0,0,.38);
 backdrop-filter:blur(14px)
}

/* NEX */
.nexStage{
 height:300px;
 margin-top:15px;
 position:relative;
 overflow:hidden;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 background:
 radial-gradient(circle at 50% 45%,rgba(0,213,255,.17),transparent 42%),
 linear-gradient(145deg,#111e42,#050b1b)
}
.nexLight{
 position:absolute;width:230px;height:230px;border-radius:50%;
 background:rgba(0,220,255,.13);filter:blur(30px);
 animation:glow 2.8s ease-in-out infinite
}
@keyframes glow{50%{transform:scale(1.12);opacity:.65}}

/* Real graphic */
.nexGraphic{
 position:relative;
 height:285px;
 width:210px;
 object-fit:contain;
 object-position:center bottom;
 z-index:5;
 filter:drop-shadow(0 15px 20px rgba(0,0,0,.4));
 animation:nexIdle 3.2s ease-in-out infinite;
 transform-origin:center bottom;
}
@keyframes nexIdle{
 0%,100%{transform:translateY(0) rotate(0)}
 50%{transform:translateY(-5px) rotate(-.6deg)}
}
.nexGraphic.talk{animation:nexTalk .42s ease-in-out infinite alternate}
@keyframes nexTalk{
 from{transform:translateY(0) rotate(-1deg)}
 to{transform:translateY(-4px) rotate(1deg)}
}
.nexGraphic.happy{animation:nexHappy .55s ease-in-out 3}
@keyframes nexHappy{
 50%{transform:translateY(-14px) scale(1.04)}
}
.nexGraphic.sad{animation:nexSad .7s ease-in-out}
@keyframes nexSad{
 50%{transform:rotate(-5deg) translateY(5px)}
}
.nexGraphic.think{animation:nexThink 1s ease-in-out infinite alternate}
@keyframes nexThink{
 to{transform:rotate(3deg) translateY(-3px)}
}
.nexGraphic.boss{animation:nexBoss .8s ease-in-out infinite alternate}
@keyframes nexBoss{
 to{transform:scale(1.045) rotate(-2deg)}
}
.nexGraphic.victory{animation:nexVictory .5s ease-in-out 4}
@keyframes nexVictory{
 50%{transform:translateY(-18px) rotate(2deg) scale(1.05)}
}

.nexBubble{
 position:absolute;left:12px;top:12px;max-width:285px;
 padding:11px 14px;border-radius:15px;
 background:rgba(4,11,29,.94);border:1px solid #38dfff;
 color:#e4fbff;font-size:13px;line-height:1.35;
 z-index:20;box-shadow:0 0 20px rgba(0,216,255,.15)
}

/* fallback */
.nexFallback{
 width:130px;height:230px;position:relative;z-index:4;
 animation:nexIdle 3s ease-in-out infinite
}
.nexHead{
 position:absolute;left:20px;top:8px;width:90px;height:90px;
 background:#efb98f;border-radius:48%;z-index:4
}
.nexHair{
 position:absolute;left:17px;top:1px;width:96px;height:48px;
 background:#775039;border-radius:55% 55% 25% 25%;z-index:6
}
.nexEye{
 position:absolute;top:52px;width:9px;height:12px;background:#263b59;
 border-radius:50%;z-index:7
}
.nexEye.a{left:43px}.nexEye.b{left:78px}
.nexSmile{
 position:absolute;left:52px;top:75px;width:27px;height:12px;
 border-bottom:3px solid #783e3b;border-radius:50%;z-index:7
}
.nexBody{
 position:absolute;left:10px;top:92px;width:110px;height:125px;
 background:#f5f7fa;border-radius:24px 24px 12px 12px
}
.nexShirt{
 position:absolute;left:37px;top:106px;width:55px;height:106px;
 background:#17375f;border-radius:10px;z-index:3
}
.nexArm{
 position:absolute;top:105px;width:28px;height:90px;background:#f5f7fa;
 border-radius:20px;z-index:2
}
.nexArm.a{left:0;transform:rotate(18deg)}
.nexArm.b{right:0;transform:rotate(-18deg)}
.nexN{
 position:absolute;left:58px;top:127px;color:#5ceaff;font-weight:900;
 font-size:23px;z-index:5
}
.stetho{
 position:absolute;left:37px;top:104px;width:57px;height:72px;
 border:3px solid #222;border-top:0;border-radius:0 0 35px 35px;z-index:6
}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{padding:13px 7px;text-align:center}
.stat b{display:block;color:#62e8ff;font-size:20px}
.stat span{color:#7f91b1;font-size:10px}
.mainBtn{
 width:100%;margin-top:14px;padding:18px;border-radius:17px;
 background:linear-gradient(135deg,#19dfff,#526bff);color:#fff;
 font-size:18px;font-weight:900;box-shadow:0 10px 30px rgba(35,178,255,.25)
}
.secondaryRow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.secondary{padding:13px;border-radius:14px;color:#c8d7f5;background:#101a35;border:1px solid #23365d}

/* GAME */
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:8px}
.hudBox{padding:9px;text-align:center}
.hudBox small{display:block;color:#7387aa;font-size:9px}
.hudBox b{font-size:16px}
.progress{height:7px;background:#111a30;border-radius:10px;overflow:hidden;margin-bottom:9px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#29e6ff,#7d5cff);transition:.25s}

/* NEX ALWAYS */
.gameNex{
 position:relative;
 height:145px;
 margin-bottom:9px;
 overflow:hidden;
}
.gameNex img{
 position:absolute;
 right:5px;bottom:-10px;
 height:170px;width:125px;object-fit:contain;
 filter:drop-shadow(0 8px 10px #000);
}
.gameNex .fallback{
 position:absolute;right:20px;bottom:-15px;transform:scale(.7);
 transform-origin:bottom center;
}

/* challenge */
.challenge{
 min-height:420px;padding:16px;
 background:rgba(10,18,42,.82);
 border:1px solid rgba(71,190,255,.2);
 border-radius:24px
}
.challengeTitle{text-align:center;font-size:11px;color:#69eaff;letter-spacing:2px}
.question{text-align:center;font-size:21px;line-height:1.35;margin:18px 3px;font-weight:800}
.sub{text-align:center;color:#91a5c9;font-size:13px;line-height:1.4;margin-bottom:14px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.answer{
 min-height:70px;padding:11px;border-radius:15px;background:#111d3a;
 border:1px solid #29416e;color:#fff;font-weight:800
}
.answer:active{transform:scale(.96)}
.answer.good{background:#0d694f;border-color:#37f0ae}
.answer.bad{background:#6b1b32;border-color:#ff4f70}

/* motor */
.motorArea{
 min-height:320px;position:relative;overflow:hidden;border-radius:20px;
 background:radial-gradient(circle,rgba(20,80,150,.25),transparent 55%),#071126;
 border:1px solid #203963
}
.ball{position:absolute;width:55px;height:55px;border-radius:50%;touch-action:none;box-shadow:0 0 25px currentColor}
.ball.blue{background:#2bdfff;color:#2bdfff}
.ball.red{background:#ff3e61;color:#ff3e61}
.ball.yellow{background:#ffe15c;color:#ffe15c}
.motorInfo{display:flex;justify-content:space-between;padding:8px;color:#b7c9e8;font-size:12px}
.bigBtn{width:100%;padding:18px;border-radius:15px;background:#172746;color:#fff;font-weight:900}
.target{
 width:145px;height:145px;border-radius:50%;margin:50px auto 20px;
 background:#17233d;border:5px solid #263b61;
 display:flex;align-items:center;justify-content:center;color:#7890b7;font-weight:900
}
.target.ready{background:#32ef8b;border-color:#a7ffd0;color:#062c18;box-shadow:0 0 50px rgba(50,239,139,.5)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.cell{aspect-ratio:1;border-radius:12px;background:#15223d;border:1px solid #263c63}
.cell.on{background:#48e9ff;box-shadow:0 0 25px #48e9ff}
.track{height:70px;margin-top:60px;position:relative;background:#101d37;border-radius:40px}
.zone{position:absolute;left:42%;width:16%;height:100%;background:rgba(42,237,164,.3);border-left:2px solid #42f0a9;border-right:2px solid #42f0a9}
.cursor{position:absolute;top:7px;width:56px;height:56px;border-radius:50%;background:#63e8ff;box-shadow:0 0 25px #63e8ff}
.memory{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.memoryItem{
 height:70px;border-radius:14px;background:#162544;border:1px solid #29416d;
 display:flex;align-items:center;justify-content:center;font-size:28px
}

/* result */
.result{padding:20px}
.resultTitle{text-align:center;font-size:30px;font-weight:900;color:#63e8ff;margin:10px}
.finalScore{text-align:center;font-size:46px;font-weight:900}
.resultStats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.rStat{padding:14px;border-radius:15px;background:#0f1931;border:1px solid #23385f}
.rStat b{font-size:22px;color:#63e8ff}.rStat span{display:block;color:#8599bd;font-size:11px;margin-top:3px}

/* settings */
.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:100;
 display:flex;align-items:center;justify-content:center;padding:18px
}
.modalBox{width:100%;max-width:470px;padding:20px}
.settingTitle{font-size:22px;font-weight:900}
.label{color:#7e94b8;font-size:11px;margin:17px 0 7px}
.settingGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.setting{
 padding:14px 7px;border-radius:13px;background:#111d38;
 border:1px solid #263b63;color:#b9c9e6
}
.setting.active{background:#153f61;border-color:#48e9ff;color:#fff}
.close{width:100%;padding:14px;border-radius:14px;background:#243252;color:#fff;margin-top:16px}
.toast{
 position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
 padding:12px 18px;border-radius:14px;background:#101b36;
 border:1px solid #36ddff;color:#fff;opacity:0;transition:.25s;z-index:200;
 pointer-events:none
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:430px){
 .logo{font-size:36px}
 .challenge{min-height:400px}
 .question{font-size:19px}
 .nexStage{height:275px}
}
</style>
</head>

<body>

<div class="app">

<!-- START -->
<section id="start">

<div class="logo">NEURO</div>
<div class="subtitle">MIND • FOCUS • REFLEX • MOTOR</div>

<div class="panel nexStage">

 <div class="nexLight"></div>

 <div class="nexBubble" id="nexBubble">
  Привіт! Я Doctor NEX. Перевіримо твій мозок?
 </div>

 <!-- Справжній графічний NEX -->
 <img
   id="nexStart"
   class="nexGraphic"
   src="nex.png"
   alt="Doctor NEX"
   onerror="this.style.display='none';document.getElementById('fallbackStart').style.display='block'"
 >

 <!-- тимчасовий fallback -->
 <div id="fallbackStart" class="nexFallback" style="display:none">
  <div class="nexHair"></div>
  <div class="nexHead"></div>
  <div class="nexEye a"></div>
  <div class="nexEye b"></div>
  <div class="nexSmile"></div>
  <div class="nexArm a"></div>
  <div class="nexArm b"></div>
  <div class="nexBody"></div>
  <div class="nexShirt"></div>
  <div class="nexN">N</div>
  <div class="stetho"></div>
 </div>

</div>

<div class="stats">
 <div class="panel stat"><b id="best">0</b><span>РЕКОРД</span></div>
 <div class="panel stat"><b id="bestLevel">0</b><span>РІВЕНЬ</span></div>
 <div class="panel stat"><b id="games">0</b><span>ІГР</span></div>
</div>

<button class="mainBtn" id="startBtn">🧠 ПОЧАТИ NEURO</button>

<div class="secondaryRow">
 <button class="secondary" id="dailyBtn">📅 DAILY</button>
 <button class="secondary" id="settingsBtn">⚙️ НАЛАШТУВАННЯ</button>
</div>

</section>


<!-- GAME -->
<section id="game" class="hidden">

<div class="hud">
 <div class="panel hudBox"><small>БЛОК</small><b id="block">1</b></div>
 <div class="panel hudBox"><small>ЖИТТЯ</small><b id="life">❤️❤️❤️</b></div>
 <div class="panel hudBox"><small>ОЧКИ</small><b id="score">0</b></div>
</div>

<div class="progress"><i id="progress"></i></div>

<!-- NEX ПОСТІЙНО -->
<div class="panel gameNex">

 <div class="nexBubble" id="gameBubble">
  Уважно. Починаймо.
 </div>

 <img
   id="nexGame"
   src="nex.png"
   alt="Doctor NEX"
   onerror="this.style.display='none';document.getElementById('fallbackGame').style.display='block'"
 >

 <div id="fallbackGame" class="nexFallback fallback" style="display:none">
  <div class="nexHair"></div>
  <div class="nexHead"></div>
  <div class="nexEye a"></div>
  <div class="nexEye b"></div>
  <div class="nexSmile"></div>
  <div class="nexArm a"></div>
  <div class="nexArm b"></div>
  <div class="nexBody"></div>
  <div class="nexShirt"></div>
  <div class="nexN">N</div>
  <div class="stetho"></div>
 </div>

</div>

<div id="challenge" class="challenge"></div>

</section>


<!-- RESULT -->
<section id="result" class="hidden">

<div class="panel result">

 <div class="resultTitle">NEURO COMPLETE</div>

 <div class="finalScore" id="finalScore">0</div>
 <div style="text-align:center;color:#8296b9">ОЧКИ</div>

 <div class="resultStats">

  <div class="rStat"><b id="mind">0</b><span>MIND</span></div>
  <div class="rStat"><b id="focus">0</b><span>FOCUS</span></div>
  <div class="rStat"><b id="memory">0</b><span>MEMORY</span></div>
  <div class="rStat"><b id="reflex">0</b><span>REFLEX</span></div>
  <div class="rStat"><b id="motor">0</b><span>MOTOR</span></div>
  <div class="rStat"><b id="combo">0</b><span>BEST COMBO</span></div>

 </div>

 <button class="mainBtn" id="homeBtn">🏠 НА ГОЛОВНИЙ ЕКРАН</button>

</div>

</section>

</div>


<!-- SETTINGS -->
<div class="modal hidden" id="modal">

<div class="modalBox panel">

<div class="settingTitle">⚙️ Налаштування</div>

<div class="label">СКЛАДНІСТЬ</div>

<div class="settingGrid">

<button class="setting" data-d="easy">🟢 Легко</button>
<button class="setting" data-d="normal">🟡 Нормально</button>
<button class="setting" data-d="hard">🔴 Складно</button>
<button class="setting" data-d="expert">🟣 Експерт</button>
<button class="setting" data-d="adaptive" style="grid-column:1/3">🤖 Адаптивно</button>

</div>

<div class="label">ЗВУК</div>

<div class="settingGrid">
<button class="setting" id="music">🎵 Музика: ON</button>
<button class="setting" id="sfx">🔊 Ефекти: ON</button>
</div>

<button class="close" id="close">ЗАКРИТИ</button>

</div>
</div>

<div class="toast" id="toast"></div>


<script>

/* =====================================================
 STATE
===================================================== */

let S={
 level:1,
 block:1,
 step:0,
 score:0,
 lives:3,
 combo:0,
 bestCombo:0,
 mind:0,
 focus:0,
 memory:0,
 reflex:0,
 motor:0,
 total:0,
 correct:0,
 difficulty:localStorage.getItem("neuroDifficulty")||"normal",
 music:localStorage.getItem("neuroMusic")!=="off",
 sfx:localStorage.getItem("neuroSfx")!=="off"
};

let current=null;
let cleanup=null;
let timer=null;

const DIFF={
 easy:{speed:.72,time:1.35,mem:4},
 normal:{speed:1,time:1,mem:5},
 hard:{speed:1.25,time:.78,mem:6},
 expert:{speed:1.55,time:.58,mem:7}
};

function cfg(){

 if(S.difficulty!=="adaptive")return DIFF[S.difficulty];

 let rate=S.total?S.correct/S.total:1;

 if(rate>.9)return DIFF.hard;
 if(rate<.62)return DIFF.easy;

 return DIFF.normal;
}


/* =====================================================
 UI
===================================================== */

function show(id){
 ["start","game","result"].forEach(x=>$(x).classList.add("hidden"));
 $(id).classList.remove("hidden");
}

function $(id){return document.getElementById(id)}

function toast(t){
 $("toast").textContent=t;
 $("toast").classList.add("show");
 setTimeout(()=>$("toast").classList.remove("show"),1200);
}

function say(t){
 $("nexBubble").textContent=t;
 if($("gameBubble"))$("gameBubble").textContent=t;
}

function animateNEX(type){

 const a=$("nexStart");
 const b=$("nexGame");

 [a,b].forEach(x=>{
  if(!x)return;
  x.classList.remove("talk","happy","sad","think","boss","victory");
  void x.offsetWidth;
  if(type)x.classList.add(type);
 });

}

function vibrate(n=20){
 if(navigator.vibrate)navigator.vibrate(n);
}

function hud(){

 $("block").textContent=S.block;
 $("score").textContent=S.score;
 $("life").textContent="❤️".repeat(S.lives)+"🖤".repeat(3-S.lives);
 $("progress").style.width=(S.step/5*100)+"%";

}


/* =====================================================
 AUDIO
===================================================== */

let AC=null;

function audioStart(){

 if(!S.sfx)return;

 if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();

 if(AC.state==="suspended")AC.resume();

}

function tone(f,d=.08,type="square",v=.035){

 if(!S.sfx)return;

 audioStart();

 if(!AC)return;

 let o=AC.createOscillator();
 let g=AC.createGain();

 o.type=type;
 o.frequency.value=f;

 g.gain.setValueAtTime(v,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);

 o.connect(g);
 g.connect(AC.destination);

 o.start();
 o.stop(AC.currentTime+d);
}

function good(){
 tone(660,.07);
 setTimeout(()=>tone(880,.1),65);
}

function bad(){
 tone(170,.18,"sawtooth",.045);
}


/* =====================================================
 QUESTIONS
===================================================== */

const Q=[

{t:"focus",q:"Який символ відрізняється?",o:["▲ ▲ ▲ ▲","▲ ▲ ▼ ▲","▲ ▲ ▲ ▲","▲ ▲ ▲ ▲"],a:1},
{t:"focus",q:"Знайди символ, який дивиться в інший бік.",o:["◀","◀","▶","◀"],a:2},
{t:"focus",q:"Який напрямок зустрічається лише один раз?",o:["↑","→","↓","↑"],a:1},

{t:"mind",q:"Антон вищий за Богдана. Богдан вищий за Влада. Хто найнижчий?",o:["Антон","Богдан","Влад","Неможливо визначити"],a:2},
{t:"mind",q:"У кімнаті є лампа, свічка та ліхтар. Що запалиш першим?",o:["Лампу","Свічку","Сірник","Ліхтар"],a:2},
{t:"mind",q:"Усі лікарі мають бейдж. NEX має бейдж. Чи означає це, що NEX лікар?",o:["Так","Ні, недостатньо даних","Тільки в халаті","Тільки в лікарні"],a:1},
{t:"mind",q:"Ти обігнав людину, яка бігла другою. Яким ти став?",o:["Першим","Другим","Третім","Четвертим"],a:1},
{t:"mind",q:"У тебе 3 яблука. Ти забрав 2. Скільки яблук у тебе?",o:["1","2","3","0"],a:1},
{t:"mind",q:"Що важче: 1 кг заліза чи 1 кг пір'я?",o:["Залізо","Пір'я","Однаково","Залежить від об'єму"],a:2},

{t:"space",q:"Якщо ▶ повернути на 180°, що отримаємо?",o:["▶","◀","▲","▼"],a:1},
{t:"space",q:"Яка фігура є дзеркальним відображенням ◢?",o:["◣","◥","◤","◢"],a:0},

{t:"switch",q:"Правило: вибирай НЕ найбільшу фігуру, а найменшу.",o:["●","■■","▲▲▲","◆◆◆◆"],a:0},
{t:"switch",q:"Тепер вибирай парний символ.",o:["1","3","8","7"],a:2},

{t:"mind",q:"Продовж: ▲ ● ▲ ● ▲ ?",o:["▲","●","■","◆"],a:1},
{t:"mind",q:"Продовж: ■ ◆ ■ ◆ ■ ?",o:["●","◆","▲","■"],a:1},
{t:"mind",q:"Продовж: 🔵 🔵 🔴 🔵 🔵 🔴 🔵 ?",o:["🔵","🔴","🟡","🟢"],a:0},

{t:"mind",q:"Марко молодший за Олега. Олег молодший за Івана. Хто найстарший?",o:["Марко","Олег","Іван","Невідомо"],a:2},
{t:"mind",q:"Якщо всі A є B, а всі B є C, що точно правильно?",o:["Усі C є A","Деякі C не B","Усі A є C","A і C не пов'язані"],a:2},

{t:"focus",q:"Яке слово написане двічі?",o:["NEURO","FOCUS","MIND","NEURO"],a:3},
{t:"focus",q:"Який елемент зайвий?",o:["●●","▲▲","■■","●●"],a:2},

{t:"mind",q:"Ти бачиш напис «Не заходити». Що точно відомо?",o:["Там небезпечно","Заходити заборонено","Двері зачинені","Там нікого немає"],a:1},
{t:"mind",q:"Тільки одна кнопка правильна. A — неправильна. C — неправильна. Яка залишається?",o:["A","B","C","Жодна"],a:1},

{t:"space",q:"Що буде праворуч від тебе, якщо ти розвернешся на 180°?",o:["Те саме","Те, що було ліворуч","Те, що було позаду","Нічого"],a:1},

{t:"mind",q:"Усі LUM сині. Деякі сині предмети круглі. Що точно можливо?",o:["Усі LUM круглі","Деякі LUM можуть бути круглими","Жоден LUM круглий","Усі круглі — LUM"],a:1},

{t:"focus",q:"Скільки разів зустрічається символ ★?",o:["1","2","3","4"],a:2,display:"★ ● ★ ▲ ★"},
{t:"focus",q:"Який символ зайвий у рядку?",o:["▲","●","■","◆"],a:2,display:"▲ ● ■ ◆ ■"},
{t:"mind",q:"Що спільного між ключем і замком?",o:["Вони завжди разом","Ключ може відкривати замок","Замок відкриває ключ","Нічого"],a:1}

];

let pool=[];

function shuffle(a){
 a=[...a];
 for(let i=a.length-1;i;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function nextQ(){
 if(!pool.length)pool=shuffle(Q);
 current=pool.pop();
 renderQ();
}

function renderQ(){

 let q=current;

 $("challenge").innerHTML=`
  <div class="challengeTitle">${q.t.toUpperCase()}</div>
  <div class="question">${q.q}</div>
  ${q.display?`<div class="sub" style="font-size:25px">${q.display}</div>`:""}
  <div class="answers">
   ${q.o.map((x,i)=>`<button class="answer" data-i="${i}">${x}</button>`).join("")}
  </div>
 `;

 animateNEX(q.t==="focus"?"think":"talk");

 say(
  q.t==="focus"
  ?"Уважно. Подивись ще раз."
  :"Не поспішай. Подумай."
 );

 $("challenge").querySelectorAll(".answer").forEach(btn=>{
  btn.addEventListener("pointerdown",()=>{
   answer(+btn.dataset.i,btn);
  },{once:true});
 });

 hud();
}

function answer(i,btn){

 let buttons=[...$("challenge").querySelectorAll(".answer")];
 buttons.forEach(x=>x.disabled=true);

 S.total++;

 if(i===current.a){

  btn.classList.add("good");
  S.correct++;
  S.combo++;
  S.bestCombo=Math.max(S.bestCombo,S.combo);

  S.score+=70+Math.min(S.combo,10)*8;

  if(current.t==="mind"||current.t==="space"||current.t==="switch")S.mind+=7;
  if(current.t==="focus")S.focus+=9;

  good();
  vibrate(20);
  animateNEX("happy");

  if(S.combo%5===0){
   S.score+=150;
   toast("🔥 COMBO BONUS!");
  }

  if(S.combo%4===0&&S.lives<3){
   S.lives++;
   toast("❤️ Життя відновлено");
  }

  setTimeout(nextTask,430);

 }else{

  btn.classList.add("bad");
  if(buttons[current.a])buttons[current.a].classList.add("good");

  S.lives--;
  S.combo=0;

  bad();
  vibrate(70);
  animateNEX("sad");

  say("Майже. Не поспішай.");

  setTimeout(()=>{
   if(S.lives<=0)gameOver();
   else nextTask();
  },650);
 }

 hud();
}


/* =====================================================
 FLOW: 4 LOGIC + 1 MOTOR
===================================================== */

function startGame(){

 audioStart();

 S={
  level:1,block:1,step:0,score:0,lives:3,combo:0,bestCombo:0,
  mind:0,focus:0,memory:0,reflex:0,motor:0,total:0,correct:0,
  difficulty:localStorage.getItem("neuroDifficulty")||"normal",
  music:localStorage.getItem("neuroMusic")!=="off",
  sfx:localStorage.getItem("neuroSfx")!=="off"
 };

 pool=shuffle(Q);

 show("game");
 say("Чотири завдання. Потім перевіримо реакцію.");
 nextTask();
}

function nextTask(){

 if(S.lives<=0){gameOver();return}

 if(S.step<4){
  S.step++;
  nextQ();
 }else{
  S.step=5;
  hud();
  setTimeout(startMotor,250);
 }
}


/* =====================================================
 MOTOR SELECT
===================================================== */

function startMotor(){

 let list=["ball","reaction","tracking","precision","memory"];

 let type=list[Math.floor(Math.random()*list.length)];

 if(type==="ball")ball();
 if(type==="reaction")reaction();
 if(type==="tracking")tracking();
 if(type==="precision")precision();
 if(type==="memory")memoryMotor();

}


/* =====================================================
 BALL
===================================================== */

function ball(){

 let hits=0,time=20;

 $("challenge").innerHTML=`
  <div class="challengeTitle">MOTOR • CATCH</div>
  <div class="question">Злови 10 синіх</div>

  <div class="motorInfo">
   <span>🎯 <b id="hits">0</b>/10</span>
   <span>⏱️ <b id="time">20</b>s</span>
  </div>

  <div class="motorArea" id="ballArea"></div>
 `;

 animateNEX("talk");
 say("Сині — лови. Червоні — пастка. Жовті — бонус.");

 let area=$("ballArea");

 function spawn(){

  let b=document.createElement("div");

  let r=Math.random();
  let type=r<.68?"blue":r<.88?"red":"yellow";

  b.className="ball "+type;

  b.style.left=Math.random()*82+"%";
  b.style.top=Math.random()*75+"%";

  area.appendChild(b);

  b.addEventListener("pointerdown",e=>{

   e.stopPropagation();

   if(type==="red"){
    S.lives--;
    S.combo=0;
    bad();vibrate(70);
    animateNEX("sad");
    toast("🔴 ПАСТКА!");
    b.remove();
    hud();
    if(S.lives<=0)finishMotor(false);
    return;
   }

   if(type==="yellow"){
    time=Math.min(25,time+2);
    S.score+=60;
    toast("🟡 +2 секунди");
    vibrate(25);
    b.remove();
    return;
   }

   hits++;
   S.motor+=3;
   S.score+=45;
   S.reflex+=3;

   $("hits").textContent=hits;

   good();vibrate(18);
   b.remove();

   if(hits>=10)finishMotor(true);

  });

  setTimeout(()=>{if(b.isConnected)b.remove()},900);

 }

 let move=setInterval(spawn,Math.max(500,700/cfg().speed));

 let clock=setInterval(()=>{

  time--;
  $("time").textContent=time;

  if(time<=0){

   clearInterval(move);
   clearInterval(clock);

   finishMotor(false);

  }

 },1000);

 cleanup=()=>{
  clearInterval(move);
  clearInterval(clock);
 };

 spawn();
}


/* =====================================================
 REACTION
===================================================== */

function reaction(){

 $("challenge").innerHTML=`
  <div class="challengeTitle">MOTOR • REFLEX</div>
  <div class="question">Натисни тільки коли стане зеленим</div>
  <div class="target" id="target">ЧЕКАЙ</div>
  <button class="bigBtn" id="reactBtn">НЕ НАТИСКАЙ</button>
 `;

 animateNEX("think");
 say("Не поспішай. Рано — помилка.");

 let ready=false,done=false;

 let wait=setTimeout(()=>{
  ready=true;
  $("target").classList.add("ready");
  $("target").textContent="НАТИСКАЙ";
  $("reactBtn").textContent="⚡ ТИСНИ!";
 },(850+Math.random()*2100)/cfg().speed);

 function click(){

  if(done)return;
  done=true;
  clearTimeout(wait);

  if(!ready){
   S.lives--;
   S.combo=0;
   bad();animateNEX("sad");
   finishMotor(false);
   return;
  }

  S.total++;
  S.correct++;
  S.reflex+=12;

  successMotor();
 }

 $("reactBtn").addEventListener("pointerdown",click);

 cleanup=()=>{
  clearTimeout(wait);
 };

}

function successMotor(){

 S.combo++;
 S.bestCombo=Math.max(S.bestCombo,S.combo);
 S.score+=130+Math.min(S.combo,10)*8;

 good();vibrate(25);
 animateNEX("happy");

 finishMotor(true);
}


/* =====================================================
 TRACKING
===================================================== */

function tracking(){

 $("challenge").innerHTML=`
  <div class="challengeTitle">MOTOR • TRACK</div>
  <div class="question">Запам'ятай клітинку</div>
  <div class="grid3" id="grid"></div>
 `;

 animateNEX("think");
 say("Дивись уважно. Ціль зникне.");

 let round=0;

 function roundStart(){

  let grid=$("grid");
  grid.innerHTML="";

  let cells=[];

  for(let i=0;i<9;i++){
   let c=document.createElement("div");
   c.className="cell";
   grid.appendChild(c);
   cells.push(c);
  }

  let target=Math.floor(Math.random()*9);

  setTimeout(()=>{
   cells[target].classList.add("on");

   setTimeout(()=>{
    cells[target].classList.remove("on");
   },430/cfg().speed);

  },150);

  cells.forEach((c,i)=>{
   c.onpointerdown=()=>{

    if(i!==target){
     S.lives--;
     S.combo=0;
     bad();animateNEX("sad");
     finishMotor(false);
     return;
    }

    round++;
    S.total++;
    S.correct++;
    S.focus+=5;
    S.motor+=4;
    S.combo++;

    good();vibrate(18);
    animateNEX("happy");

    if(round>=5){
     finishMotor(true);
    }else{
     setTimeout(roundStart,260);
    }

   };
  });

 }

 roundStart();
}


/* =====================================================
 PRECISION
===================================================== */

function precision(){

 $("challenge").innerHTML=`
  <div class="challengeTitle">MOTOR • PRECISION</div>
  <div class="question">Зупини ціль у зеленій зоні</div>

  <div class="track" id="track">
   <div class="zone"></div>
   <div class="cursor" id="cursor"></div>
  </div>

  <button class="bigBtn" id="stop">ЗУПИНИТИ</button>
 `;

 animateNEX("think");
 say("Точність. Не поспішай.");

 let x=0,dir=1,stopped=false;

 function loop(){

  if(stopped)return;

  x+=dir*(1.15*cfg().speed);

  if(x>90)dir=-1;
  if(x<0)dir=1;

  $("cursor").style.left=x+"%";

  requestAnimationFrame(loop);
 }

 loop();

 $("stop").addEventListener("pointerdown",()=>{

  if(stopped)return;

  stopped=true;

  let center=x+5;

  if(center>=42&&center<=58){
   S.total++;S.correct++;S.motor+=12;
   successMotor();
  }else{
   S.lives--;S.combo=0;
   bad();animateNEX("sad");
   finishMotor(false);
  }

 });

 cleanup=()=>{stopped=true};
}


/* =====================================================
 MEMORY MOTOR
===================================================== */

function memoryMotor(){

 let symbols=["●","▲","◆","★","■","✦","⬟"];
 let count=cfg().mem;
 let sequence=shuffle(symbols).slice(0,count);

 $("challenge").innerHTML=`
  <div class="challengeTitle">MOTOR • MEMORY</div>
  <div class="question">Запам'ятай порядок</div>

  <div class="memory">
   ${sequence.map(x=>`<div class="memoryItem">${x}</div>`).join("")}
  </div>

  <div class="sub">Через мить повтори його</div>
 `;

 animateNEX("think");
 say("Запам'ятай послідовність.");

 setTimeout(()=>{

  let pos=0;

  $("challenge").innerHTML=`
   <div class="challengeTitle">MEMORY MOTOR</div>
   <div class="question">Повтори послідовність</div>

   <div class="memory">
    ${shuffle(sequence).map(x=>`
     <button class="memoryItem memBtn" data-x="${x}">${x}</button>
    `).join("")}
   </div>
  `;

  $("challenge").querySelectorAll(".memBtn").forEach(btn=>{

   btn.addEventListener("pointerdown",()=>{

    if(btn.dataset.x!==sequence[pos]){

     S.lives--;
     S.combo=0;
     bad();animateNEX("sad");
     finishMotor(false);
     return;

    }

    btn.style.background="#17684f";
    pos++;

    S.total++;
    S.correct++;
    S.memory+=8;

    good();vibrate(20);

    if(pos>=sequence.length){
     successMotor();
    }

   });

  });

 },1100/cfg().time);

}


/* =====================================================
 MOTOR FINISH
===================================================== */

function finishMotor(ok){

 if(cleanup){
  cleanup();
  cleanup=null;
 }

 if(ok){

  S.level++;
  S.block++;
  S.step=0;

  S.score+=180;

  animateNEX("victory");
  say("Блок пройден! Готовий до наступного?");

  setTimeout(nextTask,700);

 }else{

  if(S.lives<=0){
   gameOver();
   return;
  }

  S.level++;
  S.block++;
  S.step=0;

  setTimeout(nextTask,700);

 }

 hud();
}


/* =====================================================
 GAME OVER
===================================================== */

function gameOver(){

 if(cleanup){
  cleanup();
  cleanup=null;
 }

 localStorage.setItem(
  "neuroBest",
  Math.max(+localStorage.getItem("neuroBest")||0,S.score)
 );

 localStorage.setItem(
  "neuroBestLevel",
  Math.max(+localStorage.getItem("neuroBestLevel")||0,S.level)
 );

 localStorage.setItem(
  "neuroGames",
  (+localStorage.getItem("neuroGames")||0)+1
 );

 $("finalScore").textContent=S.score;

 $("mind").textContent=Math.min(100,S.mind);
 $("focus").textContent=Math.min(100,S.focus);
 $("memory").textContent=Math.min(100,S.memory);
 $("reflex").textContent=Math.min(100,S.reflex);
 $("motor").textContent=Math.min(100,S.motor);
 $("combo").textContent=S.bestCombo;

 show("result");

 animateNEX("sad");
}


/* =====================================================
 SETTINGS
===================================================== */

document.querySelectorAll("[data-d]").forEach(btn=>{

 btn.addEventListener("pointerdown",()=>{

  S.difficulty=btn.dataset.d;

  localStorage.setItem("neuroDifficulty",S.difficulty);

  settingsUI();
  toast("Складність змінено");

 });

});

function settingsUI(){

 document.querySelectorAll("[data-d]").forEach(b=>{
  b.classList.toggle("active",b.dataset.d===S.difficulty);
 });

 $("music").textContent=S.music?"🎵 Музика: ON":"🎵 Музика: OFF";
 $("sfx").textContent=S.sfx?"🔊 Ефекти: ON":"🔊 Ефекти: OFF";
}

$("music").addEventListener("pointerdown",()=>{
 S.music=!S.music;
 localStorage.setItem("neuroMusic",S.music?"on":"off");
 settingsUI();
});

$("sfx").addEventListener("pointerdown",()=>{
 S.sfx=!S.sfx;
 localStorage.setItem("neuroSfx",S.sfx?"on":"off");
 settingsUI();
});

$("settingsBtn").addEventListener("pointerdown",()=>{
 $("modal").classList.remove("hidden");
 settingsUI();
});

$("close").addEventListener("pointerdown",()=>{
 $("modal").classList.add("hidden");
});


/* =====================================================
 BUTTONS
===================================================== */

$("startBtn").addEventListener("pointerdown",startGame);

$("dailyBtn").addEventListener("pointerdown",startGame);

$("homeBtn").addEventListener("pointerdown",()=>{

 show("start");

 say("Повернувся? Я вже готовий до нового випробування.");

 refresh();

});


function refresh(){

 $("best").textContent=localStorage.getItem("neuroBest")||0;
 $("bestLevel").textContent=localStorage.getItem("neuroBestLevel")||0;
 $("games").textContent=localStorage.getItem("neuroGames")||0;

}


/* INIT */

refresh();
settingsUI();

</script>
