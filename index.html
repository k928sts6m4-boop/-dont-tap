<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEURO — Doctor NEX</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#030714;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font:inherit;
  color:#fff;
  cursor:pointer;
}

.hidden{display:none!important}

.app{
  width:min(100%,760px);
  margin:auto;
  min-height:100vh;
  padding:18px;
}

/* =========================
   LOGO
========================= */

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:5px;
  color:#55e8ff;
  text-shadow:0 0 25px #18cfff;
}

.subtitle{
  text-align:center;
  color:#7890b5;
  font-size:12px;
  letter-spacing:3px;
  margin-bottom:16px;
}

/* =========================
   NEX STAGE
========================= */

.nex-stage{
  height:290px;
  border:1px solid #12375b;
  border-radius:24px;
  background:
    radial-gradient(circle at 50% 70%,rgba(0,220,255,.15),transparent 45%),
    linear-gradient(145deg,#09132e,#071022);
  position:relative;
  overflow:hidden;
  margin-bottom:14px;
}

.nex-stage.game-stage{
  height:285px;
}

.nex-stage:after{
  content:"";
  position:absolute;
  bottom:-80px;
  left:50%;
  transform:translateX(-50%);
  width:340px;
  height:150px;
  background:#073a60;
  filter:blur(35px);
  opacity:.55;
}

/* =========================
   NEX CHARACTER
========================= */

.nex{
  position:absolute;
  left:50%;
  bottom:4px;
  width:150px;
  height:225px;
  transform:translateX(-50%);
  z-index:5;
  transform-origin:50% 90%;
  transition:filter .2s;
}

/* HEAD */

.nex-head{
  position:absolute;
  width:92px;
  height:92px;
  left:29px;
  top:0;
  background:#ffd0a3;
  border-radius:45% 45% 48% 48%;
  z-index:5;
  box-shadow:0 4px 15px #0005;
  transition:.2s;
}

.nex-hair{
  position:absolute;
  width:94px;
  height:42px;
  left:-1px;
  top:-2px;
  background:#74492f;
  border-radius:35px 35px 12px 12px;
}

.eye{
  position:absolute;
  width:9px;
  height:13px;
  background:#152640;
  border-radius:50%;
  top:49px;
  transition:.2s;
}

.eye.left{left:26px}
.eye.right{right:26px}

.nex-mouth{
  position:absolute;
  width:28px;
  height:12px;
  left:32px;
  top:68px;
  border-bottom:3px solid #743e3b;
  border-radius:0 0 50% 50%;
  transition:.2s;
}

/* BODY */

.nex-body{
  position:absolute;
  width:108px;
  height:125px;
  left:21px;
  top:83px;
  background:#f7faff;
  border-radius:25px 25px 15px 15px;
  box-shadow:0 8px 20px #0005;
}

.nex-shirt{
  position:absolute;
  width:45px;
  height:103px;
  left:31px;
  top:10px;
  background:#092747;
  border-radius:5px 5px 12px 12px;
}

.nex-shirt:after{
  content:"N";
  position:absolute;
  top:30px;
  width:100%;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#51e8ff;
}

.stethoscope{
  position:absolute;
  width:52px;
  height:63px;
  left:27px;
  top:2px;
  border:3px solid #172e47;
  border-top:0;
  border-radius:0 0 30px 30px;
}

.stethoscope:after{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  background:#172e47;
  border-radius:50%;
  left:18px;
  bottom:-7px;
}

/* ARMS */

.arm{
  position:absolute;
  width:28px;
  height:88px;
  background:#f7faff;
  border-radius:18px;
  top:95px;
  z-index:1;
  transform-origin:top center;
  transition:.2s;
}

.arm.left{
  left:4px;
  transform:rotate(12deg);
}

.arm.right{
  right:4px;
  transform:rotate(-12deg);
}

/* =========================
   SPEECH
========================= */

.nex-bubble{
  position:absolute;
  left:12px;
  top:12px;
  max-width:300px;
  padding:13px 15px;
  border:1px solid #16d9ff;
  border-radius:16px;
  background:#061426ee;
  color:#e9fbff;
  font-size:14px;
  line-height:1.25;
  z-index:20;
  box-shadow:0 0 18px #00d9ff25;
  transition:.2s;
}

/* =========================
   NEX REACTIONS
========================= */

.nex.happy{
  animation:nexHappy 1.15s ease;
  filter:drop-shadow(0 0 22px #2dffb4);
}

.nex.sad{
  animation:nexSad 1.1s ease;
  filter:drop-shadow(0 0 18px #ff4268);
}

.nex.think{
  animation:nexThink 1s ease;
}

.nex.surprise{
  animation:nexSurprise 1s ease;
  filter:drop-shadow(0 0 25px #ffe14a);
}

.nex.encourage{
  animation:nexEncourage 1s ease;
}

.nex.combo{
  animation:nexCombo 1.25s ease;
  filter:drop-shadow(0 0 35px #28eaff);
}

.nex.victory{
  animation:nexVictory 1.5s ease;
  filter:drop-shadow(0 0 40px #2dffb4);
}

/* HAPPY FACE */

.nex.happy .nex-mouth,
.nex.combo .nex-mouth,
.nex.victory .nex-mouth{
  width:36px;
  height:20px;
  left:28px;
  top:65px;
  border-bottom:5px solid #743e3b;
  border-radius:0 0 50% 50%;
}

.nex.happy .eye,
.nex.combo .eye,
.nex.victory .eye{
  transform:scaleY(.75);
}

/* SAD FACE */

.nex.sad .nex-mouth{
  width:28px;
  height:12px;
  left:32px;
  top:76px;
  border-top:4px solid #743e3b;
  border-bottom:0;
  border-radius:50% 50% 0 0;
}

.nex.sad .eye{
  transform:translateY(4px);
}

/* SURPRISE FACE */

.nex.surprise .nex-mouth{
  width:18px;
  height:18px;
  left:37px;
  top:67px;
  border:4px solid #743e3b;
  border-radius:50%;
}

.nex.surprise .eye{
  transform:scale(1.25);
}

/* THINK */

.nex.think .eye.left{
  transform:translateY(-5px);
}

.nex.think .eye.right{
  transform:translateY(-2px);
}

/* ARM REACTIONS */

.nex.happy .arm.left,
.nex.combo .arm.left,
.nex.victory .arm.left{
  animation:armLeftHappy 1s ease;
}

.nex.happy .arm.right,
.nex.combo .arm.right,
.nex.victory .arm.right{
  animation:armRightHappy 1s ease;
}

.nex.sad .arm.left{
  animation:armSadLeft 1s ease;
}

.nex.sad .arm.right{
  animation:armSadRight 1s ease;
}

@keyframes armLeftHappy{
  0%,100%{transform:rotate(12deg)}
  40%{transform:rotate(-35deg) translateY(-8px)}
  70%{transform:rotate(-15deg)}
}

@keyframes armRightHappy{
  0%,100%{transform:rotate(-12deg)}
  40%{transform:rotate(35deg) translateY(-8px)}
  70%{transform:rotate(15deg)}
}

@keyframes armSadLeft{
  0%,100%{transform:rotate(12deg)}
  50%{transform:rotate(28deg)}
}

@keyframes armSadRight{
  0%,100%{transform:rotate(-12deg)}
  50%{transform:rotate(-28deg)}
}

/* BODY ANIMATIONS */

@keyframes nexHappy{
  0%{
    transform:translateX(-50%) scale(1);
  }
  20%{
    transform:translateX(-50%) translateY(-22px) scale(1.08) rotate(-5deg);
  }
  40%{
    transform:translateX(-50%) translateY(0) scale(1.04) rotate(5deg);
  }
  60%{
    transform:translateX(-50%) translateY(-14px) scale(1.06) rotate(-3deg);
  }
  80%{
    transform:translateX(-50%) translateY(0) rotate(2deg);
  }
  100%{
    transform:translateX(-50%) scale(1);
  }
}

@keyframes nexSad{
  0%{
    transform:translateX(-50%) rotate(0);
  }
  20%{
    transform:translateX(-50%) rotate(-12deg);
  }
  40%{
    transform:translateX(-50%) rotate(12deg);
  }
  60%{
    transform:translateX(-50%) rotate(-8deg);
  }
  80%{
    transform:translateX(-50%) rotate(5deg);
  }
  100%{
    transform:translateX(-50%) rotate(0);
  }
}

@keyframes nexThink{
  0%{
    transform:translateX(-50%);
  }
  30%{
    transform:translateX(-50%) translateX(-10px) rotate(-3deg);
  }
  60%{
    transform:translateX(-50%) translateX(10px) rotate(3deg);
  }
  100%{
    transform:translateX(-50%);
  }
}

@keyframes nexSurprise{
  0%{
    transform:translateX(-50%) scale(1);
  }
  25%{
    transform:translateX(-50%) scale(1.18) translateY(-8px);
  }
  50%{
    transform:translateX(-50%) scale(.94);
  }
  75%{
    transform:translateX(-50%) scale(1.12);
  }
  100%{
    transform:translateX(-50%) scale(1);
  }
}

@keyframes nexEncourage{
  0%{
    transform:translateX(-50%);
  }
  20%{
    transform:translateX(-50%) rotate(-8deg);
  }
  40%{
    transform:translateX(-50%) rotate(8deg);
  }
  60%{
    transform:translateX(-50%) rotate(-8deg);
  }
  80%{
    transform:translateX(-50%) rotate(5deg);
  }
  100%{
    transform:translateX(-50%);
  }
}

@keyframes nexCombo{
  0%{
    transform:translateX(-50%) scale(1);
  }
  25%{
    transform:translateX(-50%) translateY(-28px) scale(1.2);
  }
  50%{
    transform:translateX(-50%) translateY(0) scale(.96);
  }
  75%{
    transform:translateX(-50%) translateY(-16px) scale(1.12);
  }
  100%{
    transform:translateX(-50%) scale(1);
  }
}

@keyframes nexVictory{
  0%{
    transform:translateX(-50%) scale(1);
  }
  20%{
    transform:translateX(-50%) translateY(-32px) rotate(-8deg) scale(1.1);
  }
  40%{
    transform:translateX(-50%) translateY(0) rotate(8deg);
  }
  60%{
    transform:translateX(-50%) translateY(-24px) rotate(-5deg) scale(1.08);
  }
  80%{
    transform:translateX(-50%) translateY(0) rotate(4deg);
  }
  100%{
    transform:translateX(-50%);
  }
}

/* =========================
   CARDS
========================= */

.card{
  background:#071128;
  border:1px solid #153359;
  border-radius:22px;
  padding:18px;
  margin-bottom:12px;
}

/* =========================
   BUTTONS
========================= */

.bigbtn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px;
  font-weight:900;
  font-size:18px;
  background:linear-gradient(100deg,#16d5ee,#5268ff);
  box-shadow:0 8px 25px #176eff30;
}

.smallrow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.smallbtn{
  border:1px solid #18385f;
  background:#0c1935;
  border-radius:13px;
  padding:14px;
}

/* =========================
   HUD
========================= */

.hud{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:8px;
}

.hudbox{
  background:#071128;
  border:1px solid #153359;
  border-radius:18px;
  padding:10px;
  text-align:center;
}

.hudbox small{
  color:#7185a7;
  display:block;
  font-size:10px;
  text-transform:uppercase;
}

.hudbox strong{
  color:#53e5ff;
  font-size:18px;
}

.progress{
  height:7px;
  border-radius:10px;
  background:#0d1c36;
  overflow:hidden;
  margin-bottom:12px;
}

.progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#1ad7ed,#5d62ff);
  width:0;
  transition:.3s;
}

/* =========================
   QUESTIONS
========================= */

.type{
  color:#4de4ff;
  text-align:center;
  font-size:12px;
  letter-spacing:2px;
  font-weight:bold;
  margin-bottom:15px;
}

.question{
  font-size:21px;
  font-weight:800;
  text-align:center;
  line-height:1.3;
  margin-bottom:20px;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.answer{
  min-height:62px;
  border:1px solid #203d69;
  background:#0d1b38;
  border-radius:14px;
  padding:12px;
  font-weight:bold;
  transition:.15s;
}

.answer:hover{
  border-color:#34dcff;
  transform:translateY(-2px);
}

.answer.correct{
  background:#0c573d;
  border-color:#2dffb2;
}

.answer.wrong{
  background:#632536;
  border-color:#ff5575;
}

/* =========================
   MOTOR
========================= */

.motor{
  position:relative;
  height:350px;
  border:1px solid #17385f;
  border-radius:20px;
  overflow:hidden;
  background:#050d1e;
}

.motor-info{
  text-align:center;
  margin-bottom:10px;
  color:#8ea3c7;
}

.ball{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#24dfff;
  box-shadow:0 0 25px #24dfff;
  cursor:pointer;
}

.reaction-zone{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
}

.react-btn{
  width:190px;
  height:190px;
  border-radius:50%;
  border:5px solid #233c66;
  background:#101d3b;
  font-size:25px;
  font-weight:900;
}

.react-btn.go{
  background:#1de5a3;
  color:#03130f;
  border-color:#7affd0;
}

/* =========================
   RESULT
========================= */

.result{
  text-align:center;
}

.result h1{
  color:#55e8ff;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  padding:16px;
  background:#0c1935;
  border:1px solid #193860;
  border-radius:14px;
}

.stat b{
  display:block;
  font-size:22px;
  color:#52e5ff;
}

.stat span{
  color:#788eaf;
  font-size:11px;
}

/* =========================
   SETTINGS
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modalbox{
  width:min(100%,480px);
  background:#08142d;
  border:1px solid #1d426e;
  border-radius:22px;
  padding:20px;
}

.diff{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.diff button{
  padding:13px;
  border:1px solid #1a3b63;
  background:#0d1b37;
  border-radius:12px;
}

.diff button.active{
  background:#174b67;
  border-color:#38e3ff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .app{
    padding:12px;
  }

  .logo{
    font-size:34px;
  }

  .nex-stage{
    height:280px;
  }

  .nex-stage.game-stage{
    height:275px;
  }

  .question{
    font-size:18px;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .motor{
    height:300px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================
     START
========================= -->

<section id="start">

  <div class="logo">NEURO</div>

  <div class="subtitle">
    MIND • FOCUS • REFLEX • MOTOR
  </div>

  <div class="nex-stage">

    <div id="startBubble" class="nex-bubble">
      Привіт! Я Doctor NEX. Перевіримо твій мозок?
    </div>

    <div id="nexStart" class="nex">

      <div class="nex-head">
        <div class="nex-hair"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nex-mouth"></div>
      </div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="nex-body">
        <div class="nex-shirt"></div>
        <div class="stethoscope"></div>
      </div>

    </div>

  </div>

  <div class="hud">

    <div class="hudbox">
      <small>Рекорд</small>
      <strong id="best">0</strong>
    </div>

    <div class="hudbox">
      <small>Рівень</small>
      <strong id="levelStart">1</strong>
    </div>

    <div class="hudbox">
      <small>Ігр</small>
      <strong>3</strong>
    </div>

  </div>

  <button class="bigbtn" id="startBtn">
    🧠 ПОЧАТИ NEURO
  </button>

  <div class="smallrow">

    <button class="smallbtn" id="dailyBtn">
      📅 DAILY
    </button>

    <button class="smallbtn" id="settingsBtn">
      ⚙️ НАЛАШТУВАННЯ
    </button>

  </div>

</section>


<!-- =========================
     GAME
========================= -->

<section id="game" class="hidden">

  <div class="hud">

    <div class="hudbox">
      <small>Блок</small>
      <strong id="block">1</strong>
    </div>

    <div class="hudbox">
      <small>Життя</small>
      <strong id="lives">❤️ ❤️ ❤️</strong>
    </div>

    <div class="hudbox">
      <small>Очки</small>
      <strong id="score">0</strong>
    </div>

  </div>

  <div class="progress">
    <i id="progress"></i>
  </div>

  <div class="nex-stage game-stage">

    <div id="gameBubble" class="nex-bubble">
      Не поспішай. Подумай.
    </div>

    <div id="nexGame" class="nex">

      <div class="nex-head">
        <div class="nex-hair"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nex-mouth"></div>
      </div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="nex-body">
        <div class="nex-shirt"></div>
        <div class="stethoscope"></div>
      </div>

    </div>

  </div>

  <div id="challenge" class="card"></div>

</section>


<!-- =========================
     RESULT
========================= -->

<section id="result" class="hidden">

  <div class="card result">

    <h1>NEURO COMPLETE</h1>

    <div
      style="font-size:46px;font-weight:900"
      id="finalScore"
    >
      0
    </div>

    <div style="color:#7186a8">
      ОЧКИ
    </div>

    <br>

    <div class="stats">

      <div class="stat">
        <b id="rMind">0</b>
        <span>MIND</span>
      </div>

      <div class="stat">
        <b id="rFocus">0</b>
        <span>FOCUS</span>
      </div>

      <div class="stat">
        <b id="rMemory">0</b>
        <span>MEMORY</span>
      </div>

      <div class="stat">
        <b id="rReflex">0</b>
        <span>REFLEX</span>
      </div>

      <div class="stat">
        <b id="rMotor">0</b>
        <span>MOTOR</span>
      </div>

      <div class="stat">
        <b id="rCombo">0</b>
        <span>BEST COMBO</span>
      </div>

    </div>

    <br>

    <button
      class="bigbtn"
      onclick="goHome()"
    >
      🏠 НА ГОЛОВНИЙ ЕКРАН
    </button>

  </div>

</section>

</div>


<!-- =========================
     SETTINGS
========================= -->

<div id="settingsModal" class="modal hidden">

  <div class="modalbox">

    <h2>⚙️ Налаштування</h2>

    <p>Складність</p>

    <div class="diff">

      <button data-diff="easy">
        Easy
      </button>

      <button data-diff="normal">
        Normal
      </button>

      <button data-diff="hard">
        Hard
      </button>

      <button data-diff="expert">
        Expert
      </button>

      <button data-diff="adaptive">
        Adaptive
      </button>

    </div>

    <br>

    <button
      class="smallbtn"
      style="width:100%"
      id="closeSettings"
    >
      ЗАКРИТИ
    </button>

  </div>

</div>


<script>

/* =========================================================
   STATE
========================================================= */

const S = {

  level:1,
  block:1,
  step:0,

  score:0,
  lives:3,

  combo:0,
  bestCombo:0,

  mind:0,
  focus:0,
  memory:0,
  reflex:0,
  motor:0,

  correct:0,
  total:0,

  difficulty:
    localStorage.getItem("neuroDifficulty") || "normal"
};


const DIFF = {

  easy:{
    speed:.72,
    time:1.35,
    mem:4
  },

  normal:{
    speed:1,
    time:1,
    mem:5
  },

  hard:{
    speed:1.25,
    time:.78,
    mem:6
  },

  expert:{
    speed:1.55,
    time:.58,
    mem:7
  },

  adaptive:{
    speed:1,
    time:1,
    mem:5
  }

};


function difficulty(){

  if(S.difficulty !== "adaptive"){
    return DIFF[S.difficulty];
  }

  const rate =
    S.total
      ? S.correct/S.total
      : .5;

  if(rate>.8){
    return DIFF.hard;
  }

  if(rate<.45){
    return DIFF.easy;
  }

  return DIFF.normal;
}


/* =========================================================
   NEX ENGINE
========================================================= */

const nexStart =
  document.getElementById("nexStart");

const nexGame =
  document.getElementById("nexGame");


let nexTimer=null;


function clearNexReaction(nex){

  nex.classList.remove(
    "happy",
    "sad",
    "think",
    "surprise",
    "encourage",
    "combo",
    "victory"
  );

}


function nexReact(type,text){

  /*
     Під час гри завжди реагує саме NEX у грі.
  */

  const inGame =
    !document
      .getElementById("game")
      .classList
      .contains("hidden");

  const nex =
    inGame
      ? nexGame
      : nexStart;

  const bubble =
    inGame
      ? document.getElementById("gameBubble")
      : document.getElementById("startBubble");


  clearTimeout(nexTimer);

  clearNexReaction(nex);

  /*
     Перезапуск CSS animation
  */

  void nex.offsetWidth;

  nex.classList.add(type);

  bubble.textContent=text;


  /*
     Реакція залишається достатньо довго,
     щоб її було видно.
  */

  nexTimer=setTimeout(()=>{

    clearNexReaction(nex);

  },1500);

}

/* =========================================================
   UI
========================================================= */

const start =
  document.getElementById("start");

const game =
  document.getElementById("game");

const result =
  document.getElementById("result");

const challenge =
  document.getElementById("challenge");


function updateHUD(){

  document.getElementById("block")
    .textContent=S.block;

  document.getElementById("score")
    .textContent=S.score;

  document.getElementById("lives")
    .textContent=
      "❤️".repeat(S.lives)+
      "🖤".repeat(Math.max(0,3-S.lives));

  document.getElementById("progress")
    .style.width=
      `${(S.step/5)*100}%`;

}


function randomQ(){

  return Q[
    Math.floor(
      Math.random()*Q.length
    )
  ];

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

  S.level=1;
  S.block=1;
  S.step=0;

  S.score=0;
  S.lives=3;

  S.combo=0;
  S.bestCombo=0;

  S.mind=0;
  S.focus=0;
  S.memory=0;
  S.reflex=0;
  S.motor=0;

  S.correct=0;
  S.total=0;


  start.classList.add("hidden");
  result.classList.add("hidden");
  game.classList.remove("hidden");


  nexReact(
    "encourage",
    "Починаємо! 4 завдання для мозку — потім реакція."
  );


  updateHUD();

  nextTask();

}


/* =========================================================
   TASK FLOW
========================= */

function nextTask(){

  updateHUD();


  if(S.lives<=0){

    finishGame();
    return;

  }


  /*
     4 логічних завдання
  */

  if(S.step<4){

    S.step++;

    nextQuestion();

  }else{

    /*
       5-те завдання — моторне
    */

    S.step=5;

    startMotor();

  }

}


/* =========================================================
   QUESTION
========================================================= */

let currentQ=null;


function nextQuestion(){

  currentQ=randomQ();


  if(currentQ.type==="MEMORY"){

    NEX.think();

  }else{

    nexReact(
      "think",
      "Спокійно. Шукай закономірність."
    );

  }


  challenge.innerHTML=`

    <div class="type">
      ${currentQ.type}
    </div>

    <div class="question">
      ${currentQ.text}
    </div>

    <div class="answers">

      ${currentQ.answers
        .map((a,i)=>`

          <button
            class="answer"
            data-index="${i}"
          >
            ${a}
          </button>

        `)
        .join("")}

    </div>

  `;


  challenge
    .querySelectorAll(".answer")
    .forEach(btn=>{

      btn.onclick=()=>{

        answerQuestion(
          Number(btn.dataset.index),
          btn
        );

      };

    });

}


/* =========================================================
   ANSWER
========================================================= */

function answerQuestion(index,btn){

  const buttons =
    challenge.querySelectorAll(".answer");

  buttons.forEach(
    b=>b.disabled=true
  );


  S.total++;


  const good =
    index===currentQ.correct;


  if(good){

    btn.classList.add("correct");

    S.correct++;

    S.combo++;

    S.bestCombo=
      Math.max(
        S.bestCombo,
        S.combo
      );

    S.score+=
      100+
      S.combo*10;


    if(currentQ.stat==="mind")
      S.mind++;

    if(currentQ.stat==="focus")
      S.focus++;

    if(currentQ.stat==="memory")
      S.memory++;


    /*
       ГОЛОВНА РЕАКЦІЯ NEX
    */

    NEX.correct();


    updateHUD();


    setTimeout(
      nextTask,
      1100
    );


  }else{

    btn.classList.add("wrong");

    buttons[
      currentQ.correct
    ].classList.add("correct");


    S.lives--;

    S.combo=0;


    /*
       ГОЛОВНА РЕАКЦІЯ NEX
    */

    NEX.wrong();


    updateHUD();


    setTimeout(()=>{

      if(S.lives<=0){

        finishGame();

      }else{

        NEX.lifeLost();

        setTimeout(
          nextTask,
          800
        );

      }

    },1200);

  }

}


/* =========================================================
   MOTOR SELECTOR
========================================================= */

let motorTimer=null;


function startMotor(){

  clearTimeout(motorTimer);


  NEX.motor();


  const motorTypes=[

    motorBall,
    motorReaction,
    motorTracking,
    motorPrecision

  ];


  const fn=
    motorTypes[
      Math.floor(
        Math.random()*
        motorTypes.length
      )
    ];


  setTimeout(
    fn,
    1000
  );

}


/* =========================================================
   MOTOR BALL
========================================================= */

function motorBall(){

  challenge.innerHTML=`

    <div class="type">
      MOTOR • REFLEX
    </div>

    <div class="motor-info">
      Натисни на <b>синю кулю</b> 6 разів.
    </div>

    <div class="motor" id="motorArea"></div>

  `;


  const area=
    document.getElementById("motorArea");


  let hits=0;


  function spawn(){

    if(hits>=6){

      finishMotor(true);
      return;

    }


    const ball=
      document.createElement("div");


    ball.className="ball";


    const maxX=
      area.clientWidth-55;

    const maxY=
      area.clientHeight-55;


    ball.style.left=
      Math.random()*maxX+"px";

    ball.style.top=
      Math.random()*maxY+"px";


    area.innerHTML="";

    area.appendChild(ball);


    ball.onclick=()=>{

      hits++;

      S.reflex++;
      S.motor++;

      S.score+=80;


      NEX.correct();


      updateHUD();

      spawn();

    };


    motorTimer=
      setTimeout(()=>{

        NEX.surprise();

        spawn();

      },1200*difficulty().time);

  }


  spawn();

}


/* =========================================================
   MOTOR REACTION
========================================================= */

function motorReaction(){

  challenge.innerHTML=`

    <div class="type">
      MOTOR • REACTION
    </div>

    <div class="motor-info">
      Чекай зелений сигнал. Потім натисни.
    </div>

    <div class="motor" id="motorArea">

      <div class="reaction-zone">

        <button
          class="react-btn"
          id="reactBtn"
        >
          ЧЕКАЙ
        </button>

      </div>

    </div>

  `;


  const btn=
    document.getElementById("reactBtn");


  let ready=false;
  let finished=false;


  const delay=
    900+
    Math.random()*2300;


  const timer=
    setTimeout(()=>{

      ready=true;

      btn.classList.add("go");

      btn.textContent=
        "НАТИСКАЙ!";


      NEX.surprise();

    },delay);


  btn.onclick=()=>{

    if(finished)
      return;


    if(!ready){

      clearTimeout(timer);

      finished=true;

      S.lives--;

      S.combo=0;


      nexReact(
        "sad",
        "Зарано! Не поспішай."
      );


      updateHUD();


      setTimeout(()=>{

        if(S.lives<=0)
          finishGame();
        else
          finishMotor(false);

      },900);


      return;

    }


    finished=true;


    S.reflex++;
    S.motor++;

    S.score+=150;


    nexReact(
      "happy",
      "⚡ Рефлекс є!"
    );


    updateHUD();


    setTimeout(
      ()=>finishMotor(true),
      900
    );

  };

}


/* =========================================================
   TRACKING
========================================================= */

function motorTracking(){

  challenge.innerHTML=`

    <div class="type">
      MOTOR • TRACKING
    </div>

    <div class="motor-info">
      Встигни натиснути на ціль 5 разів.
    </div>

    <div
      class="motor"
      id="motorArea"
    ></div>

  `;


  const area=
    document.getElementById("motorArea");


  let hits=0;


  function target(){

    if(hits>=5){

      finishMotor(true);
      return;

    }


    const t=
      document.createElement("div");


    t.className="ball";


    t.style.left=
      Math.random()*
      (area.clientWidth-48)+"px";


    t.style.top=
      Math.random()*
      (area.clientHeight-48)+"px";


    area.innerHTML="";

    area.appendChild(t);


    t.onclick=()=>{

      hits++;

      S.motor++;
      S.reflex++;

      S.score+=90;


      NEX.correct();


      updateHUD();

      target();

    };


    motorTimer=
      setTimeout(()=>{

        NEX.encourage();

        target();

      },1000*difficulty().time);

  }


  target();

}


/* =========================================================
   PRECISION
========================================================= */

function motorPrecision(){

  challenge.innerHTML=`

    <div class="type">
      MOTOR • PRECISION
    </div>

    <div class="motor-info">
      Натисни ціль, коли вона в центрі.
    </div>

    <div
      class="motor"
      id="motorArea"
    >

      <div
        style="
        position:absolute;
        width:100px;
        height:100px;
        border:3px dashed #38e3ff;
        border-radius:50%;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        "
      ></div>

      <div
        class="ball"
        id="precisionBall"
      ></div>

    </div>

  `;


  const area=
    document.getElementById("motorArea");

  const ball=
    document.getElementById("precisionBall");


  let x=0;
  let direction=1;
  let hits=0;


  ball.style.top="50%";

  ball.style.transform=
    "translateY(-50%)";


  const loop=
    setInterval(()=>{

      x+=
        direction*
        4*
        difficulty().speed;


      if(x>area.clientWidth-60)
        direction=-1;


      if(x<0)
        direction=1;


      ball.style.left=
        x+"px";

    },20);


  ball.onclick=()=>{

    const center=
      area.clientWidth/2;

    const ballCenter=
      x+24;

    const distance=
      Math.abs(
        center-ballCenter
      );


    if(distance<55){

      hits++;

      S.motor++;
      S.reflex++;

      S.score+=110;


      NEX.correct();


      if(hits>=3){

        clearInterval(loop);

        setTimeout(
          ()=>finishMotor(true),
          700
        );

      }

    }else{

      S.lives--;

      S.combo=0;


      NEX.wrong();


      if(S.lives<=0){

        clearInterval(loop);

        setTimeout(
          finishGame,
          900
        );

      }

    }


    updateHUD();

  };

}


/* =========================================================
   MOTOR FINISH
========================================================= */

function finishMotor(success){

  clearTimeout(motorTimer);


  if(success){

    S.score+=250;

    S.level++;

    S.block++;


    NEX.victory();

  }else{

    S.combo=0;

    NEX.encourage();

  }


  S.step=0;

  updateHUD();


  setTimeout(()=>{

    if(S.lives<=0){

      finishGame();

    }else{

      nextTask();

    }

  },1700);

}


/* =========================================================
   GAME OVER
========================================================= */

function finishGame(){

  clearTimeout(motorTimer);


  game.classList.add("hidden");

  result.classList.remove("hidden");


  document.getElementById(
    "finalScore"
  ).textContent=S.score;


  document.getElementById(
    "rMind"
  ).textContent=S.mind;

  document.getElementById(
    "rFocus"
  ).textContent=S.focus;

  document.getElementById(
    "rMemory"
  ).textContent=S.memory;

  document.getElementById(
    "rReflex"
  ).textContent=S.reflex;

  document.getElementById(
    "rMotor"
  ).textContent=S.motor;

  document.getElementById(
    "rCombo"
  ).textContent=S.bestCombo;


  const old=
    Number(
      localStorage.getItem(
        "neuroBest"
      )||0
    );


  if(S.score>old){

    localStorage.setItem(
      "neuroBest",
      S.score
    );

  }

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

  result.classList.add("hidden");

  game.classList.add("hidden");

  start.classList.remove("hidden");


  document.getElementById(
    "best"
  ).textContent=
    localStorage.getItem(
      "neuroBest"
    )||0;


  document.getElementById(
    "levelStart"
  ).textContent=1;


  nexReact(
    "happy",
    "Готовий перевірити себе ще раз?"
  );

}
