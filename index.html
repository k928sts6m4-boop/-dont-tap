<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEURO — Mind Challenge</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#060812;
    --card:#101421;
    --card2:#161b2a;
    --line:rgba(255,255,255,.08);
    --text:#f5f7ff;
    --muted:#8c94a8;
    --accent:#7c5cff;
    --cyan:#00d9ff;
    --green:#35e77d;
    --red:#ff4d6d;
    --yellow:#ffc857;
}

html,body{
    margin:0;
    min-height:100%;
    background:
        radial-gradient(circle at 50% -10%,rgba(124,92,255,.22),transparent 35%),
        radial-gradient(circle at 100% 100%,rgba(0,217,255,.08),transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font:inherit;
}

.hidden{
    display:none!important;
}

/* ===============================
   START
================================ */

.screen{
    min-height:100vh;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.screen.active{
    display:flex;
}

.container{
    width:100%;
    max-width:720px;
    margin:auto;
}

.logo{
    text-align:center;
    margin-bottom:32px;
}

.logo-icon{
    width:82px;
    height:82px;
    margin:0 auto 20px;
    border-radius:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    background:linear-gradient(135deg,#7c5cff,#4330bd);
    box-shadow:0 25px 80px rgba(124,92,255,.3);
}

.logo h1{
    margin:0;
    font-size:45px;
    font-weight:800;
    letter-spacing:-2px;
}

.logo p{
    color:var(--muted);
    margin:8px 0 0;
}

.panel{
    background:rgba(16,20,33,.92);
    border:1px solid var(--line);
    border-radius:28px;
    padding:26px;
    box-shadow:0 30px 100px rgba(0,0,0,.35);
    backdrop-filter:blur(15px);
}

.start-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}

.start-stat{
    background:var(--card2);
    border-radius:17px;
    padding:16px 8px;
    text-align:center;
}

.start-stat strong{
    display:block;
    font-size:22px;
}

.start-stat span{
    color:var(--muted);
    font-size:10px;
    text-transform:uppercase;
}

.main-btn{
    width:100%;
    border:0;
    border-radius:18px;
    padding:17px;
    color:white;
    cursor:pointer;
    font-size:16px;
    font-weight:800;
    background:linear-gradient(135deg,#7c5cff,#563de4);
    box-shadow:0 15px 35px rgba(124,92,255,.25);
    transition:.18s;
}

.main-btn:active{
    transform:scale(.97);
}

/* ===============================
   GAME
================================ */

#gameScreen{
    display:none;
    min-height:100vh;
    padding:14px;
}

#gameScreen.active{
    display:block;
}

.game-wrap{
    width:100%;
    max-width:950px;
    margin:auto;
}

.hud{
    display:grid;
    grid-template-columns:1fr 1.5fr 1fr;
    gap:10px;
    margin-bottom:9px;
}

.hud-box{
    background:rgba(16,20,33,.92);
    border:1px solid var(--line);
    border-radius:15px;
    padding:10px;
    text-align:center;
}

.hud-box small{
    color:var(--muted);
    display:block;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin-bottom:3px;
}

.hud-box strong{
    font-size:15px;
}

.hearts{
    letter-spacing:3px;
    font-size:14px;
}

.progress{
    height:5px;
    background:#1a2030;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:12px;
}

.progress-fill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,var(--accent),var(--cyan));
    transition:.3s;
}

.challenge{
    min-height:calc(100vh - 110px);
    background:
        radial-gradient(circle at 50% 30%,rgba(124,92,255,.07),transparent 45%),
        rgba(13,17,29,.88);
    border:1px solid var(--line);
    border-radius:27px;
    padding:22px;
    overflow:hidden;
    position:relative;
}

.challenge-header{
    text-align:center;
    margin-bottom:23px;
}

.tag{
    color:var(--cyan);
    font-size:10px;
    font-weight:800;
    letter-spacing:1.6px;
    text-transform:uppercase;
}

.challenge-header h2{
    margin:8px 0;
    font-size:28px;
}

.challenge-header p{
    margin:0;
    color:var(--muted);
    font-size:13px;
}

/* ===============================
   LOGIC
================================ */

.sequence{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:30px 0;
}

.seq-item{
    min-width:64px;
    min-height:64px;
    padding:10px;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--card2);
    border:1px solid var(--line);
    font-size:25px;
    font-weight:800;
}

.seq-item.question{
    border-color:rgba(124,92,255,.8);
    color:var(--accent);
}

.answers{
    max-width:520px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.answer-btn{
    border:1px solid var(--line);
    border-radius:17px;
    min-height:72px;
    background:var(--card2);
    color:white;
    cursor:pointer;
    font-size:21px;
    font-weight:800;
    transition:.16s;
}

.answer-btn:active{
    transform:scale(.96);
}

.answer-btn.correct{
    border-color:var(--green);
    background:rgba(53,231,125,.13);
}

.answer-btn.wrong{
    border-color:var(--red);
    background:rgba(255,77,109,.13);
}

/* ===============================
   BALL
================================ */

.ball-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:10px;
}

.ball-stat{
    background:var(--card2);
    padding:10px;
    border-radius:14px;
    text-align:center;
}

.ball-stat span{
    display:block;
    color:var(--muted);
    font-size:9px;
    text-transform:uppercase;
}

.ball-stat strong{
    font-size:17px;
}

.ball-area{
    height:min(63vh,560px);
    min-height:400px;
    position:relative;
    overflow:hidden;
    border-radius:23px;
    background:
        radial-gradient(circle at center,rgba(124,92,255,.08),transparent 55%),
        #090d17;
    border:1px solid var(--line);
    touch-action:manipulation;
}

.ball{
    width:62px;
    height:62px;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    cursor:pointer;
    background:
        radial-gradient(circle at 32% 27%,#fff 0%,#a697ff 13%,#775dff 42%,#3822ad 100%);
    box-shadow:
        0 0 22px rgba(124,92,255,.9),
        0 0 60px rgba(124,92,255,.35);
    transition:left .09s linear,top .09s linear,transform .1s;
}

.ball:active{
    transform:translate(-50%,-50%) scale(.78);
}

.hit-effect{
    position:fixed;
    width:70px;
    height:70px;
    border-radius:50%;
    border:2px solid var(--accent);
    pointer-events:none;
    transform:translate(-50%,-50%);
    animation:hit .35s forwards;
}

@keyframes hit{
    from{
        opacity:1;
        transform:translate(-50%,-50%) scale(.4);
    }
    to{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.8);
    }
}

/* ===============================
   MOTOR
================================ */

.motor-zone{
    max-width:650px;
    margin:20px auto 0;
}

.big-action{
    width:100%;
    min-height:150px;
    border:1px solid var(--line);
    border-radius:25px;
    background:var(--card2);
    color:white;
    cursor:pointer;
    font-size:28px;
    font-weight:800;
}

.reaction-dot{
    width:95px;
    height:95px;
    border-radius:50%;
    margin:35px auto;
    cursor:pointer;
    background:#2b3140;
    transition:.1s;
}

.reaction-dot.go{
    background:var(--green);
    box-shadow:0 0 50px rgba(53,231,125,.5);
}

.color-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    max-width:420px;
    margin:auto;
}

.color-target{
    height:105px;
    border:0;
    border-radius:20px;
    cursor:pointer;
}

.color-red{background:#ff4d6d;}
.color-blue{background:#438cff;}
.color-green{background:#35e77d;}
.color-yellow{background:#ffc857;}

.mini-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    max-width:400px;
    margin:30px auto;
}

.mini-cell{
    height:85px;
    border:1px solid var(--line);
    background:var(--card2);
    border-radius:18px;
    cursor:pointer;
    font-size:23px;
    font-weight:800;
}

.mini-cell.active{
    background:rgba(124,92,255,.24);
    border-color:var(--accent);
}

.sequence-buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    max-width:520px;
    margin:auto;
}

.seq-button{
    width:78px;
    height:78px;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--card2);
    color:white;
    cursor:pointer;
    font-size:20px;
    font-weight:800;
}

/* ===============================
   RESULT
================================ */

.result-icon{
    font-size:64px;
    text-align:center;
}

.result{
    text-align:center;
}

.result h2{
    font-size:31px;
    margin:10px 0;
}

.result p{
    color:var(--muted);
}

.result-stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:24px 0;
}

.result-stat{
    background:var(--card2);
    border-radius:16px;
    padding:17px;
}

.result-stat span{
    display:block;
    color:var(--muted);
    font-size:10px;
}

.result-stat strong{
    font-size:22px;
}

/* ===============================
   TOAST
================================ */

.toast{
    position:fixed;
    left:50%;
    top:18px;
    transform:translateX(-50%) translateY(-100px);
    z-index:100;
    padding:12px 18px;
    border-radius:14px;
    background:#171c2a;
    border:1px solid var(--line);
    font-size:13px;
    font-weight:700;
    transition:.25s;
}

.toast.show{
    transform:translateX(-50%) translateY(0);
}

/* ===============================
   RESPONSIVE
================================ */

@media(max-width:600px){

    .logo h1{
        font-size:37px;
    }

    .panel{
        padding:20px;
    }

    .challenge{
        padding:16px;
        border-radius:22px;
    }

    .challenge-header h2{
        font-size:23px;
    }

    .seq-item{
        min-width:53px;
        min-height:53px;
        font-size:21px;
    }

    .answers{
        gap:9px;
    }

    .answer-btn{
        min-height:64px;
    }

    .ball-area{
        min-height:420px;
    }
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>


<!-- ===============================
     START SCREEN
================================ -->

<section id="startScreen" class="screen active">
    <div class="container">

        <div class="logo">
            <div class="logo-icon">🧠</div>
            <h1>NEURO</h1>
            <p>Mind · Reflex · Focus</p>
        </div>

        <div class="panel">

            <div class="start-stats">

                <div class="start-stat">
                    <strong id="bestScore">0</strong>
                    <span>Рекорд</span>
                </div>

                <div class="start-stat">
                    <strong>30</strong>
                    <span>Логік</span>
                </div>

                <div class="start-stat">
                    <strong>∞</strong>
                    <span>Рівні</span>
                </div>

            </div>

            <button class="main-btn" onclick="startGame()">
                ПОЧАТИ
            </button>

        </div>

    </div>
</section>


<!-- ===============================
     GAME SCREEN
================================ -->

<section id="gameScreen">

    <div class="game-wrap">

        <div class="hud">

            <div class="hud-box">
                <small>Рівень</small>
                <strong id="hudLevel">1</strong>
            </div>

            <div class="hud-box">
                <small>Помилки</small>
                <strong class="hearts" id="hudErrors">
                    ❤️ ❤️ ❤️
                </strong>
            </div>

            <div class="hud-box">
                <small>Очки</small>
                <strong id="hudScore">0</strong>
            </div>

        </div>

        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="challenge" class="challenge"></div>

    </div>

</section>


<!-- ===============================
     RESULT SCREEN
================================ -->

<section id="resultScreen" class="screen">

    <div class="container">

        <div class="panel result">

            <div id="resultIcon" class="result-icon">🎉</div>

            <h2 id="resultTitle">
                Гру завершено
            </h2>

            <p id="resultText">
                Подивимося на результат.
            </p>

            <div class="result-stats">

                <div class="result-stat">
                    <span>ОЧКИ</span>
                    <strong id="resultScore">0</strong>
                </div>

                <div class="result-stat">
                    <span>XP</span>
                    <strong id="resultXP">0</strong>
                </div>

                <div class="result-stat">
                    <span>РІВЕНЬ</span>
                    <strong id="resultLevel">1</strong>
                </div>

                <div class="result-stat">
                    <span>КОМБО</span>
                    <strong id="resultCombo">0</strong>
                </div>

            </div>

            <button class="main-btn" onclick="returnHome()">
                НА ГОЛОВНИЙ ЕКРАН
            </button>

        </div>

    </div>

</section>


<script>

/* =====================================================
   GAME STATE
===================================================== */

let level = 1;
let score = 0;
let xp = 0;
let errors = 3;
let combo = 0;
let bestCombo = 0;

let logicDone = 0;
let questionPool = [];

let ballTimer = null;
let ballMoveTimer = null;
let reactionTimer = null;
let motorTimer = null;

let ballHits = 0;
let ballTarget = 10;
let ballSeconds = 20;


/* =====================================================
   UNIQUE LOGIC QUESTIONS — 30
===================================================== */

const logicQuestions = [

    /* 1 */
    {
        type:"Числова закономірність",
        title:"Знайди наступне число",
        desc:"Зрозумій правило послідовності.",
        seq:["2","4","8","16","?"],
        answers:["24","30","32","36"],
        correct:"32"
    },

    /* 2 */
    {
        type:"Числова закономірність",
        title:"Продовж послідовність",
        desc:"Що має бути на місці знака питання?",
        seq:["3","6","12","24","?"],
        answers:["36","42","48","54"],
        correct:"48"
    },

    /* 3 */
    {
        type:"Числова закономірність",
        title:"Знайди правило",
        desc:"Кожне число пов'язане з попереднім.",
        seq:["5","10","15","20","?"],
        answers:["22","24","25","30"],
        correct:"25"
    },

    /* 4 */
    {
        type:"Числова закономірність",
        title:"Наступний елемент",
        desc:"Уважно простеж за зміною чисел.",
        seq:["1","4","9","16","?"],
        answers:["20","24","25","36"],
        correct:"25"
    },

    /* 5 */
    {
        type:"Числова закономірність",
        title:"Продовж ряд",
        desc:"Знайди закономірність.",
        seq:["10","20","30","40","?"],
        answers:["45","50","55","60"],
        correct:"50"
    },

    /* 6 */
    {
        type:"Числова закономірність",
        title:"Що далі?",
        desc:"Не поспішай з відповіддю.",
        seq:["2","6","12","20","?"],
        answers:["24","28","30","32"],
        correct:"30"
    },

    /* 7 */
    {
        type:"Фігури",
        title:"Заверши послідовність",
        desc:"Зверни увагу на чергування.",
        seq:["▲","●","▲","●","?"],
        answers:["▲","●","■","◆"],
        correct:"▲"
    },

    /* 8 */
    {
        type:"Фігури",
        title:"Що має бути далі?",
        desc:"Фігури змінюються за правилом.",
        seq:["■","◆","■","◆","?"],
        answers:["■","◆","●","▲"],
        correct:"■"
    },

    /* 9 */
    {
        type:"Фігури",
        title:"Продовж ряд",
        desc:"Знайди закономірність.",
        seq:["🔵","🔴","🟢","🔵","🔴","?"],
        answers:["🔵","🔴","🟢","🟡"],
        correct:"🟢"
    },

    /* 10 */
    {
        type:"Фігури",
        title:"Знайди наступний",
        desc:"Подивись на порядок символів.",
        seq:["★","☆","★","☆","?"],
        answers:["★","☆","●","◆"],
        correct:"★"
    },

    /* 11 */
    {
        type:"Фігури",
        title:"Продовж послідовність",
        desc:"Однаковий принцип повторюється.",
        seq:["⬆️","➡️","⬇️","⬅️","?"],
        answers:["⬆️","➡️","⬇️","↗️"],
        correct:"⬆️"
    },

    /* 12 */
    {
        type:"Фігури",
        title:"Що пропущено?",
        desc:"Визнач наступний символ.",
        seq:["●","●●","●●●","?"],
        answers:["●","●●●●","●●●●●","◆"],
        correct:"●●●●"
    },

    /* 13 */
    {
        type:"Комбінація",
        title:"Що має бути далі?",
        desc:"Порівняй обидві частини.",
        seq:["A","C","E","G","?"],
        answers:["H","I","J","K"],
        correct:"I"
    },

    /* 14 */
    {
        type:"Комбінація",
        title:"Знайди закономірність",
        desc:"Крок завжди однаковий.",
        seq:["B","D","F","H","?"],
        answers:["I","J","K","L"],
        correct:"J"
    },

    /* 15 */
    {
        type:"Комбінація",
        title:"Продовж ряд",
        desc:"Що буде наступним?",
        seq:["1A","2B","3C","4D","?"],
        answers:["5E","5F","6E","6F"],
        correct:"5E"
    },

    /* 16 */
    {
        type:"Зайвий елемент",
        title:"Знайди зайве",
        desc:"Один символ відрізняється від інших.",
        seq:["🔺","🔺","🔻","🔺","🔺"],
        answers:["1","2","3","5"],

    },

    /* 17 */
    {
        type:"Зайвий елемент",
        title:"Що не підходить?",
        desc:"Знайди елемент, який порушує правило.",

        answers:["2","4","6","9"],

    /* 18 */
    {
        type:"Зайвий елемент",
        title:"Знайди чужий символ",

        answers:["1","2","3","5"],
        correct:"3"
    },

    /* 19 */
    {
        type:"Логічна пастка",
        title:"Який варіант порушує правило?",
        desc:"Три варіанти мають спільну властивість.",
        seq:["12","24","36","49","48"],
        answers:["12","24","36","49"],
        correct:"49"
    },

    /* 20 */
    {
        type:"Логічна пастка",
        title:"Знайди помилку",
        desc:"Тільки один елемент не відповідає правилу.",
        seq:["15","20","25","31","35"],
        answers:["15","20","31","35"],
        correct:"31"
    },

    /* 21 */
    {
        type:"Чергуй",
        title:"Який символ наступний?",
        desc:"Подивись на два паралельні ряди.",
        seq:["A1","B2","A3","B4","?"],
        answers:["A5","B5","A6","C5"],
        correct:"A5"
    },

    /* 22 */
    {
        type:"Чергуй",
        title:"Знайди продовження",
        desc:"У послідовності використовуються два правила.",
        seq:["1","2","4","8","16","?"],
        answers:["20","24","30","32"],
        correct:"32"
    },

    /* 23 */
    {
        type:"Чергуй",
        title:"Що далі?",

/* =====================================================
   HELPERS
===================================================== */

function $(id){
    return document.getElementById(id);
}

function random(arr){
    return arr[Math.floor(Math.random()*arr.length)];
}

function shuffle(arr){
    const a=[...arr];

    for(let i=a.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));

        [a[i],a[j]]=[a[j],a[i]];
    }

    return a;
}

function vibrate(pattern){
    if("vibrate" in navigator){
        try{
            navigator.vibrate(pattern);
        }catch(e){}
    }
}

function toast(message){

    const t=$("toast");

    t.textContent=message;
    t.classList.add("show");

    setTimeout(()=>{
        t.classList.remove("show");
    },1200);
}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    $("hudLevel").textContent=level;
    $("hudScore").textContent=score;

    let hearts="";

    for(let i=0;i<3;i++){
        hearts += i<errors ? "❤️ " : "🖤 ";
    }

    $("hudErrors").textContent=hearts.trim();

    const progress=(logicDone%5)/5*100;

    $("progressFill").style.width=progress+"%";
}


/* =====================================================
   START
===================================================== */

function startGame(){

    level=1;
    score=0;
    xp=0;
    errors=3;
    combo=0;
    bestCombo=0;
    logicDone=0;

    questionPool=shuffle(logicQuestions);

    $("startScreen").classList.remove("active");
    $("resultScreen").classList.remove("active");
    $("gameScreen").classList.add("active");

    updateHUD();
    nextLogicQuestion();
}


/* =====================================================
   NEXT LOGIC QUESTION
===================================================== */

function nextLogicQuestion(){

    clearAllTimers();

    if(questionPool.length===0){

        questionPool=shuffle(logicQuestions);
    }

    const q=questionPool.pop();

    renderLogic(q);

    updateHUD();
}


/* =====================================================
   RENDER LOGIC
===================================================== */

function renderLogic(q){

    const answerOptions=shuffle(q.answers);

    $("challenge").innerHTML=`

        <div class="challenge-header">

            <div class="tag">
                🧠 ${q.type}
            </div>

            <h2>${q.title}</h2>

            <p>${q.desc}</p>

        </div>

        <div class="sequence">

            ${q.seq.map(x=>`

                <div class="seq-item ${x==="?"?"question":""}">
                    ${x}
                </div>

            `).join("")}

        </div>

        <div class="answers">

            ${answerOptions.map(answer=>`

                <button
                    class="answer-btn"
                    data-answer="${escapeHtml(answer)}"
                    onclick="answerLogic(this, '${escapeJs(answer)}', '${escapeJs(q.correct)}')">

                    ${answer}

                </button>

            `).join("")}

        </div>
    `;
}


/* =====================================================
   LOGIC ANSWER
===================================================== */

function answerLogic(button,answer,correct){

    const buttons=document.querySelectorAll(".answer-btn");

    buttons.forEach(b=>b.disabled=true);

    if(answer===correct){

        button.classList.add("correct");

        combo++;
        bestCombo=Math.max(bestCombo,combo);

        score += 100 + combo*10;
        xp += 20;

        logicDone++;

        vibrate(20);
        toast("Правильно!");

        updateHUD();

        setTimeout(()=>{

            /*
                КОЖНІ 5 ЛОГІЧНИХ —
                ОБОВ'ЯЗКОВО КУЛЬКА
            */

            if(logicDone%5===0){

                startBallChallenge();

            }else{

                level++;
                nextLogicQuestion();

            }

        },550);

    }else{

        button.classList.add("wrong");

        fail();

        setTimeout(()=>{

            if(errors<=0){

                gameOver();

            }else{

                buttons.forEach(b=>{
                    b.disabled=false;
                    b.classList.remove("wrong");
                });

            }

        },500);
    }
}


/* =====================================================
   FAIL
===================================================== */

function fail(){

    errors--;
    combo=0;

    vibrate([60,50,60]);

    toast("Помилка");

    updateHUD();
}


/* =====================================================
   BALL CHALLENGE
===================================================== */

function startBallChallenge(){

    clearAllTimers();

    ballHits=0;
    ballTarget=10;
    ballSeconds=20;

    renderBall();

    updateHUD();

    ballTimer=setInterval(()=>{

        ballSeconds-=0.1;

        const time=Math.max(ballSeconds,0);

        $("ballTime").textContent=time.toFixed(1)+" с";

        if(ballSeconds<=0){

            finishBall(false);

        }

    },100);

    /*
       КУЛЬКА РУХАЄТЬСЯ КОЖНІ 0.5 СЕКУНДИ
    */

    ballMoveTimer=setInterval(()=>{

        moveBall();

    },500);
}


function renderBall(){

    $("challenge").innerHTML=`

        <div class="challenge-header">

            <div class="tag">
                ⚡ Реакція
            </div>

            <h2>Злови кульку</h2>

            <p>
                Злови 10 кульок за 20 секунд.
            </p>

        </div>

        <div class="ball-info">

            <div class="ball-stat">
                <span>Час</span>
                <strong id="ballTime">20.0 с</strong>
            </div>

            <div class="ball-stat">
                <span>Зловлено</span>
                <strong id="ballHits">0 / 10</strong>
            </div>

            <div class="ball-stat">
                <span>Залишилось</span>
                <strong id="ballLeft">10</strong>
            </div>

        </div>

        <div class="ball-area" id="ballArea">

            <div
                class="ball"
                id="ball"
                onclick="catchBall(event)">
            </div>

        </div>
    `;

    moveBall();
}


function moveBall(){

    const area=$("ballArea");
    const ball=$("ball");

    if(!area || !ball) return;

    const margin=42;

    const x=
        margin+
        Math.random()*
        (area.clientWidth-margin*2);

    const y=
        margin+
        Math.random()*
        (area.clientHeight-margin*2);

    ball.style.left=x+"px";
    ball.style.top=y+"px";
}


function catchBall(event){

    if(ballSeconds<=0) return;

    ballHits++;

    score+=50;
    combo++;
    bestCombo=Math.max(bestCombo,combo);

    vibrate(25);

    createHit(event.clientX,event.clientY);

    $("ballHits").textContent=
        ballHits+" / "+ballTarget;

    $("ballLeft").textContent=
        Math.max(ballTarget-ballHits,0);

    $("hudScore").textContent=score;

    moveBall();

    if(ballHits>=ballTarget){

        finishBall(true);

    }
}


function finishBall(success){

    if(!ballTimer && !ballMoveTimer) return;

    clearInterval(ballTimer);
    clearInterval(ballMoveTimer);

    ballTimer=null;
    ballMoveTimer=null;

    if(success){

        score+=250;
        xp+=50;

        vibrate([25,40,25]);

        toast("🎯 Випробування пройдено");

    }else{

        fail();

        toast(
            "Час вийшов: "+ballHits+"/"+ballTarget
        );

        if(errors<=0){

            setTimeout(gameOver,500);
            return;
        }
    }

    setTimeout(()=>{

        level++;
        nextLogicQuestion();

    },700);
}


/* =====================================================
   OTHER MOTOR CHALLENGES
=====================================================

   Можемо запускати їх окремо пізніше.
   Вони вже готові в архітектурі гри.
===================================================== */


/* =====================================================
   1. STOP SIGNAL
===================================================== */

function startStopChallenge(){

    clearAllTimers();

    let good=0;
    let needed=6;
    let stopped=false;

    $("challenge").innerHTML=`

        <div class="challenge-header">

            <div class="tag">
                🛑 Контроль реакції
            </div>

            <h2>Не поспішай</h2>

            <p>
                Натискай тільки тоді, коли побачиш зелений сигнал.
            </p>

        </div>

        <div class="motor-zone">

            <button
                class="big-action"
                id="stopButton"
                onclick="stopSignalClick()">

                ЧЕКАЙ...

            </button>

        </div>
    `;

    window.stopGood=good;
    window.stopNeeded=needed;
    window.stopStopped=stopped;

    function change(){

        const btn=$("stopButton");

        if(!btn) return;

        const go=Math.random()>.45;

        if(go){

            btn.textContent="НАТИСКАЙ";
            btn.style.background="rgba(53,231,125,.2)";
            btn.style.borderColor="var(--green)";
            window.stopStopped=false;

        }else{

            btn.textContent="НЕ НАТИСКАЙ";
            btn.style.background="rgba(255,77,109,.2)";
            btn.style.borderColor="var(--red)";
            window.stopStopped=true;
        }

        motorTimer=setTimeout(change,700+Math.random()*700);
    }

    window.stopSignalClick=function(){

        if(window.stopStopped){

            fail();

            if(errors<=0){
                gameOver();
                return;
            }

            return;
        }

        window.stopGood++;

        combo++;
        score+=60;

        vibrate(25);

        $("stopButton").textContent=
            window.stopGood+" / "+window.stopNeeded;

        if(window.stopGood>=window.stopNeeded){

            clearTimeout(motorTimer);

            xp+=30;

            setTimeout(()=>{

                level++;
                nextLogicQuestion();

            },500);
        }
    };

    change();
}


/* =====================================================
   2. REACTION
===================================================== */

function startReactionChallenge(){

    clearAllTimers();

    let ready=false;
    let start=0;
    let attempts=0;

    $("challenge").innerHTML=`

        <div class="challenge-header">

            <div class="tag">
                ⚡ Реакція
            </div>

            <h2>Натисни в потрібний момент</h2>

            <p>
                Натисни на зелений сигнал якомога швидше.
            </p>

        </div>

        <div
            class="reaction-dot"
            id="reactionDot"
            onclick="reactionClick()">
        </div>
    `;

    function wait(){

        ready=false;

        const delay=1000+Math.random()*2500;

        reactionTimer=setTimeout(()=>{

            const dot=$("reactionDot");

            if(!dot) return;

            dot.classList.add("go");

            ready=true;
            start=performance.now();

        },delay);
    }

    window.reactionClick=function(){

        const dot=$("reactionDot");

        if(!dot) return;

        if(!ready){

            fail();

            if(errors<=0){
                gameOver();
            }

            return;
        }

        const reaction=
            Math.round(performance.now()-start);

        attempts++;

        dot.classList.remove("go");

        combo++;

        score+=Math.max(100-reaction/5,20);

        vibrate(20);

        if(attempts>=5){

            clearTimeout(reactionTimer);

            xp+=35;

            setTimeout(()=>{

                level++;
                nextLogicQuestion();

            },600);

        }else{

            toast(reaction+" мс");

            wait();
        }
    };

    wait();
}


/* =====================================================
   3. TRACK THE TARGET
===================================================== */

function startTrackingChallenge(){

    clearAllTimers();

    let correct=0;
    const needed=5;

    const cells=[0,1,2,3,4,5,6,7,8];

    $("challenge").innerHTML=`

        <div class="challenge-header">

            <div class="tag">
                👁 Увага
            </div>

            <h2>Слідкуй за ціллю</h2>

            <p>
                Запам'ятай, де була підсвічена клітинка.
            </p>

        </div>

        <div class="mini-grid" id="trackGrid">

            ${cells.map(i=>`

                <button
                    class="mini-cell"
                    data-index="${i}"
                    onclick="trackClick(${i})">
                </button>

            `).join("")}

        </div>
    `;

    let current=random(cells);

    setTimeout(()=>{

        const cell=
            document.querySelector(
                `.mini-cell[data-index="${current}"]`
            );

        if(cell){

            cell.classList.add("active");

            setTimeout(()=>{
                cell.classList.remove("active");
            },500);
        }

    },300);

    window.trackClick=function(index){

        if(index===current){

            correct++;
            combo++;
            score+=90;
            vibrate(20);

            if(correct>=needed){

                xp+=40;

                setTimeout(()=>{

                    level++;
                    nextLogicQuestion();

                },450);

                return;
            }

        }else{

            fail();

            if(errors<=0){
                gameOver();
                return;
            }
        }

        current=random(cells);

        setTimeout(()=>{

            const cell=
                document.querySelector(
                    `.mini-cell[data-index="${current}"]`
                );

            if(cell){

                cell.classList.add("active");

                setTimeout(()=>{
                    cell.classList.remove("active");
                },450);
            }

        },180);
    };
}


/* =====================================================
   4. HIT SEQUENCE
===================================================== */

function startSequenceChallenge(){

    clearAllTimers();

    const sequence=shuffle([1,2,3,4,5]);

    let index=0;

    $("challenge").innerHTML=`

        <div class="challenge-header">

            <div class="tag">
                👆 Координація
            </div>

            <h2>Натисни у правильному порядку</h2>

            <p>
                1 → 2 → 3 → 4 → 5
            </p>

        </div>

        <div class="sequence-buttons">

            ${sequence.map(num=>`

                <button
                    class="seq-button"
                    onclick="sequenceClick(${num},this)">

                    ${num}

                </button>

            `).join("")}

        </div>
    `;

    window.sequenceClick=function(num,button){

        if(num===index+1){

            index++;

            button.style.background=
                "rgba(53,231,125,.18)";

            button.disabled=true;

            combo++;
            score+=70;

            vibrate(20);

            if(index===5){

                xp+=35;

                setTimeout(()=>{

                    level++;
                    nextLogicQuestion();

                },450);
            }

        }else{

            button.classList.add("wrong");

            fail();

            setTimeout(()=>{
                button.classList.remove("wrong");
            },300);

            if(errors<=0){
                gameOver();
            }
        }
    };
}


/* =====================================================
   HIT EFFECT
===================================================== */

function createHit(x,y){

    const effect=document.createElement("div");

    effect.className="hit-effect";

    effect.style.left=x+"px";
    effect.style.top=y+"px";

    document.body.appendChild(effect);

    setTimeout(()=>{
        effect.remove();
    },400);
}


/* =====================================================
   CLEAR TIMERS
===================================================== */

function clearAllTimers(){

    clearInterval(ballTimer);
    clearInterval(ballMoveTimer);
    clearInterval(motorTimer);
    clearTimeout(reactionTimer);

    ballTimer=null;
    ballMoveTimer=null;
    motorTimer=null;
    reactionTimer=null;
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    clearAllTimers();

    const best=
        Number(localStorage.getItem("neuroBest")||0);

    if(score>best){

        localStorage.setItem(
            "neuroBest",
            score
        );
    }

    $("gameScreen").classList.remove("active");
    $("resultScreen").classList.add("active");

    $("resultIcon").textContent="💥";
    $("resultTitle").textContent="Гра завершена";

    $("resultText").textContent=
        "Ти використав усі допустимі помилки.";

    $("resultScore").textContent=score;
    $("resultXP").textContent=xp;
    $("resultLevel").textContent=level;
    $("resultCombo").textContent=bestCombo;
}


/* =====================================================
   RETURN HOME
===================================================== */

function returnHome(){

    clearAllTimers();

    $("resultScreen").classList.remove("active");
    $("gameScreen").classList.remove("active");
    $("startScreen").classList.add("active");

    const best=
        Number(localStorage.getItem("neuroBest")||0);

    $("bestScore").textContent=best;
}


/* =====================================================
   ESCAPE HELPERS
===================================================== */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}

function escapeJs(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


/* =====================================================
   LOAD BEST SCORE
===================================================== */

$("bestScore").textContent=
    Number(localStorage.getItem("neuroBest")||0);
