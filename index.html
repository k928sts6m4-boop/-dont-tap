<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEURO — Doctor NEX</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#050816;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

body{
  background:
    radial-gradient(circle at 50% -10%,#182a55 0,#080d20 38%,#03050c 100%);
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

.hidden{display:none!important}

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:auto;
  padding:14px;
  position:relative;
}

/* ================= HEADER ================= */

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:6px;
  color:#69eaff;
  text-shadow:0 0 15px #00d9ff,0 0 40px #007bff;
  margin-top:8px;
}

.subtitle{
  text-align:center;
  color:#94a8ca;
  font-size:12px;
  letter-spacing:3px;
  margin-top:-5px;
}

/* ================= PANELS ================= */

.panel{
  background:rgba(10,18,42,.78);
  border:1px solid rgba(71,190,255,.2);
  border-radius:24px;
  box-shadow:0 15px 50px rgba(0,0,0,.35);
  backdrop-filter:blur(14px);
}

/* ================= NEX ================= */

.nexWrap{
  margin-top:20px;
  min-height:245px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 45%,rgba(30,180,255,.18),transparent 45%),
    linear-gradient(145deg,#101c3b,#071022);
}

.nexGlow{
  position:absolute;
  width:230px;
  height:230px;
  border-radius:50%;
  background:rgba(0,205,255,.12);
  filter:blur(25px);
}

.nex{
  position:relative;
  width:180px;
  height:230px;
  animation:nexFloat 3s ease-in-out infinite;
}

@keyframes nexFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

/* cartoon NEX */
.nexHead{
  position:absolute;
  left:45px;
  top:14px;
  width:90px;
  height:88px;
  background:#f0b98f;
  border-radius:46% 46% 44% 44%;
  z-index:4;
  box-shadow:inset -7px -8px 0 rgba(0,0,0,.08);
}

.nexHair{
  position:absolute;
  left:44px;
  top:7px;
  width:94px;
  height:44px;
  background:#7b543b;
  border-radius:55% 55% 25% 25%;
  z-index:5;
  transform:rotate(-2deg);
}

.nexHair:after{
  content:"";
  position:absolute;
  left:8px;
  bottom:-5px;
  width:74px;
  height:16px;
  background:#7b543b;
  border-radius:0 0 50% 50%;
}

.eye{
  position:absolute;
  top:50px;
  width:10px;
  height:12px;
  background:#263b59;
  border-radius:50%;
  z-index:7;
}

.eye.left{left:65px}
.eye.right{right:65px}

.nexSmile{
  position:absolute;
  width:27px;
  height:12px;
  border-bottom:3px solid #773d38;
  border-radius:50%;
  left:76px;
  top:76px;
  z-index:7;
}

.nexBody{
  position:absolute;
  left:37px;
  top:95px;
  width:106px;
  height:110px;
  background:#f5f7fa;
  border-radius:22px 22px 14px 14px;
  z-index:2;
  box-shadow:inset -8px 0 0 rgba(0,0,0,.08);
}

.nexShirt{
  position:absolute;
  left:58px;
  top:108px;
  width:64px;
  height:95px;
  background:#17375f;
  border-radius:12px;
  z-index:3;
}

.nexN{
  position:absolute;
  left:78px;
  top:130px;
  color:#58eaff;
  font-size:24px;
  font-weight:900;
  z-index:6;
}

.nexStetho{
  position:absolute;
  left:59px;
  top:108px;
  width:63px;
  height:75px;
  border:3px solid #222;
  border-top:0;
  border-radius:0 0 35px 35px;
  z-index:7;
  opacity:.9;
}

.nexStetho:after{
  content:"";
  position:absolute;
  bottom:-6px;
  left:25px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#bbb;
  border:2px solid #222;
}

.nexArm{
  position:absolute;
  width:30px;
  height:90px;
  background:#f4f6f8;
  border-radius:20px;
  top:105px;
  z-index:1;
}

.nexArm.left{
  left:21px;
  transform:rotate(18deg);
}

.nexArm.right{
  right:21px;
  transform:rotate(-18deg);
}

.nexBubble{
  position:absolute;
  left:14px;
  top:14px;
  max-width:250px;
  padding:11px 14px;
  border-radius:15px;
  background:rgba(5,13,32,.92);
  border:1px solid #38dfff;
  color:#dffbff;
  font-size:13px;
  line-height:1.35;
  z-index:20;
  box-shadow:0 0 20px rgba(0,216,255,.12);
}

/* ================= START ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:16px;
}

.stat{
  padding:13px 7px;
  text-align:center;
}

.stat b{
  display:block;
  color:#62e8ff;
  font-size:20px;
}

.stat span{
  color:#7f91b1;
  font-size:10px;
}

.mainBtn{
  width:100%;
  margin-top:16px;
  padding:18px;
  border-radius:17px;
  background:linear-gradient(135deg,#19dfff,#526bff);
  color:#fff;
  font-size:18px;
  font-weight:900;
  box-shadow:0 10px 30px rgba(35,178,255,.25);
}

.secondaryRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.secondary{
  padding:13px;
  border-radius:14px;
  color:#c8d7f5;
  background:#101a35;
  border:1px solid #23365d;
}

/* ================= GAME HUD ================= */

.hud{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}

.hudBox{
  padding:10px 7px;
  text-align:center;
}

.hudBox small{
  color:#7387aa;
  font-size:9px;
  display:block;
}

.hudBox b{
  font-size:17px;
}

.progress{
  height:7px;
  background:#111a30;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:12px;
}

.progress i{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#29e6ff,#7d5cff);
  transition:.25s;
}

.challenge{
  min-height:470px;
  padding:16px;
}

.challengeTitle{
  text-align:center;
  font-size:12px;
  color:#69eaff;
  letter-spacing:2px;
  margin-bottom:8px;
}

.question{
  text-align:center;
  font-size:22px;
  line-height:1.35;
  margin:18px 4px;
  font-weight:800;
}

.subquestion{
  text-align:center;
  color:#91a5c9;
  font-size:13px;
  line-height:1.4;
  margin-bottom:15px;
}

/* ================= ANSWERS ================= */

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.answer{
  min-height:72px;
  padding:12px;
  border-radius:15px;
  background:#111d3a;
  border:1px solid #29416e;
  color:#fff;
  font-weight:800;
  transition:.12s;
}

.answer:active{
  transform:scale(.96);
  background:#20345e;
}

.answer.good{
  background:#0e684f;
  border-color:#37f0ae;
}

.answer.bad{
  background:#6b1b32;
  border-color:#ff4f70;
}

/* ================= MOTOR ================= */

.motorArea{
  min-height:350px;
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:
    radial-gradient(circle at center,rgba(20,80,150,.25),transparent 55%),
    #071126;
  border:1px solid #203963;
}

.ball{
  position:absolute;
  width:54px;
  height:54px;
  border-radius:50%;
  box-shadow:0 0 25px currentColor;
  touch-action:none;
}

.ball.blue{background:#2bdfff;color:#2bdfff}
.ball.red{background:#ff3e61;color:#ff3e61}
.ball.yellow{background:#ffe15c;color:#ffe15c}

.motorInfo{
  display:flex;
  justify-content:space-between;
  padding:9px;
  color:#b7c9e8;
  font-size:12px;
}

.reactionTarget{
  width:150px;
  height:150px;
  border-radius:50%;
  margin:70px auto 30px;
  background:#17233d;
  border:5px solid #263b61;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#7890b7;
  font-weight:900;
}

.reactionTarget.ready{
  background:#32ef8b;
  border-color:#a7ffd0;
  color:#062c18;
  box-shadow:0 0 50px rgba(50,239,139,.5);
}

.bigMotorBtn{
  width:100%;
  padding:18px;
  border-radius:15px;
  background:#172746;
  color:#fff;
  font-weight:900;
}

/* memory */
.memoryGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:20px;
}

.memoryItem{
  height:75px;
  border-radius:15px;
  background:#162544;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  border:1px solid #29416d;
}

/* tracking */
.trackGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:20px;
}

.trackCell{
  aspect-ratio:1;
  border-radius:12px;
  background:#15223d;
  border:1px solid #263c63;
}

.trackCell.target{
  background:#48e9ff;
  box-shadow:0 0 25px #48e9ff;
}

/* precision */
.precisionTrack{
  height:80px;
  margin-top:70px;
  position:relative;
  background:#101d37;
  border-radius:40px;
}

.precisionZone{
  position:absolute;
  left:42%;
  width:16%;
  height:100%;
  background:rgba(42,237,164,.3);
  border-left:2px solid #42f0a9;
  border-right:2px solid #42f0a9;
}

.precisionCursor{
  position:absolute;
  top:10px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#63e8ff;
  box-shadow:0 0 25px #63e8ff;
}

/* ================= RESULT ================= */

.resultTitle{
  text-align:center;
  font-size:32px;
  font-weight:900;
  color:#63e8ff;
  margin:20px 0;
}

.resultMain{
  text-align:center;
  font-size:46px;
  font-weight:900;
}

.resultStats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.resultStat{
  padding:15px;
  border-radius:15px;
  background:#0f1931;
  border:1px solid #23385f;
}

.resultStat b{
  font-size:23px;
  color:#63e8ff;
}

.resultStat span{
  display:block;
  color:#8599bd;
  font-size:11px;
  margin-top:4px;
}

/* ================= SETTINGS ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modalBox{
  width:100%;
  max-width:480px;
  padding:20px;
}

.settingTitle{
  font-size:22px;
  font-weight:900;
  margin-bottom:15px;
}

.settingLabel{
  color:#7e94b8;
  font-size:12px;
  margin:18px 0 8px;
}

.settingGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.settingBtn{
  padding:14px 8px;
  border-radius:13px;
  background:#111d38;
  border:1px solid #263b63;
  color:#b9c9e6;
}

.settingBtn.active{
  background:#153f61;
  border-color:#48e9ff;
  color:#fff;
}

.closeBtn{
  width:100%;
  padding:14px;
  border-radius:14px;
  background:#243252;
  color:#fff;
  margin-top:16px;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  padding:12px 18px;
  border-radius:14px;
  background:#101b36;
  border:1px solid #36ddff;
  color:#fff;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= BOSS ================= */

.boss{
  text-align:center;
}

.bossIcon{
  font-size:65px;
  margin:15px;
  animation:pulse 1s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(1)}
  to{transform:scale(1.08)}
}

/* ================= MOBILE ================= */

@media(max-width:420px){
  .logo{font-size:35px}
  .challenge{min-height:450px}
  .question{font-size:19px}
  .nexWrap{min-height:225px}
}
</style>
</head>

<body>

<div class="app">

<!-- ================= START ================= -->

<section id="start">

  <div class="logo">NEURO</div>
  <div class="subtitle">MIND • FOCUS • REFLEX • MOTOR</div>

  <div class="panel nexWrap">
    <div class="nexGlow"></div>

    <div class="nexBubble" id="nexBubble">
      Привіт! Я Doctor NEX. Готовий перевірити, на що здатен твій мозок?
    </div>

    <div class="nex">

      <div class="nexHair"></div>
      <div class="nexHead"></div>

      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="nexSmile"></div>

      <div class="nexArm left"></div>
      <div class="nexArm right"></div>

      <div class="nexBody"></div>
      <div class="nexShirt"></div>
      <div class="nexN">N</div>
      <div class="nexStetho"></div>

    </div>
  </div>

  <div class="stats">
    <div class="panel stat">
      <b id="bestScore">0</b>
      <span>РЕКОРД</span>
    </div>
    <div class="panel stat">
      <b id="bestLevel">0</b>
      <span>РІВЕНЬ</span>
    </div>
    <div class="panel stat">
      <b id="gamesPlayed">0</b>
      <span>ІГР</span>
    </div>
  </div>

  <button class="mainBtn" id="startBtn">🧠 ПОЧАТИ NEURO</button>

  <div class="secondaryRow">
    <button class="secondary" id="dailyBtn">📅 DAILY</button>
    <button class="secondary" id="settingsBtn">⚙️ НАЛАШТУВАННЯ</button>
  </div>

</section>


<!-- ================= GAME ================= -->

<section id="game" class="hidden">

  <div class="hud">

    <div class="panel hudBox">
      <small>БЛОК</small>
      <b id="blockHud">1</b>
    </div>

    <div class="panel hudBox">
      <small>ЖИТТЯ</small>
      <b id="lifeHud">❤️❤️❤️</b>
    </div>

    <div class="panel hudBox">
      <small>ОЧКИ</small>
      <b id="scoreHud">0</b>
    </div>

  </div>

  <div class="progress">
    <i id="progressBar"></i>
  </div>

  <div class="panel challenge" id="challenge"></div>

</section>


<!-- ================= RESULT ================= -->

<section id="result" class="hidden">

  <div class="panel" style="padding:20px">

    <div class="resultTitle">NEURO COMPLETE</div>

    <div class="resultMain" id="finalScore">0</div>

    <div style="text-align:center;color:#8398bc;margin-top:5px">
      ОЧКИ
    </div>

    <div class="resultStats">

      <div class="resultStat">
        <b id="rMind">0</b>
        <span>MIND</span>
      </div>

      <div class="resultStat">
        <b id="rFocus">0</b>
        <span>FOCUS</span>
      </div>

      <div class="resultStat">
        <b id="rMemory">0</b>
        <span>MEMORY</span>
      </div>

      <div class="resultStat">
        <b id="rReflex">0</b>
        <span>REFLEX</span>
      </div>

      <div class="resultStat">
        <b id="rMotor">0</b>
        <span>MOTOR</span>
      </div>

      <div class="resultStat">
        <b id="rCombo">0</b>
        <span>BEST COMBO</span>
      </div>

    </div>

    <button class="mainBtn" id="homeBtn">🏠 НА ГОЛОВНИЙ ЕКРАН</button>

  </div>

</section>

</div>


<!-- ================= SETTINGS ================= -->

<div class="modal hidden" id="settingsModal">

  <div class="modalBox panel">

    <div class="settingTitle">⚙️ Налаштування</div>

    <div class="settingLabel">СКЛАДНІСТЬ</div>

    <div class="settingGrid">

      <button class="settingBtn" data-diff="easy">🟢 Легко</button>
      <button class="settingBtn" data-diff="normal">🟡 Нормально</button>
      <button class="settingBtn" data-diff="hard">🔴 Складно</button>
      <button class="settingBtn" data-diff="expert">🟣 Експерт</button>
      <button class="settingBtn" data-diff="adaptive" style="grid-column:1/3">
        🤖 Адаптивно
      </button>

    </div>

    <div class="settingLabel">ЗВУК</div>

    <div class="settingGrid">

      <button class="settingBtn" id="musicBtn">🎵 Музика: ON</button>
      <button class="settingBtn" id="sfxBtn">🔊 Ефекти: ON</button>

    </div>

    <button class="closeBtn" id="closeSettings">ЗАКРИТИ</button>

  </div>

</div>

<div class="toast" id="toast"></div>


<script>

/* =========================================================
   NEURO ENGINE
========================================================= */

const $ = id => document.getElementById(id);

let state = {
  level:1,
  block:1,
  blockStep:0,

  score:0,
  xp:0,

  lives:3,
  combo:0,
  bestCombo:0,

  mind:0,
  focus:0,
  memory:0,
  reflex:0,
  motor:0,

  errors:0,
  totalTasks:0,
  correctTasks:0,

  motorTasks:0,
  logicTasks:0,

  difficulty:localStorage.getItem("neuroDifficulty") || "normal",

  music:localStorage.getItem("neuroMusic") !== "off",
  sfx:localStorage.getItem("neuroSfx") !== "off",

  daily:false
};

let currentQuestion = null;
let motorTimer = null;
let motorCleanup = null;

const DIFF = {

  easy:{
    time:1.35,
    speed:.72,
    memory:4,
    options:3
  },

  normal:{
    time:1,
    speed:1,
    memory:5,
    options:4
  },

  hard:{
    time:.78,
    speed:1.22,
    memory:6,
    options:4
  },

  expert:{
    time:.58,
    speed:1.5,
    memory:7,
    options:5
  },

  adaptive:{
    time:1,
    speed:1,
    memory:5,
    options:4
  }

};

function cfg(){

  if(state.difficulty !== "adaptive"){
    return DIFF[state.difficulty];
  }

  let rate =
    state.totalTasks ?
    state.correctTasks / state.totalTasks :
    1;

  if(rate > .9){
    return DIFF.hard;
  }

  if(rate < .62){
    return DIFF.easy;
  }

  return DIFF.normal;
}


/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;

function audioStart(){

  if(!state.sfx && !state.music) return;

  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }

}

function tone(freq,duration=.08,type="sine",volume=.04){

  if(!state.sfx) return;

  audioStart();

  if(!audioCtx) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(volume,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+duration);
}

function goodSound(){
  tone(660,.07,"square",.035);
  setTimeout(()=>tone(880,.1,"square",.03),65);
}

function badSound(){
  tone(180,.18,"sawtooth",.05);
}

function clickSound(){
  tone(440,.035,"square",.025);
}


/* =========================================================
   STORAGE
========================================================= */

function saveStats(){

  localStorage.setItem(
    "neuroBest",
    Math.max(
      Number(localStorage.getItem("neuroBest")||0),
      state.score
    )
  );

  localStorage.setItem(
    "neuroBestLevel",
    Math.max(
      Number(localStorage.getItem("neuroBestLevel")||0),
      state.level
    )
  );

  localStorage.setItem(
    "neuroGames",
    Number(localStorage.getItem("neuroGames")||0)+1
  );

}


/* =========================================================
   UI
========================================================= */

function show(section){

  $("start").classList.add("hidden");
  $("game").classList.add("hidden");
  $("result").classList.add("hidden");

  section.classList.remove("hidden");

}

function toast(text){

  const t=$("toast");

  t.textContent=text;
  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");

========================================================= */

function startGame(daily=false){

  audioStart();

  state = {
    level:1,
    block:1,
    blockStep:0,

    score:0,
    xp:0,

    lives:3,
    combo:0,
    bestCombo:0,

    mind:0,
    focus:0,
    memory:0,
    reflex:0,
    motor:0,

    errors:0,
    totalTasks:0,
    correctTasks:0,

    motorTasks:0,
    logicTasks:0,

    difficulty:
      localStorage.getItem("neuroDifficulty") || "normal",

    sfx:
      localStorage.getItem("neuroSfx") !== "off",

    daily
  };

  show($("game"));

  nexSay(

    ? "Сьогоднішній виклик готовий. Не поспішай."

  );

  updateHUD();

  nextTask();

}


/* =========================================================
   TASK FLOW
========================================================= */

function nextTask(){

  if(state.lives<=0){
    gameOver();
    return;
  }

  if(state.blockStep<4){

    state.blockStep++;
    state.logicTasks++;

    nextLogic();

  }else{

    state.blockStep=5;

    updateHUD();

    setTimeout(startMotor,250);

  }

}

/* =========================================================
   LOGIC ENGINE
========================================================= */

let questionPool=[];

function shuffle(arr){

  const a=[...arr];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;
}

function refillQuestions(){

  questionPool=shuffle(QUESTIONS);

}

function nextLogic(){

  if(questionPool.length<1){
    refillQuestions();
  }

  currentQuestion=questionPool.pop();

  renderLogic(currentQuestion);

}

function renderLogic(q){

  const area=$("challenge");

  let memoryHTML="";

  if(q.memory){

    memoryHTML=`
      <div class="memoryGrid">
        ${q.memory.map(x=>`
          <div class="memoryItem">${x}</div>
        `).join("")}
      </div>
    `;

  }

  area.innerHTML=`

    <div class="challengeTitle">
      ${q.type==="focus"?"FOCUS":
        q.type==="memory"?"MEMORY":
        q.type==="space"?"SPACE":"MIND"}
    </div>

    <div class="question">${q.text}</div>

    ${q.memory
      ? `<div class="subquestion">
          Запам'ятай. Через кілька секунд відповідай.
         </div>`
      : ""}

    ${memoryHTML}

    <div class="answers">
      ${q.options.map((x,i)=>`
        <button class="answer" data-answer="${i}">
          ${x}
        </button>
      `).join("")}
    </div>
  `;

  if(q.memory){

    const buttons=
      [...area.querySelectorAll(".answer")];

    buttons.forEach(b=>b.style.display="none");

    setTimeout(()=>{

      if(!document.body.contains(area)) return;

      area.querySelector(".memoryGrid")?.remove();

      const sub=area.querySelector(".subquestion");

      if(sub){
        sub.textContent="Тепер вибери правильну відповідь.";
      }

      buttons.forEach(b=>b.style.display="block");

    }, Math.max(900,1000*cfg().time));

  }

  area.querySelectorAll(".answer").forEach(btn=>{

    btn.addEventListener("pointerdown",()=>{

      const idx=Number(btn.dataset.answer);

      answerLogic(idx,btn);

    },{once:true});

  });

  nexSay(
    q.type==="focus"
    ? "Уважно. Очі іноді бачать не те, що бачить мозок."
    : q.type==="memory"
    ? "Запам'ятай. Я перевірю тебе за мить."
    : "Подумай. Правильна відповідь не завжди очевидна."
  );

  updateHUD();

}

function answerLogic(index,button){

  state.totalTasks++;

  const q=currentQuestion;

  const buttons=
    [...$("challenge").querySelectorAll(".answer")];

  buttons.forEach(b=>b.disabled=true);

  if(index===q.answer){

    button.classList.add("good");

    state.correctTasks++;

    success(
      q.type==="memory" ? "memory":
      q.type==="focus" ? "focus":
      "mind"
    );

    setTimeout(()=>{

      if(q.type==="memory"){
        state.memory+=10;
      }

      nextTask();

    },420);

  }else{

    button.classList.add("bad");

    const correct=
      buttons[q.answer];

    if(correct){
      correct.classList.add("good");
    }

    fail();

    setTimeout(()=>{

      if(state.lives<=0){
        gameOver();
      }else{
        nextTask();
      }

    },600);

  }

}


/* =========================================================
   SUCCESS / FAIL
========================================================= */

function success(type="mind"){

  state.combo++;

  state.bestCombo=
    Math.max(state.bestCombo,state.combo);

  state.score+=
    Math.round(70*(1+Math.min(state.combo,10)*.08));

  state.xp+=12;

  if(type==="mind") state.mind+=8;
  if(type==="focus") state.focus+=8;
  if(type==="memory") state.memory+=10;
  if(type==="reflex") state.reflex+=10;
  if(type==="motor") state.motor+=10;

  if(state.combo>0 && state.combo%5===0){
    state.score+=150;
    toast("🔥 COMBO BONUS!");
  }

  goodSound();
  vibrate(20);

  if(state.combo%4===0 && state.lives<3){
    state.lives++;
    toast("❤️ Життя відновлено!");
  }

  updateHUD();

}

function fail(){

  state.errors++;
  state.combo=0;
  state.lives--;

  badSound();
  vibrate(80);

  nexSay("Майже. Не поспішай — уважність важливіша за швидкість.");

  toast(
    state.lives>0
    ? "❌ Помилка"
    : "💀 Останнє життя"
  );

  updateHUD();

}


/* =========================================================
   MOTOR SELECTOR
========================================================= */

function startMotor(){

  state.motorTasks++;

  const types=[
    "ball",
    "reaction",
    "stop",
    "tracking",
    "precision",
    "memoryMotor"
  ];

  let type=
    types[Math.floor(Math.random()*types.length)];

  if(state.difficulty==="expert"){
    type=
      types[Math.floor(Math.random()*types.length)];
  }

  switch(type){

    case "ball":
      motorBall();
      break;

    case "reaction":
      motorReaction();
      break;

    case "stop":
      motorStop();
      break;

    case "tracking":
      motorTracking();
      break;

    case "precision":
      motorPrecision();
      break;

    case "memoryMotor":
      motorMemory();
      break;

  }

}


/* =========================================================
   MOTOR FINISH
========================================================= */

function finishMotor(ok=true){

  if(motorCleanup){
    motorCleanup();
    motorCleanup=null;
  }

  clearTimeout(motorTimer);
  clearInterval(motorTimer);

  if(ok){

    state.totalTasks++;
    state.correctTasks++;

    success("motor");

    state.block++;
    state.blockStep=0;

    setTimeout(()=>{

      if(state.block>0 && state.block%4===0){

        startBoss();

      }else{

        nextTask();

      }

    },650);

  }else{

    if(state.lives<=0){

      gameOver();

    }else{

      state.block++;
      state.blockStep=0;

      setTimeout(nextTask,650);

    }

  }

}


/* =========================================================
   BALL
========================================================= */

function motorBall(){

  let hits=0;
  let time=20;

  const area=$("challenge");

  area.innerHTML=`

    <div class="challengeTitle">MOTOR • CATCH</div>

    <div class="question">
      Злови 10 синіх
    </div>

    <div class="motorInfo">
      <span>🎯 <b id="ballHits">0</b> / 10</span>
      <span>⏱️ <b id="ballTime">20</b>s</span>
    </div>

    <div class="motorArea" id="ballArea"></div>
  `;

  nexSay("Сині — лови. Червоні — пастка. Жовті дають бонус часу.");

  const ballArea=$("ballArea");

  let moveTimer=null;

  function move(){

    const ball=document.createElement("div");

    const r=Math.random();

    let type=
      r<.68 ? "blue" :
      r<.88 ? "red" :
      "yellow";

    ball.className="ball "+type;

    ball.style.left=
      Math.random()*82+"%";

    ball.style.top=
      Math.random()*75+"%";

    ballArea.appendChild(ball);

    ball.addEventListener("pointerdown",(e)=>{

      e.stopPropagation();

      if(type==="red"){

        state.totalTasks++;
        fail();

        ball.remove();

        return;

      }

      if(type==="yellow"){

        time=Math.min(25,time+2);

        state.score+=60;

        toast("🟡 +2 секунди");

        vibrate(35);

        ball.remove();

        return;

      }

      hits++;

      state.score+=45;
      state.reflex+=3;

      $("ballHits").textContent=hits;

      goodSound();
      vibrate(20);

      ball.remove();

      if(hits>=10){

        clearInterval(moveTimer);

        clearInterval(timeTimer);

        finishMotor(true);

      }

    });

    setTimeout(()=>{

      if(ball.isConnected) ball.remove();

    },900);

  }

  move();

  moveTimer=setInterval(
    move,
    Math.max(500,700/cfg().speed)
  );

  const timeTimer=setInterval(()=>{

    time--;

    $("ballTime").textContent=time;

    if(time<=0){

      clearInterval(moveTimer);
      clearInterval(timeTimer);

      state.totalTasks++;

      fail();

      finishMotor(false);

    }

  },1000);

  motorCleanup=()=>{

    clearInterval(moveTimer);
    clearInterval(timeTimer);

  };

}

  `;

  const target=$("reactionTarget");
  const btn=$("reactionBtn");

  let ready=false;
  let finished=false;

  const wait=
    (850+Math.random()*2100)/cfg().speed;

  const timer=setTimeout(()=>{

    ready=true;

    target.classList.add("ready");
    target.textContent="НАТИСКАЙ";
    btn.textContent="⚡ ТИСНИ!";

  },wait);

  btn.addEventListener("pointerdown",click);

  motorCleanup=()=>{

function motorStop(){

  const area=$("challenge");

  area.innerHTML=`

    <div class="challengeTitle">MOTOR • STOP</div>

    <div class="question">
      Натискай тільки коли написано
      <b>НАТИСКАЙ</b>
    </div>

    <button class="bigMotorBtn" id="stopBtn">
      ГОТУЙСЯ...
    </button>

    <div style="text-align:center;margin-top:20px;color:#7890b5">
      6 сигналів
    </div>
  `;

  nexSay("Тут я спробую тебе заплутати.");

  const btn=$("stopBtn");

  let round=0;
  let active=false;
  let ended=false;

  function nextSignal(){

    if(ended) return;

    round++;

    if(round>6){

      finishMotor(true);
      return;

    }

    active=Math.random()>.45;

    btn.textContent=
      active ? "НАТИСКАЙ" : "НЕ НАТИСКАЙ";

    btn.style.background=
      active ? "#146c50" : "#6b2037";

    motorTimer=setTimeout(nextSignal,
      600+Math.random()*800
    );

  }

  function click(){

    if(ended) return;

    if(!active){

      ended=true;
      fail();
      finishMotor(false);

      return;

    }

    state.totalTasks++;
    state.correctTasks++;

    success("reflex");

    if(round>=6){

      ended=true;
      finishMotor(true);

    }else{

      clearTimeout(motorTimer);
      nextSignal();

    }

  }

  btn.addEventListener("pointerdown",click);

  nextSignal();

  motorCleanup=()=>{
    clearTimeout(motorTimer);
    btn.removeEventListener("pointerdown",click);
  };

}

function motorTracking(){

  const area=$("challenge");

  area.innerHTML=`

    <div class="challengeTitle">MOTOR • TRACK</div>

    <div class="question">
      Запам'ятай клітинку
    </div>

    <div class="trackGrid" id="trackGrid"></div>
  `;

  nexSay("Подивись уважно. Ціль зникне дуже швидко.");

  const grid=$("trackGrid");

  let round=0;

  function play(){

    grid.innerHTML="";

    const cells=[];

    for(let i=0;i<9;i++){

      const c=document.createElement("div");
      c.className="trackCell";

      grid.appendChild(c);
      cells.push(c);

    }

    const index=
      Math.floor(Math.random()*9);

    setTimeout(()=>{

      cells[index].classList.add("target");

      setTimeout(()=>{

        cells[index].classList.remove("target");

      },430/cfg().speed);

    },150);

    cells.forEach((cell,i)=>{

      cell.onpointerdown=()=>{

        if(i!==index){

          fail();
          finishMotor(false);
          return;

        }

        state.totalTasks++;
        state.correctTasks++;

        success("focus");

        round++;

        if(round>=5){

          finishMotor(true);

        }else{

          setTimeout(play,300);

        }

      };

    });

  }

  play();

}

  const area=$("challenge");

  area.innerHTML=`

    <div class="challengeTitle">MOTOR • PRECISION</div>

    <div class="question">
      Зупини ціль у зеленій зоні
    </div>

    <div class="precisionTrack" id="precisionTrack">

      <div class="precisionZone"></div>
      <div class="precisionCursor" id="precisionCursor"></div>

    </div>

    <button class="bigMotorBtn" id="precisionBtn">
      ЗУПИНИТИ
    </button>
  `;

  nexSay("Точність важливіша за швидкість.");

  const cursor=$("precisionCursor");
  const btn=$("precisionBtn");

  let x=0;
  let dir=1;
  let stopped=false;
  let hits=0;

  function animate(){

    if(stopped) return;

    x+=dir*(1.2*cfg().speed);

    if(x>90){
      dir=-1;
    }

    if(x<0){
      dir=1;
    }

    cursor.style.left=x+"%";

    requestAnimationFrame(animate);

  }

  animate();

  function stop(){

    if(stopped) return;

    const center=x+5;

    if(center>=42 && center<=58){

      hits++;

      state.totalTasks++;
      state.correctTasks++;

      success("motor");

      if(hits>=5){

        stopped=true;
        finishMotor(true);

      }else{

        x=0;

      }

    }else{

      stopped=true;

      fail();
      finishMotor(false);

    }

  }

  btn.addEventListener("pointerdown",stop);

  motorCleanup=()=>{
    stopped=true;
    btn.removeEventListener("pointerdown",stop);
  };

}


/* =========================================================
   MEMORY MOTOR
========================================================= */

function motorMemory(){

  const area=$("challenge");

  const symbols=["●","▲","◆","★","■","✦","⬟"];

  const count=cfg().memory;

  const sequence=
    shuffle(symbols).slice(0,count);

  area.innerHTML=`

    <div class="challengeTitle">MOTOR • MEMORY</div>

    <div class="question">
      Запам'ятай послідовність
    </div>

    <div class="memoryGrid" id="memoryShow">
      ${sequence.map(x=>`
        <div class="memoryItem">${x}</div>
      `).join("")}
    </div>

    <div class="subquestion">
      Через мить повтори її
    </div>
  `;

  nexSay("Запам'ятай порядок. Потім повтори його.");

  setTimeout(()=>{

    let current=0;

    area.innerHTML=`

      <div class="challengeTitle">MEMORY MOTOR</div>

      <div class="question">
        Натискай у правильному порядку
      </div>

      <div class="memoryGrid" id="memoryBtns">
        ${shuffle(symbols.slice(0,count)).map(x=>`
          <button class="memoryItem memoryButton"
            data-symbol="${x}">
            ${x}
          </button>
        `).join("")}
      </div>
    `;

    const buttons=
      [...area.querySelectorAll(".memoryButton")];

    buttons.forEach(btn=>{

      btn.addEventListener("pointerdown",()=>{

        const symbol=btn.dataset.symbol;

        if(symbol!==sequence[current]){

          fail();
          finishMotor(false);
          return;

        }

        btn.style.background="#17684f";

        current++;

        state.totalTasks++;
        state.correctTasks++;

        success("memory");

        if(current>=sequence.length){

          finishMotor(true);

        }

      });

    });

  },1200/cfg().time);

}


/* =========================================================
   BOSS
========================================================= */

function startBoss(){

  const area=$("challenge");

  let phase=0;

  const phases=[

    {
      title:"PHASE 1 • УВАЖНІСТЬ",
      question:"Знайди синій символ",
      options:["🔴","🟢","🔵","🟡"],
      answer:2
    },

    {
      title:"PHASE 2 • ЛОГІКА",
      question:"Усі NEX мають N. Цей персонаж має N. Що можна точно сказати?",
      options:[
        "Він точно NEX",
        "Цього недостатньо",
        "Він точно не NEX",
        "Він лікар"
      ],
      answer:1
    },

    {
      title:"PHASE 3 • ШВИДКІСТЬ",
      question:"Натисни правильний символ",
      options:["▲","●","◆","★"],
      answer:0
    }

  ];

  function render(){

    const p=phases[phase];

    area.innerHTML=`

      <div class="boss">

        <div class="challengeTitle">${p.title}</div>

        <div class="bossIcon">🧠</div>

        <div class="question">${p.question}</div>

        <div class="answers">

          ${p.options.map((x,i)=>`
            <button class="answer" data-boss="${i}">
              ${x}
            </button>
          `).join("")}

        </div>

      </div>
    `;

    nexSay(
      phase===0
      ? "Добре. Почнемо з уважності."
      : phase===1
      ? "Тепер думай. Не роби висновок без достатніх даних."
      : "Останній етап. Швидко!"
    );

    area.querySelectorAll(".answer").forEach(btn=>{

      btn.addEventListener("pointerdown",()=>{

        const i=Number(btn.dataset.boss);

        if(i!==p.answer){

          fail();
          finishMotor(false);
          return;

        }

        btn.classList.add("good");

        phase++;

        state.totalTasks++;
        state.correctTasks++;

        success(
          phase===1 ? "focus" :
          phase===2 ? "mind" :
          "reflex"
        );

        if(phase>=phases.length){

          state.score+=500;
          state.xp+=100;

          toast("👑 BOSS ПРОЙДЕНО!");

          nexSay("Оце вже серйозно. Ти пройшов.");

          setTimeout(()=>{

            state.block++;
            state.blockStep=0;

            nextTask();

          },900);

        }else{

          setTimeout(render,350);

        }

      });

    });

  }

  render();

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

  clearTimeout(motorTimer);
  clearInterval(motorTimer);

  saveStats();

  $("finalScore").textContent=state.score;

  $("rMind").textContent=Math.min(100,state.mind);
  $("rFocus").textContent=Math.min(100,state.focus);
  $("rMemory").textContent=Math.min(100,state.memory);
  $("rReflex").textContent=Math.min(100,state.reflex);
  $("rMotor").textContent=Math.min(100,state.motor);

  $("rCombo").textContent=state.bestCombo;

  show($("result"));

}


/* =========================================================
   HOME
========================================================= */

function home(){

  if(motorCleanup){
    motorCleanup();
    motorCleanup=null;
  }

  clearTimeout(motorTimer);
  clearInterval(motorTimer);

  show($("start"));

  nexSay(
    "Готовий продовжити? Я вже придумав для тебе нові випробування."
  );

  refreshHome();

}

function refreshHome(){

  $("bestScore").textContent=
    localStorage.getItem("neuroBest")||0;

  $("bestLevel").textContent=
    localStorage.getItem("neuroBestLevel")||0;

  $("gamesPlayed").textContent=
    localStorage.getItem("neuroGames")||0;

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

  $("settingsModal").classList.remove("hidden");

  updateSettingsUI();

}

function closeSettings(){

  $("settingsModal").classList.add("hidden");

}

function updateSettingsUI(){

  document
    .querySelectorAll(".settingBtn[data-diff]")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.diff===state.difficulty
      );

    });

  $("musicBtn").textContent=
    state.music
    ? "🎵 Музика: ON"
    : "🎵 Музика: OFF";

  $("sfxBtn").textContent=
    state.sfx
    ? "🔊 Ефекти: ON"
    : "🔊 Ефекти: OFF";

}

document
  .querySelectorAll(".settingBtn[data-diff]")
  .forEach(btn=>{

    btn.addEventListener("pointerdown",()=>{

      state.difficulty=btn.dataset.diff;

      localStorage.setItem(
        "neuroDifficulty",
        state.difficulty
      );

      updateSettingsUI();

      toast(
        "Складність: "+
        btn.textContent
      );

    });

  });

$("musicBtn").addEventListener("pointerdown",()=>{

  state.music=!state.music;

  localStorage.setItem(
    "neuroMusic",
    state.music ? "on":"off"
  );

  updateSettingsUI();

});

$("sfxBtn").addEventListener("pointerdown",()=>{

  state.sfx=!state.sfx;

  localStorage.setItem(
    "neuroSfx",
    state.sfx ? "on":"off"
  );

  updateSettingsUI();

});


/* =========================================================
   BUTTONS
========================================================= */

$("startBtn").addEventListener(
  "pointerdown",
  ()=>startGame(false)
);

$("dailyBtn").addEventListener(
  "pointerdown",
  ()=>startGame(true)
);

$("settingsBtn").addEventListener(
  "pointerdown",
  openSettings
);

$("closeSettings").addEventListener(
  "pointerdown",
  closeSettings
);

$("homeBtn").addEventListener(
  "pointerdown",
  home
);


/* =========================================================
   INIT
========================================================= */

refillQuestions();
refreshHome();
updateSettingsUI();

</script>
