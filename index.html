<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEURO — Doctor NEX</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#030714;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
button{
  font:inherit;
  color:white;
  cursor:pointer;
}
.hidden{display:none!important}

.app{
  width:min(100%,760px);
  margin:auto;
  min-height:100vh;
  padding:18px;
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:5px;
  color:#55e8ff;
  text-shadow:0 0 25px #18cfff;
}
.subtitle{
  text-align:center;
  color:#7890b5;
  font-size:12px;
  letter-spacing:3px;
  margin-bottom:16px;
}

/* ---------- NEX ---------- */

.nex-stage{
  height:290px;
  border:1px solid #12375b;
  border-radius:24px;
  background:
    radial-gradient(circle at 50% 70%,rgba(0,220,255,.15),transparent 45%),
    linear-gradient(145deg,#09132e,#071022);
  position:relative;
  overflow:hidden;
  margin-bottom:14px;
}

.nex-stage:after{
  content:"";
  position:absolute;
  bottom:-90px;
  left:50%;
  transform:translateX(-50%);
  width:330px;
  height:160px;
  background:#073a60;
  filter:blur(35px);
  opacity:.5;
}

.nex{
  position:absolute;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  width:150px;
  height:225px;
  z-index:2;
  transition:.25s;
}

/* head */
.nex-head{
  position:absolute;
  width:92px;
  height:92px;
  left:29px;
  top:0;
  background:#ffd0a3;
  border-radius:45% 45% 48% 48%;
  z-index:5;
  box-shadow:0 4px 15px #0005;
}

.nex-hair{
  position:absolute;
  width:94px;
  height:42px;
  left:-1px;
  top:-2px;
  background:#74492f;
  border-radius:35px 35px 12px 12px;
}

.eye{
  position:absolute;
  width:9px;
  height:13px;
  background:#152640;
  border-radius:50%;
  top:49px;
}
.eye.left{left:26px}
.eye.right{right:26px}

.nex-mouth{
  position:absolute;
  width:28px;
  height:12px;
  left:32px;
  top:68px;
  border-bottom:3px solid #743e3b;
  border-radius:0 0 50% 50%;
}

/* body */
.nex-body{
  position:absolute;
  width:108px;
  height:125px;
  left:21px;
  top:83px;
  background:#f7faff;
  border-radius:25px 25px 15px 15px;
  box-shadow:0 8px 20px #0005;
}

.nex-shirt{
  position:absolute;
  width:45px;
  height:103px;
  left:31px;
  top:10px;
  background:#092747;
  border-radius:5px 5px 12px 12px;
}

.nex-shirt:after{
  content:"N";
  position:absolute;
  top:30px;
  width:100%;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#51e8ff;
}

.stethoscope{
  position:absolute;
  width:52px;
  height:63px;
  left:27px;
  top:2px;
  border:3px solid #172e47;
  border-top:0;
  border-radius:0 0 30px 30px;
}

.stethoscope:after{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  background:#172e47;
  border-radius:50%;
  left:18px;
  bottom:-7px;
}

.arm{
  position:absolute;
  width:28px;
  height:88px;
  background:#f7faff;
  border-radius:18px;
  top:95px;
  z-index:1;
  transform-origin:top center;
}
.arm.left{left:4px;transform:rotate(12deg)}
.arm.right{right:4px;transform:rotate(-12deg)}

/* speech */
.nex-bubble{
  position:absolute;
  left:12px;
  top:12px;
  max-width:290px;
  padding:13px 15px;
  border:1px solid #16d9ff;
  border-radius:16px;
  background:#061426eF;
  color:#e9fbff;
  font-size:14px;
  line-height:1.25;
  z-index:10;
  box-shadow:0 0 18px #00d9ff25;
}

/* reactions */
.nex.happy{
  animation:nexHappy .65s ease;
}
.nex.sad{
  animation:nexSad .55s ease;
}
.nex.think{
  animation:nexThink 1s ease;
}
.nex.surprise{
  animation:nexSurprise .5s ease;
}
.nex.encourage{
  animation:nexEncourage .7s ease;
}
.nex.combo{
  animation:nexCombo .8s ease;
}
.nex.victory{
  animation:nexVictory 1s ease;
}

.nex.happy .nex-mouth{
  width:34px;
  height:18px;
  left:29px;
  border-bottom:5px solid #743e3b;
}
.nex.sad .nex-mouth{
  border-bottom:0;
  border-top:3px solid #743e3b;
  top:76px;
}
.nex.surprise .nex-mouth{
  width:15px;
  height:15px;
  left:39px;
  border:3px solid #743e3b;
  border-radius:50%;
}
.nex.think .eye.left{
  transform:translateY(-3px);
}
.nex.think .eye.right{
  transform:translateY(-3px);
}
.nex.combo{
  filter:drop-shadow(0 0 18px #22e6ff);
}

@keyframes nexHappy{
  0%,100%{transform:translateX(-50%) translateY(0)}
  35%{transform:translateX(-50%) translateY(-18px) rotate(-3deg)}
  70%{transform:translateX(-50%) translateY(-7px) rotate(3deg)}
}
@keyframes nexSad{
  0%,100%{transform:translateX(-50%) rotate(0)}
  30%{transform:translateX(-50%) rotate(-7deg)}
  60%{transform:translateX(-50%) rotate(7deg)}
}
@keyframes nexThink{
  0%,100%{transform:translateX(-50%)}
  50%{transform:translateX(-50%) translateY(-8px) rotate(2deg)}
}
@keyframes nexSurprise{
  0%{transform:translateX(-50%) scale(1)}
  40%{transform:translateX(-50%) scale(1.12)}
  100%{transform:translateX(-50%) scale(1)}
}
@keyframes nexEncourage{
  0%,100%{transform:translateX(-50%)}
  25%{transform:translateX(-50%) rotate(-5deg)}
  50%{transform:translateX(-50%) rotate(5deg)}
  75%{transform:translateX(-50%) rotate(-3deg)}
}
@keyframes nexCombo{
  0%{transform:translateX(-50%) scale(1)}
  30%{transform:translateX(-50%) scale(1.12)}
  60%{transform:translateX(-50%) scale(.98)}
  100%{transform:translateX(-50%) scale(1)}
}
@keyframes nexVictory{
  0%{transform:translateX(-50%) translateY(0)}
  30%{transform:translateX(-50%) translateY(-25px) rotate(-5deg)}
  60%{transform:translateX(-50%) translateY(-12px) rotate(5deg)}
  100%{transform:translateX(-50%)}
}

/* ---------- START ---------- */

.card{
  background:#071128;
  border:1px solid #153359;
  border-radius:22px;
  padding:18px;
  margin-bottom:12px;
}

.bigbtn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px;
  font-weight:900;
  font-size:18px;
  background:linear-gradient(100deg,#16d5ee,#5268ff);
  box-shadow:0 8px 25px #176eff30;
}

.smallrow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.smallbtn{
  border:1px solid #18385f;
  background:#0c1935;
  border-radius:13px;
  padding:14px;
}

/* ---------- HUD ---------- */

.hud{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:8px;
}

.hudbox{
  background:#071128;
  border:1px solid #153359;
  border-radius:18px;
  padding:10px;
  text-align:center;
}
.hudbox small{
  color:#7185a7;
  display:block;
  font-size:10px;
  text-transform:uppercase;
}
.hudbox strong{
  color:#53e5ff;
  font-size:18px;
}

.progress{
  height:7px;
  border-radius:10px;
  background:#0d1c36;
  overflow:hidden;
  margin-bottom:12px;
}
.progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#1ad7ed,#5d62ff);
  width:0;
  transition:.3s;
}

/* ---------- QUESTION ---------- */

.type{
  color:#4de4ff;
  text-align:center;
  font-size:12px;
  letter-spacing:2px;
  font-weight:bold;
  margin-bottom:15px;
}

.question{
  font-size:21px;
  font-weight:800;
  text-align:center;
  line-height:1.3;
  margin-bottom:20px;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.answer{
  min-height:62px;
  border:1px solid #203d69;
  background:#0d1b38;
  border-radius:14px;
  padding:12px;
  font-weight:bold;
  transition:.15s;
}
.answer:hover{
  border-color:#34dcff;
  transform:translateY(-2px);
}
.answer.correct{
  background:#0c573d;
  border-color:#2dffb2;
}
.answer.wrong{
  background:#632536;
  border-color:#ff5575;
}

/* ---------- MOTOR ---------- */

.motor{
  position:relative;
  height:350px;
  border:1px solid #17385f;
  border-radius:20px;
  overflow:hidden;
  background:#050d1e;
}

.ball{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#24dfff;
  box-shadow:0 0 25px #24dfff;
  cursor:pointer;
}

.motor-info{
  text-align:center;
  margin-bottom:10px;
  color:#8ea3c7;
}

.reaction-zone{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
}
.react-btn{
  width:190px;
  height:190px;
  border-radius:50%;
  border:5px solid #233c66;
  background:#101d3b;
  font-size:25px;
  font-weight:900;
}
.react-btn.go{
  background:#1de5a3;
  color:#03130f;
  border-color:#7affd0;
}

/* ---------- RESULT ---------- */

.result{
  text-align:center;
}
.result h1{
  color:#55e8ff;
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.stat{
  padding:16px;
  background:#0c1935;
  border:1px solid #193860;
  border-radius:14px;
}
.stat b{
  display:block;
  font-size:22px;
  color:#52e5ff;
}
.stat span{
  color:#788eaf;
  font-size:11px;
}

/* ---------- SETTINGS ---------- */

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}
.modalbox{
  width:min(100%,480px);
  background:#08142d;
  border:1px solid #1d426e;
  border-radius:22px;
  padding:20px;
}
.diff{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.diff button{
  padding:13px;
  border:1px solid #1a3b63;
  background:#0d1b37;
  border-radius:12px;
}
.diff button.active{
  background:#174b67;
  border-color:#38e3ff;
}

/* ---------- MOBILE ---------- */

@media(max-width:600px){
  .logo{font-size:34px}
  .nex-stage{height:250px}
  .question{font-size:18px}
  .answers{grid-template-columns:1fr}
  .motor{height:300px}
}
</style>
</head>

<body>

<div class="app">

  <!-- START -->
  <section id="start">

    <div class="logo">NEURO</div>
    <div class="subtitle">MIND • FOCUS • REFLEX • MOTOR</div>

    <div class="nex-stage">
      <div id="startBubble" class="nex-bubble">
        Привіт! Я Doctor NEX. Перевіримо твій мозок?
      </div>

      <div id="nexStart" class="nex">
        <div class="nex-head">
          <div class="nex-hair"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nex-mouth"></div>
        </div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="nex-body">
          <div class="nex-shirt"></div>
          <div class="stethoscope"></div>
        </div>
      </div>
    </div>

    <div class="hud">
      <div class="hudbox">
        <small>Рекорд</small>
        <strong id="best">0</strong>
      </div>
      <div class="hudbox">
        <small>Рівень</small>
        <strong id="levelStart">1</strong>
      </div>
      <div class="hudbox">
        <small>Ігр</small>
        <strong>3</strong>
      </div>
    </div>

    <button class="bigbtn" id="startBtn">🧠 ПОЧАТИ NEURO</button>

    <div class="smallrow">
      <button class="smallbtn" id="dailyBtn">📅 DAILY</button>
      <button class="smallbtn" id="settingsBtn">⚙️ НАЛАШТУВАННЯ</button>
    </div>

  </section>

  <!-- GAME -->
  <section id="game" class="hidden">

    <div class="hud">
      <div class="hudbox">
        <small>Блок</small>
        <strong id="block">1</strong>
      </div>
      <div class="hudbox">
        <small>Життя</small>
        <strong id="lives">❤️ ❤️ ❤️</strong>
      </div>
      <div class="hudbox">
        <small>Очки</small>
        <strong id="score">0</strong>
      </div>
    </div>

    <div class="progress">
      <i id="progress"></i>
    </div>

    <div class="nex-stage" style="height:230px">

      <div id="gameBubble" class="nex-bubble">
        Не поспішай. Подумай.
      </div>

      <div id="nexGame" class="nex">

        <div class="nex-head">
          <div class="nex-hair"></div>
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="nex-mouth"></div>
        </div>

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="nex-body">
          <div class="nex-shirt"></div>
          <div class="stethoscope"></div>
        </div>

      </div>

    </div>

    <div id="challenge" class="card"></div>

  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">

    <div class="card result">
      <h1>NEURO COMPLETE</h1>

      <div style="font-size:46px;font-weight:900" id="finalScore">0</div>
      <div style="color:#7186a8">ОЧКИ</div>

      <br>

      <div class="stats">
        <div class="stat">
          <b id="rMind">0</b>
          <span>MIND</span>
        </div>
        <div class="stat">
          <b id="rFocus">0</b>
          <span>FOCUS</span>
        </div>
        <div class="stat">
          <b id="rMemory">0</b>
          <span>MEMORY</span>
        </div>
        <div class="stat">
          <b id="rReflex">0</b>
          <span>REFLEX</span>
        </div>
        <div class="stat">
          <b id="rMotor">0</b>
          <span>MOTOR</span>
        </div>
        <div class="stat">
          <b id="rCombo">0</b>
          <span>BEST COMBO</span>
        </div>
      </div>

      <br>

      <button class="bigbtn" onclick="goHome()">🏠 НА ГОЛОВНИЙ ЕКРАН</button>

    </div>

  </section>

</div>

<!-- SETTINGS -->
<div id="settingsModal" class="modal hidden">

  <div class="modalbox">

    <h2>⚙️ Налаштування</h2>

    <p>Складність</p>

    <div class="diff">
      <button data-diff="easy">Easy</button>
      <button data-diff="normal">Normal</button>
      <button data-diff="hard">Hard</button>
      <button data-diff="expert">Expert</button>
      <button data-diff="adaptive">Adaptive</button>
    </div>

    <br>

    <button class="smallbtn" style="width:100%" id="closeSettings">
      ЗАКРИТИ
    </button>

  </div>

</div>

<script>

/* =========================================================
   STATE
========================================================= */

const S = {
  level:1,
  block:1,
  step:0,
  score:0,
  lives:3,
  combo:0,
  bestCombo:0,

  mind:0,
  focus:0,
  memory:0,
  reflex:0,
  motor:0,

  correct:0,
  total:0,

  difficulty:localStorage.getItem("neuroDifficulty") || "normal"
};

const DIFF = {
  easy:{
    speed:.72,
    time:1.35,
    mem:4
  },
  normal:{
    speed:1,
    time:1,
    mem:5
  },
  hard:{
    speed:1.25,
    time:.78,
    mem:6
  },
  expert:{
    speed:1.55,
    time:.58,
    mem:7
  },
  adaptive:{
    speed:1,
    time:1,
    mem:5
  }
};

function difficulty(){

  if(S.difficulty !== "adaptive")
    return DIFF[S.difficulty];

  let rate = S.total ? S.correct/S.total : .5;

  if(rate > .8) return DIFF.hard;
  if(rate < .45) return DIFF.easy;

  return DIFF.normal;
}

/* =========================================================
   NEX
========================================================= */

const nexGame = document.getElementById("nexGame");
const nexStart = document.getElementById("nexStart");

function nexReact(type,text){

  const nex = nexGame.classList.contains("hidden")
    ? nexStart
    : nexGame;

  const bubble = nexGame.classList.contains("hidden")
    ? document.getElementById("startBubble")
    : document.getElementById("gameBubble");

  nex.classList.remove(
    "happy",
    "sad",
    "think",
    "surprise",
    "encourage",
    "combo",
    "victory"
  );

  void nex.offsetWidth;

  nex.classList.add(type);

  bubble.textContent = text;

  clearTimeout(nexReact.timer);

  nexReact.timer = setTimeout(()=>{
    nex.classList.remove(type);
  },1100);
}

/* ---------- реакції ---------- */

const NEX = {

  correct(){

    if(S.combo >= 3){

      nexReact(
        "combo",
        "🔥 Серія! Так тримати!"
      );

    }else{

      const lines = [
        "Саме так!",
        "Правильно.",
        "Чудово!",
        "Є! Мозок працює.",
        "Так і треба.",
        "Точно."
      ];

      nexReact(
        "happy",
        lines[Math.floor(Math.random()*lines.length)]
      );
    }
  },

  wrong(){

    const lines = [
      "Не поспішай. Подумай.",
      "Майже. Уважніше.",
      "Цього разу ні.",
      "Стоп. Подивись ще раз.",
      "Не дай пастці себе обдурити."
    ];

    nexReact(
      "sad",
      lines[Math.floor(Math.random()*lines.length)]
    );
  },

  think(){

    nexReact(
      "think",
      "Хм... тут є маленька пастка."
    );
  },

  surprise(){

    nexReact(
      "surprise",
      "Ого! Швидка реакція!"
    );
  },

  encourage(){

    nexReact(
      "encourage",
      "Не здавайся. Наступне твоє."
    );
  },

  lifeLost(){

    nexReact(
      "sad",
      "Обережно. Залишилось менше життя."
    );
  },

  motor(){

    nexReact(
      "think",
      "Тепер перевіримо твою реакцію."
    );
  },

  victory(){

    nexReact(
      "victory",
      "🏆 Блок пройдено! Сильна робота!"
    );
  }
};

/* =========================================================
   QUESTIONS
========================================================= */

const Q = [

{
 type:"MIND",
 text:"Марко молодший за Олега. Олег молодший за Івана. Хто найстарший?",
 answers:["Марко","Олег","Іван","Невідомо"],
 correct:2,
 stat:"mind"
},

{
 type:"MIND",
 text:"Усі лікарі в цій кімнаті мають халати. Некс має халат. Чи обов'язково Некс лікар?",
 answers:["Так","Ні","Лише вранці","Неможливо визначити"],
 correct:3,
 stat:"mind"
},

{
 type:"FOCUS",
 text:"Знайди слово, яке відрізняється:",
 answers:["СІЛЬ","СІЛЬ","СІЛЬ","СИЛЬ"],
 correct:3,
 stat:"focus"
},

{
 type:"FOCUS",
 text:"Який символ зайвий?",
 answers:["▲","▲","△","▲"],
 correct:2,
 stat:"focus"
},

{
 type:"MIND",
 text:"У кімнаті 3 вимикачі. Один вмикає лампу в іншій кімнаті. Ти можеш зайти туди лише один раз. Що допоможе визначити вимикач?",
 answers:[
   "Лише подивитися",
   "Залишити один увімкненим, інший увімкнути на час і вимкнути",
   "Натиснути всі",
   "Ніяк"
 ],
 correct:1,
 stat:"mind"
},

{
 type:"SPACE",
 text:"Якщо повернути стрілку ↑ на 180°, куди вона вказуватиме?",
 answers:["←","→","↓","↑"],
 correct:2,
 stat:"mind"
},

{
 type:"MEMORY",
 text:"Запам'ятай порядок: 🔵 🟢 🔴 🟡. Який був третій?",
 answers:["🔵","🟢","🔴","🟡"],
 correct:2,
 stat:"memory"
},

{

/* =========================================================
   UI
========================================================= */

const start = document.getElementById("start");
const game = document.getElementById("game");
const result = document.getElementById("result");
const challenge = document.getElementById("challenge");

function updateHUD(){

  document.getElementById("block").textContent = S.block;
  document.getElementById("score").textContent = S.score;

  document.getElementById("lives").textContent =
    "❤️".repeat(S.lives) +
    "🖤".repeat(Math.max(0,3-S.lives));

  document.getElementById("progress").style.width =
    `${((S.step)/5)*100}%`;
}

function randomQ(){

  return Q[Math.floor(Math.random()*Q.length)];
}

/* =========================================================
   GAME FLOW
========================================================= */

let currentQ = null;
let motorTimer = null;

function startGame(){

  S.level=1;
  S.block=1;
  S.step=0;
  S.score=0;
  S.lives=3;
  S.combo=0;
  S.bestCombo=0;

  S.mind=0;
  S.focus=0;
  S.memory=0;
  S.reflex=0;
  S.motor=0;

  S.correct=0;
  S.total=0;

  start.classList.add("hidden");
  result.classList.add("hidden");
  game.classList.remove("hidden");

  nexReact(
    "encourage",
    "Починаємо. 4 завдання для мозку — потім перевіримо реакцію."
  );

  updateHUD();

  nextTask();
}

function nextTask(){

  updateHUD();

  if(S.lives<=0){
    finishGame();
    return;
  }

  /*
    4 логічні + 1 моторне
  */

  if(S.step < 4){

    S.step++;

    nextQuestion();

  }else{

    S.step=5;

    startMotor();

  }
}

/* =========================================================
   QUESTIONS
========================================================= */

function nextQuestion(){

  currentQ=randomQ();

  document.getElementById("progress").style.width =
    `${(S.step/5)*100}%`;

  if(currentQ.type==="MEMORY")
    nexReact("think","Запам'ятай уважно...");

  else
    nexReact("think","Спокійно. Шукай закономірність.");

  challenge.innerHTML=`

    <div class="type">${currentQ.type}</div>

    <div class="question">
      ${currentQ.text}
    </div>

    <div class="answers">

      ${currentQ.answers.map((a,i)=>`
        <button class="answer" data-index="${i}">
          ${a}
        </button>
      `).join("")}

    </div>
  `;

  challenge.querySelectorAll(".answer")
    .forEach(btn=>{

      btn.onclick=()=>{

        const index=Number(btn.dataset.index);

        answerQuestion(index,btn);

      };

    });
}

function answerQuestion(index,btn){

  const buttons=challenge.querySelectorAll(".answer");

  buttons.forEach(b=>b.disabled=true);

  S.total++;

  const good=index===currentQ.correct;

  if(good){

    btn.classList.add("correct");

    S.correct++;

    S.combo++;
    S.bestCombo=Math.max(S.bestCombo,S.combo);

    S.score+=100+(S.combo*10);

    if(currentQ.stat==="mind") S.mind+=1;
    if(currentQ.stat==="focus") S.focus+=1;
    if(currentQ.stat==="memory") S.memory+=1;

    if(S.combo>=3)
      NEX.correct();
    else
      NEX.correct();

    setTimeout(nextTask,700);

  }else{

    btn.classList.add("wrong");

    buttons[currentQ.correct]
      .classList.add("correct");

    S.lives--;
    S.combo=0;

    NEX.wrong();

    setTimeout(()=>{

      if(S.lives<=0){

        finishGame();

      }else{

        NEX.lifeLost();

        setTimeout(nextTask,700);

      }

    },850);
  }

  updateHUD();
}

/* =========================================================
   MOTOR
========================================================= */

function startMotor(){

  clearTimeout(motorTimer);

  NEX.motor();

  const types=[
    motorBall,
    motorReaction,
    motorTracking,
    motorPrecision
  ];

  const fn=types[Math.floor(Math.random()*types.length)];

  setTimeout(fn,700);
}

/* ---------- BALL ---------- */

function motorBall(){

  challenge.innerHTML=`

    <div class="type">MOTOR • REFLEX</div>

    <div class="motor-info">
      Натисни на <b>синю кулю</b> 6 разів.
    </div>

    <div class="motor" id="motorArea"></div>
  `;

  const area=document.getElementById("motorArea");

  let hits=0;

  function spawn(){

    if(hits>=6){

      finishMotor(true);
      return;
    }

    const ball=document.createElement("div");

    ball.className="ball";

    const maxX=area.clientWidth-55;
    const maxY=area.clientHeight-55;

    ball.style.left=(Math.random()*maxX)+"px";
    ball.style.top=(Math.random()*maxY)+"px";

    area.innerHTML="";
    area.appendChild(ball);

    ball.onclick=()=>{

      hits++;

      S.reflex++;
      S.motor++;

      S.score+=80;

      nexReact(
        hits>=5 ? "combo" : "happy",
        hits>=5 ? "🔥 Ще трохи!" : "Влучив!"
      );

      spawn();

      updateHUD();
    };

    motorTimer=setTimeout(()=>{

      nexReact(
        "surprise",
        "Швидше! Вона втекла!"
      );

      spawn();

    },1200*difficulty().time);
  }

  spawn();
}

/* ---------- REACTION ---------- */

function motorReaction(){

  challenge.innerHTML=`

    <div class="type">MOTOR • REACTION</div>

    <div class="motor-info">
      Чекай зелений сигнал. Потім натисни.
    </div>

    <div class="motor" id="motorArea">
      <div class="reaction-zone">
        <button class="react-btn" id="reactBtn">
          ЧЕКАЙ
        </button>
      </div>
    </div>
  `;

  const btn=document.getElementById("reactBtn");

  let ready=false;
  let finished=false;

  const delay=900+Math.random()*2300;

  const timer=setTimeout(()=>{

    ready=true;

    btn.classList.add("go");
    btn.textContent="НАТИСКАЙ!";

    nexReact(
      "surprise",
      "ЗАРАЗ!"
    );

  },delay);

  btn.onclick=()=>{

    if(finished)return;

    if(!ready){

      clearTimeout(timer);

      finished=true;

      S.lives--;
      S.combo=0;

      nexReact(
        "sad",
        "Зарано! Не поспішай."
      );

      updateHUD();

      setTimeout(()=>{
        if(S.lives<=0) finishGame();
        else finishMotor(false);
      },800);

      return;
    }

    finished=true;

    const reaction=Math.round(delay/3);

    S.reflex++;
    S.motor++;

    S.score+=150;

    nexReact(
      "happy",
      "⚡ Рефлекс є!"
    );

    updateHUD();

    setTimeout(()=>finishMotor(true),600);
  };
}

/* ---------- TRACKING ---------- */

function motorTracking(){

  challenge.innerHTML=`

    <div class="type">MOTOR • TRACKING</div>

    <div class="motor-info">
      Встигни натиснути на ціль 5 разів.
    </div>

    <div class="motor" id="motorArea"></div>
  `;

  const area=document.getElementById("motorArea");

  let hits=0;

  function target(){

    if(hits>=5){

      finishMotor(true);
      return;
    }

    const t=document.createElement("div");

    t.className="ball";

    t.style.left=Math.random()*(area.clientWidth-48)+"px";
    t.style.top=Math.random()*(area.clientHeight-48)+"px";

    area.innerHTML="";
    area.appendChild(t);

    t.onclick=()=>{

      hits++;

      S.motor++;
      S.reflex++;
      S.score+=90;

      nexReact(
        "happy",
        hits===5 ? "Ідеально!" : "Влучно!"
      );

      target();
      updateHUD();
    };

    motorTimer=setTimeout(()=>{

      nexReact(
        "encourage",
        "Не втрачай ціль!"
      );

      target();

    },1000*difficulty().time);
  }

  target();
}

/* ---------- PRECISION ---------- */

function motorPrecision(){

  challenge.innerHTML=`

    <div class="type">MOTOR • PRECISION</div>

    <div class="motor-info">
      Натискай ціль, коли вона в центрі.
    </div>

    <div class="motor" id="motorArea">

      <div style="
        position:absolute;
        width:100px;
        height:100px;
        border:3px dashed #38e3ff;
        border-radius:50%;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
      "></div>

      <div class="ball" id="precisionBall"></div>

    </div>
  `;

  const area=document.getElementById("motorArea");
  const ball=document.getElementById("precisionBall");

  let x=0;
  let direction=1;
  let hits=0;

  ball.style.top="50%";
  ball.style.transform="translateY(-50%)";

  const loop=setInterval(()=>{

    x+=direction*4*difficulty().speed;

    if(x>area.clientWidth-60){
      direction=-1;
    }

    if(x<0){
      direction=1;
    }

    ball.style.left=x+"px";

  },20);

  ball.onclick=()=>{

    const center=area.clientWidth/2;
    const ballCenter=x+24;

    const distance=Math.abs(center-ballCenter);

    if(distance<55){

      hits++;

      S.motor++;
      S.reflex++;
      S.score+=110;

      nexReact(
        "happy",
        "🎯 Точно!"
      );

      if(hits>=3){

        clearInterval(loop);

        setTimeout(()=>finishMotor(true),500);

      }

    }else{

      S.lives--;
      S.combo=0;

      nexReact(
        "sad",
        "Трохи мимо..."
      );

      if(S.lives<=0){

        clearInterval(loop);
        setTimeout(finishGame,600);

      }
    }

    updateHUD();
  };

}

/* =========================================================
   MOTOR FINISH
========================================================= */

function finishMotor(success){

  clearTimeout(motorTimer);

  if(success){

    S.score+=250;
    S.level++;
    S.block++;

    nexReact(
      "victory",
      "🏆 Блок пройден! Наступний буде складніший."
    );

  }else{

    S.combo=0;

    NEX.encourage();
  }

  S.step=0;

  updateHUD();

  setTimeout(()=>{

    if(S.lives<=0)
      finishGame();
    else
      nextTask();

  },900);
}

/* =========================================================
   GAME OVER
========================================================= */

function finishGame(){

  clearTimeout(motorTimer);

  game.classList.add("hidden");
  result.classList.remove("hidden");

  document.getElementById("finalScore").textContent=S.score;

  document.getElementById("rMind").textContent=S.mind;
  document.getElementById("rFocus").textContent=S.focus;
  document.getElementById("rMemory").textContent=S.memory;
  document.getElementById("rReflex").textContent=S.reflex;
  document.getElementById("rMotor").textContent=S.motor;
  document.getElementById("rCombo").textContent=S.bestCombo;

  const old=Number(localStorage.getItem("neuroBest")||0);

  if(S.score>old)
    localStorage.setItem("neuroBest",S.score);

  nexReact(
    "sad",
    S.score>old
      ? "Новий рекорд! Це було сильно."
      : "Спробуй ще раз. Тепер ти знаєш, чого чекати."
  );
}

/* =========================================================
   HOME
========================================================= */

function goHome(){

  result.classList.add("hidden");
  game.classList.add("hidden");
  start.classList.remove("hidden");

  document.getElementById("best").textContent =
    localStorage.getItem("neuroBest")||0;

  document.getElementById("levelStart").textContent=1;

  nexReact(
    "happy",
    "Готовий перевірити себе ще раз?"
  );
}

/* =========================================================
   SETTINGS
========================================================= */

document.getElementById("settingsBtn").onclick=()=>{

  document.getElementById("settingsModal")
    .classList.remove("hidden");

  updateDifficultyButtons();
};

document.getElementById("closeSettings").onclick=()=>{

  document.getElementById("settingsModal")
    .classList.add("hidden");
};

document.querySelectorAll("[data-diff]")
.forEach(btn=>{

  btn.onclick=()=>{

    S.difficulty=btn.dataset.diff;

    localStorage.setItem(
      "neuroDifficulty",
      S.difficulty
    );

    updateDifficultyButtons();

    nexReact(
      "think",
      "Складність змінено."
    );
  };

});

function updateDifficultyButtons(){

  document.querySelectorAll("[data-diff]")
  .forEach(btn=>{

    btn.classList.toggle(
      "active",
      btn.dataset.diff===S.difficulty
    );

  });
}

/* =========================================================
   START
========================================================= */

document.getElementById("startBtn").onclick=startGame;

document.getElementById("dailyBtn").onclick=()=>{

  nexReact(
    "surprise",
    "Daily ще готується. Скоро буде окремий виклик!"
  );
};

document.getElementById("best").textContent =
  localStorage.getItem("neuroBest")||0;

document.getElementById("levelStart").textContent=1;

updateDifficultyButtons();
