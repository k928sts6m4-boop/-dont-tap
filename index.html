<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#060812">

<title>NEURO — Mind • Reflex • Focus</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#060812;
    --panel:#101421;
    --panel2:#171c2a;
    --line:rgba(255,255,255,.08);
    --text:#f6f7fb;
    --muted:#8e96aa;
    --accent:#7c5cff;
    --cyan:#00d9ff;
    --green:#35e77d;
    --red:#ff4d6d;
    --yellow:#ffc857;
}

html,
body{
    margin:0;
    min-height:100%;
    background:
        radial-gradient(
            circle at 50% -15%,
            rgba(124,92,255,.20),
            transparent 34%
        ),
        radial-gradient(
            circle at 100% 90%,
            rgba(0,217,255,.07),
            transparent 26%
        ),
        var(--bg);

    color:var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font:inherit;
}

button:disabled{
    cursor:default;
}


/* =========================================
   START SCREEN
========================================= */

.screen{
    min-height:100vh;

    display:none;

    align-items:center;
    justify-content:center;

    padding:18px;
}

.screen.active{
    display:flex;
}

.container{
    width:100%;
    max-width:720px;
    margin:auto;
}

.logo{
    text-align:center;
    margin-bottom:24px;
}

.logo-mark{
    width:84px;
    height:84px;

    margin:0 auto 18px;

    border-radius:28px;

    display:grid;
    place-items:center;

    font-size:42px;

    background:
        linear-gradient(
            135deg,
            #7c5cff,
            #432fbb
        );

    box-shadow:
        0 20px 70px
        rgba(124,92,255,.28);
}

.logo h1{
    margin:0;

    font-size:46px;

    letter-spacing:-2.5px;
}

.logo p{
    margin:7px 0 0;

    color:var(--muted);
}

.panel{
    background:
        rgba(16,20,33,.94);

    border:
        1px solid var(--line);

    border-radius:28px;

    padding:22px;

    box-shadow:
        0 26px 90px
        rgba(0,0,0,.35);

    backdrop-filter:
        blur(16px);
}

.start-stats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:9px;

    margin-bottom:16px;
}

.start-stat{
    background:
        var(--panel2);

    border-radius:17px;

    padding:14px 8px;

    text-align:center;
}

.start-stat strong{
    display:block;

    font-size:21px;
}

.start-stat span{
    display:block;

    color:var(--muted);

    font-size:9px;

    text-transform:uppercase;
}

.main-btn,
.ghost-btn{

    width:100%;

    border:0;

    border-radius:18px;

    padding:16px 18px;

    color:#fff;

    cursor:pointer;

    font-weight:800;
}

.main-btn{

    background:
        linear-gradient(
            135deg,
            #7c5cff,
            #563de4
        );

    box-shadow:
        0 14px 35px
        rgba(124,92,255,.24);
}

.ghost-btn{

    margin-top:10px;

    background:#151a29;

    border:
        1px solid
        var(--line);
}

.btn-row{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

    margin-top:10px;
}

.pill-row{

    display:flex;

    justify-content:center;

    gap:8px;

    flex-wrap:wrap;

    margin-top:14px;
}

.pill{

    padding:
        8px 11px;

    border:
        1px solid
        var(--line);

    border-radius:999px;

    color:var(--muted);

    font-size:11px;

    background:
        rgba(255,255,255,.02);
}


/* =========================================
   GAME
========================================= */

#gameScreen{

    display:none;

    min-height:100vh;

    padding:10px;
}

#gameScreen.active{
    display:block;
}

.game-wrap{

    width:100%;

    max-width:960px;

    margin:auto;
}

.hud{

    display:grid;

    grid-template-columns:
        1fr 1.6fr 1fr;

    gap:8px;

    margin-bottom:7px;
}

.hud-box{

    background:
        rgba(16,20,33,.92);

    border:
        1px solid
        var(--line);

    border-radius:14px;

    padding:
        9px 7px;

    text-align:center;
}

.hud-box small{

    display:block;

    color:var(--muted);

    font-size:9px;

    text-transform:uppercase;

    letter-spacing:.7px;
}

.hud-box strong{
    font-size:14px;
}

.hearts{
    letter-spacing:2px;
}

.progress{

    height:5px;

    background:#1a2030;

    border-radius:10px;

    overflow:hidden;

    margin-bottom:8px;
}

.progress-fill{

    height:100%;

    width:0;

    background:
        linear-gradient(
            90deg,
            var(--accent),
            var(--cyan)
        );

    transition:.25s;
}

.challenge{

    min-height:
        calc(100vh - 92px);

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(124,92,255,.07),
            transparent 42%
        ),
        rgba(12,16,28,.88);

    border:
        1px solid
        var(--line);

    border-radius:25px;

    padding:18px;

    overflow:hidden;

    position:relative;
}

.challenge-header{

    text-align:center;

    margin-bottom:17px;
}

.tag{

    color:var(--cyan);

    font-size:10px;

    font-weight:800;

    letter-spacing:1.45px;

    text-transform:uppercase;
}

.challenge-header h2{

    margin:
        7px 0;

    font-size:26px;

    letter-spacing:-.7px;
}

.challenge-header p{

    margin:0;

    color:var(--muted);

    font-size:12px;
}

.stat-line{

    display:flex;

    justify-content:center;

    gap:8px;

    flex-wrap:wrap;

    margin:12px 0;
}

.stat-chip{

    background:
        var(--panel2);

    border:
        1px solid
        var(--line);

    border-radius:12px;

    padding:
        7px 10px;

    font-size:11px;
}

.stat-chip b{
    color:#fff;
}


/* =========================================
   LOGIC
========================================= */

.sequence{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:9px;

    flex-wrap:wrap;

    margin:22px 0;
}

.seq-item{

    min-width:58px;

    min-height:58px;

    padding:9px;

    border-radius:16px;

    display:grid;

    place-items:center;

    background:
        var(--panel2);

    border:
        1px solid
        var(--line);

    font-size:22px;

    font-weight:800;
}

.seq-item.q{

    border-color:
        rgba(124,92,255,.75);

    color:var(--accent);
}

.answers{

    max-width:520px;

    margin:auto;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;
}

.answer{

    min-height:66px;

    border:
        1px solid
        var(--line);

    border-radius:16px;

    background:
        var(--panel2);

    color:#fff;

    cursor:pointer;

    font-size:20px;

    font-weight:800;

    transition:.15s;
}

.answer:active{
    transform:scale(.97);
}

.answer.correct{

    border-color:
        var(--green);

    background:
        rgba(53,231,125,.13);
}

.answer.wrong{

    border-color:
        var(--red);

    background:
        rgba(255,77,109,.12);
}


/* =========================================
   BALL
========================================= */

.ball-info{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:7px;

    margin-bottom:8px;
}

.ball-stat{

    background:
        var(--panel2);

    padding:8px;

    border-radius:12px;

    text-align:center;
}

.ball-stat span{

    display:block;

    color:var(--muted);

    font-size:9px;

    text-transform:uppercase;
}

.ball-stat strong{
    font-size:16px;
}

.ball-area{

    position:relative;

    height:
        min(67vh,590px);

    min-height:390px;

    overflow:hidden;

    border-radius:21px;

    background:
        radial-gradient(
            circle at center,
            rgba(124,92,255,.08),
            transparent 54%
        ),
        #090d16;

    border:
        1px solid
        var(--line);

    touch-action:none;

    user-select:none;
}

.ball{

    position:absolute;

    width:60px;
    height:60px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    cursor:pointer;

    touch-action:none;

    user-select:none;

    -webkit-user-select:none;

    background:
        radial-gradient(
            circle at 32% 27%,
            #fff 0%,
            #a79aff 12%,
            #795fff 42%,
            #3b22b2 100%
        );

    box-shadow:
        0 0 22px
        rgba(124,92,255,.9),

        0 0 58px
        rgba(124,92,255,.34);

    transition:
        left .08s linear,
        top .08s linear,
        transform .08s;
}

.ball::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:82px;
    height:82px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;
}

.ball:active{

    transform:
        translate(-50%,-50%)
        scale(.8);
}

.target{

    position:absolute;

    width:58px;
    height:58px;

    border-radius:50%;

    cursor:pointer;

    display:grid;

    place-items:center;
}

.target::before{

    content:"";

    position:absolute;

    inset:-10px;

    border-radius:50%;
}

.target.blue{

    background:#4b90ff;

    box-shadow:
        0 0 30px
        rgba(75,144,255,.35);
}

.target.red{

    background:
        var(--red);

    box-shadow:
        0 0 30px
        rgba(255,77,109,.35);
}

.target.green{

    background:
        var(--green);

    box-shadow:
        0 0 30px
        rgba(53,231,125,.35);
}

.target.yellow{

    background:
        var(--yellow);

    box-shadow:
        0 0 30px
        rgba(255,200,87,.35);
}


/* =========================================
   MOTOR
========================================= */

.big-action{

    width:100%;

    min-height:165px;

    border:
        1px solid
        var(--line);

    border-radius:22px;

    background:
        var(--panel2);

    color:#fff;

    cursor:pointer;

    font-size:25px;

    font-weight:800;
}

.reaction-dot{

    width:100px;
    height:100px;

    border-radius:50%;

    margin:35px auto;

    cursor:pointer;

    background:#252b3b;

    box-shadow:
        0 0 0 1px
        var(--line);
}

.reaction-dot.go{

    background:
        var(--green);

    box-shadow:
        0 0 48px
        rgba(53,231,125,.45);
}

.motor-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:9px;

    max-width:460px;

    margin:22px auto;
}

.motor-cell{

    height:82px;

    border:
        1px solid
        var(--line);

    background:
        var(--panel2);

    border-radius:16px;

    color:#fff;

    cursor:pointer;

    font-weight:800;
}

.motor-cell.active{

    background:
        rgba(124,92,255,.23);

    border-color:
        var(--accent);
}

.seq-buttons{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    justify-content:center;

    max-width:500px;

    margin:auto;
}

.seq-btn{

    width:76px;
    height:76px;

    border:
        1px solid
        var(--line);

    border-radius:19px;

    background:
        var(--panel2);

    color:#fff;

    font-weight:800;

    font-size:19px;

    cursor:pointer;
}

.precision-wrap{

    max-width:520px;

    margin:35px auto;
}

.precision-track{

    position:relative;

    height:82px;

    background:
        #151a29;

    border:
        1px solid
        var(--line);

    border-radius:20px;

    overflow:hidden;
}

.precision-zone{

    position:absolute;

    top:12px;
    bottom:12px;

    width:18%;

    left:41%;

    border-radius:14px;

    background:
        rgba(53,231,125,.16);

    border:
        1px solid
        var(--green);
}

.precision-cursor{

    position:absolute;

    top:19px;

    width:12px;

    height:44px;

    border-radius:10px;

    background:#fff;

    left:0;
}

.labyrinth{

    max-width:500px;

    margin:16px auto;

    aspect-ratio:1;

    background:#090d16;

    border:
        1px solid
        var(--line);

    border-radius:20px;

    position:relative;

    overflow:hidden;

    touch-action:none;
}

.lab-dot{

    position:absolute;

    width:24px;
    height:24px;

    border-radius:50%;

    background:
        var(--accent);

    left:10px;

    top:10px;

    box-shadow:
        0 0 18px
        rgba(124,92,255,.7);
}

.lab-goal{

    position:absolute;

    width:28px;
    height:28px;

    border-radius:50%;

    border:
        2px solid
        var(--green);

    right:12px;

    bottom:12px;
}

.lab-wall{

    position:absolute;

    background:#2a3145;

    border-radius:8px;
}


/* =========================================
   BOSS
========================================= */

.boss{

    max-width:600px;

    margin:auto;
}

.boss-card{

    background:
        linear-gradient(
            145deg,
            rgba(124,92,255,.13),
            rgba(0,217,255,.04)
        );

    border:
        1px solid
        rgba(124,92,255,.3);

    border-radius:22px;

    padding:20px;

    text-align:center;
}

.boss-number{

    font-size:50px;

    font-weight:900;

    letter-spacing:-2px;
}

.boss-buttons{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

    margin-top:16px;
}

.boss-btn{

    min-height:70px;

    background:
        var(--panel2);

    border:
        1px solid
        var(--line);

    color:#fff;

    border-radius:15px;

    font-weight:800;

    cursor:pointer;
}


/* =========================================
   RESULT
========================================= */

.result{

    text-align:center;
}

.result-icon{

    font-size:62px;
}

.result h2{

    font-size:30px;

    margin:9px 0;
}

.result p{

    color:var(--muted);
}

.result-stats{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;

    margin:20px 0;
}

.result-stat{

    background:
        var(--panel2);

    border-radius:16px;

    padding:15px;
}

.result-stat span{

    display:block;

    color:var(--muted);

    font-size:9px;
}

.result-stat strong{

    font-size:21px;
}

.result-note{

    margin:
        12px 0;

    padding:11px;

    border-radius:13px;

    background:
        rgba(53,231,125,.08);

    border:
        1px solid
        rgba(53,231,125,.18);

    font-size:12px;
}


/* =========================================
   OVERLAY
========================================= */

.overlay{

    position:fixed;

    inset:0;

    background:
        rgba(4,6,12,.72);

    backdrop-filter:
        blur(12px);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:200;

    padding:20px;
}

.overlay.show{
    display:flex;
}

.overlay-card{

    width:100%;

    max-width:500px;

    background:
        #101421;

    border:
        1px solid
        var(--line);

    border-radius:25px;

    padding:25px;

    text-align:center;
}


/* =========================================
   FLASH
========================================= */

.flash{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:180;

    opacity:0;
}

.flash.good{

    background:
        rgba(53,231,125,.08);

    animation:
        flash .24s;
}

.flash.bad{

    background:
        rgba(255,77,109,.09);

    animation:
        flash .24s;
}

@keyframes flash{

    0%{
        opacity:1;
    }

    100%{
        opacity:0;
    }
}


/* =========================================
   TOAST
========================================= */

.toast{

    position:fixed;

    z-index:250;

    left:50%;

    top:12px;

    transform:
        translate(-50%,-90px);

    padding:
        11px 15px;

    border-radius:14px;

    background:
        #171c2a;

    border:
        1px solid
        var(--line);

    font-size:12px;

    font-weight:800;

    transition:.22s;
}

.toast.show{

    transform:
        translate(-50%,0);
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .logo h1{
        font-size:38px;
    }

    .panel{
        padding:19px;
    }

    .challenge{
        padding:15px;
        border-radius:21px;
    }

    .challenge-header h2{
        font-size:23px;
    }

    .seq-item{
        min-width:51px;
        min-height:51px;
        font-size:19px;
    }

    .answer{
        min-height:62px;
        font-size:18px;
    }

    .ball-area{
        min-height:410px;
    }

    .btn-row{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>


<div id="toast" class="toast"></div>

<div id="flash" class="flash"></div>


<!-- =========================================
     START
========================================= -->

<section
    id="startScreen"
    class="screen active"
>

    <div class="container">

        <div class="logo">

            <div class="logo-mark">
                🧠
            </div>

            <h1>
                NEURO
            </h1>

            <p>
                Mind • Reflex • Focus
            </p>

        </div>


        <div class="panel">

            <div class="start-stats">

                <div class="start-stat">

                    <strong id="bestScore">
                        0
                    </strong>

                    <span>
                        Рекорд
                    </span>

                </div>


                <div class="start-stat">

                    <strong>
                        30+
                    </strong>

                    <span>
                        Логік
                    </span>

                </div>


                <div class="start-stat">

                    <strong>
                        ∞
                    </strong>

                    <span>
                        Забіги
                    </span>

                </div>

            </div>


            <button
                class="main-btn"
                onclick="startGame(false)"
            >
                ▶ ПОЧАТИ
            </button>


            <div class="btn-row">

                <button
                    class="ghost-btn"
                    onclick="startGame(true)"
                >
                    ⚡ ЩОДЕННИЙ ВИКЛИК
                </button>


                <button
                    class="ghost-btn"
                    onclick="showSoundInfo()"
                >
                    🔊 НАЛАШТУВАННЯ
                </button>

            </div>


            <div class="pill-row">

                <div class="pill">
                    🧠 Логіка
                </div>

                <div class="pill">
                    ⚡ Реакція
                </div>

                <div class="pill">
                    👁 Увага
                </div>

                <div class="pill">
                    🎯 Моторика
                </div>

            </div>

        </div>

    </div>

</section>


<!-- =========================================
     GAME
========================================= -->

<section id="gameScreen">

    <div class="game-wrap">


        <div class="hud">


            <div class="hud-box">

                <small>
                    Рівень
                </small>

                <strong id="hudLevel">
                    1
                </strong>

            </div>


            <div class="hud-box">

                <small>
                    Життя
                </small>

                <strong
                    class="hearts"
                    id="hudErrors"
                >
                    ❤️ ❤️ ❤️
                </strong>

            </div>


            <div class="hud-box">

                <small>
                    Очки
                </small>

                <strong id="hudScore">
                    0
                </strong>

            </div>


        </div>


        <div class="progress">

            <div
                class="progress-fill"
                id="progressFill"
            ></div>

        </div>


        <div
            id="challenge"
            class="challenge"
        ></div>


    </div>

</section>


<!-- =========================================
     RESULT
========================================= -->

<section
    id="resultScreen"
    class="screen"
>

    <div class="container">

        <div class="panel result">


            <div
                id="resultIcon"
                class="result-icon"
            >
                🎉
            </div>


            <h2 id="resultTitle">
                Забіг завершено
            </h2>


            <p id="resultText"></p>


            <div class="result-stats">


                <div class="result-stat">

                    <span>
                        ОЧКИ
                    </span>

                    <strong id="resultScore">
                        0
                    </strong>

                </div>


                <div class="result-stat">

                    <span>
                        XP
                    </span>

                    <strong id="resultXP">
                        0
                    </strong>

                </div>


                <div class="result-stat">

                    <span>
                        РІВЕНЬ
                    </span>

                    <strong id="resultLevel">
                        1
                    </strong>

                </div>


                <div class="result-stat">

                    <span>
                        КОМБО
                    </span>

                    <strong id="resultCombo">
                        0
                    </strong>

                </div>

            </div>


            <div class="result-stats">


                <div class="result-stat">

                    <span>
                        🧠 MIND
                    </span>

                    <strong id="resMind">
                        0
                    </strong>

                </div>

function shuffle(arr){

    const b = [...arr];

    for(
        let i=b.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [
            b[i],
            b[j]
        ] =
        [
            b[j],
            b[i]
        ];
    }

    return b;
}


function rand(arr){

    return arr[
        Math.floor(
            Math.random()*arr.length
        )
    ];
}


function toast(message){

}

/* =========================================
   AUDIO ENGINE
========================================= */

function ensureAudio(){

    if(!audioCtx){

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if(
        audioCtx.state ===
        "suspended"
    ){

        audioCtx.resume();

    }

}


function tone(
    freq,
    dur=.1,
    type="sine",
    gain=.035,
    when=0
){

    ensureAudio();


    const oscillator =
        audioCtx
            .createOscillator();


    const gainNode =
        audioCtx
            .createGain();


    oscillator.type =
        type;

    oscillator.frequency.value =
        freq;


    gainNode.gain.setValueAtTime(
        0.0001,
        audioCtx.currentTime+when
    );


    gainNode.gain.exponentialRampToValueAtTime(
        gain,
        audioCtx.currentTime+
        when+
        .01
    );


    gainNode.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+
        when+
        dur
    );


    oscillator.connect(
        gainNode
    );


    gainNode.connect(
        audioCtx.destination
    );


    oscillator.start(
        audioCtx.currentTime+
        when
    );


    oscillator.stop(
        audioCtx.currentTime+
        when+
        dur+
        .02
    );

}

function startMusic(mode="game"){

    if(!musicOn){
        return;
    }


    ensureAudio();

    clearMusicLoop();


    const patterns = {

        menu:[
            220,
            277,
            330,
            277
        ],

        game:[
            164,
            196,
            233,
            196,
            175,
            220,
            262,
            220
        ],

        intense:[
            196,
            233,
            277,
            233,
            220,
            277,
            330,
            277
        ],

        boss:[
            110,
            130,
            147,
            130,
            98,
            123,
            147,
            123
        ]

    };


    const pattern =
        patterns[mode] ||
        patterns.game;


    musicStep=0;


    const tempo =
        mode==="intense"
            ? 240
            : mode==="boss"
                ? 300
                : mode==="menu"
                    ? 620
                    : 420;


    function play(){

        const freq =
            pattern[
                musicStep %
                pattern.length
            ];


        tone(
            freq,
            .23,
            "triangle",
            .012
        );


        tone(
            freq*2,
            .13,
            "sine",
            .006,
            .04
        );


        musicStep++;

    }


    play();


    musicTimer =
        setInterval(
            play,
            tempo
        );

}


function setMusicMode(mode){

    if(

        startMusic(
            mode

}


function clearMusicLoop(){

    /*

}

/* =========================================
   LOGIC ANSWER
========================================= */

function answerLogic(
    button,
    answer,
    correct
){

    const buttons =
        [
            ...document
                .querySelectorAll(
                    ".answer"
                )
        ];


    buttons.forEach(
        b=>{
            b.disabled=true;
        }
    );


    if(
        answer===correct
    ){

        button.classList
            .add(
                "correct"
            );


        score+=60;

        xp+=12;

        logicDone++;


        successfulChallenge();


        setTimeout(()=>{

            level++;


            /*
              КОЖНІ 10 ВИПРОБУВАНЬ —
              BOSS
            */

            if(
                totalChallenges>0 &&
                totalChallenges%10===0
            ){

                startBoss();

                return;

            }


            /*
              КОЖНІ 5 ЛОГІЧНИХ —
              МОТОРИКА
            */

            if(
                logicDone%5===0
            ){

                startMotorChallenge();

                return;

            }


            nextLogicQuestion();

        },520);


    }else{

        button.classList
            .add(
                "wrong"
            );


        failedChallenge();


        setTimeout(()=>{

            if(
                errors<=0
            ){

                gameOver();

            }else{

                buttons.forEach(
                    b=>{

                        b.disabled=false;

                        b.classList
                            .remove(
                                "wrong"
                            );

                    }
                );

            }

        },480);

    }

}

/* =========================================
   BALL MOVEMENT
   RANDOM 0.5–0.7 SEC
========================================= */

function scheduleBallMove(){

    if(
        ballSeconds<=0 ||
        ballHits>=ballTarget
    ){

        return;

    }


    const delay =
        Math.floor(
            Math.random()*201
        )+500;


    ballMoveTimer =
        setTimeout(()=>{

            if(
                ballSeconds>0 &&
                ballHits<ballTarget
            ){

                moveBall();

                scheduleBallMove();

            }

        },delay);

}


/* =========================================
   BALL POSITION
========================================= */

function moveBall(){

    const area =
        $("ballArea");

    const ball =
        $("ball");


    if(
        !area ||
        !ball
    ){

        return;

    }


    const margin=48;


    const maxX =
        area.clientWidth -
        margin;


    const maxY =
        area.clientHeight -
        margin;


    const x =
        margin+
        Math.random()*
        (maxX-margin);


    const y =
        margin+
        Math.random()*
        (maxY-margin);


    ball.style.left =
        x+"px";


    ball.style.top =
        y+"px";

}


/* =========================================
   CATCH BALL
========================================= */

function catchBall(event){

    event.preventDefault();

    event.stopPropagation();


    if(
        ballSeconds<=0 ||
        ballHits>=ballTarget
    ){

        return;

    }


    ballHits++;


    score+=50;

    combo++;


    bestCombo =
        Math.max(
            bestCombo,
            combo
        );


    $("ballHits")
        .textContent =
            ballHits+
            " / "+
            ballTarget;


    $("ballLeft")
        .textContent =
            Math.max(
                ballTarget-ballHits,
                0
            );


    $("hudScore")
        .textContent =
            Math.round(
                score
            );


    createHit(
        event.clientX,
        event.clientY
    );


    vibrate(
        28
    );


    sfx(
        "hit"
    );


    moveBall();


    if(
        ballHits>=ballTarget
    ){

        finishBall(
            true
        );

    }

}


/* =========================================
   FINISH BALL
========================================= */

    clearInterval(

        ballMoveTimer

========================================= */

function startLabyrinth(){

    clearAllTimers();


    $("challenge")
        .innerHTML = `

        <div class="challenge-header">

            <div class="tag">
                🌀 Координація
            </div>


            <h2>
                Пройди лабіринт
            </h2>


            <p>
                Проведи кульку до зеленого кола,
                не торкаючись стін.
            </p>

        </div>


        <div
            class="labyrinth"
            id="labyrinth"
        >

            <div
                class="lab-wall"
                style="
                    left:15%;
                    top:15%;
                    width:70%;
                    height:10%;
                "
            ></div>


            <div
                class="lab-wall"
                style="
                    left:15%;
                    top:25%;
                    width:10%;
                    height:50%;
                "
            ></div>


            <div
                class="lab-wall"
                style="
                    left:25%;
                    top:65%;
                    width:60%;
                    height:10%;
                "
            ></div>


            <div
                class="lab-wall"
                style="
                    left:75%;
                    top:25%;
                    width:10%;
                    height:40%;
                "
            ></div>


            <div
                class="lab-wall"
                style="
                    left:35%;
                    top:25%;
                    width:10%;
                    height:30%;
                "
            ></div>


            <div
                class="lab-dot"
                id="labDot"
            ></div>


            <div
                class="lab-goal"
            ></div>

        </div>


        <div class="stat-line">

            <div class="stat-chip">
                Рухай пальцем усередині поля
            </div>

        </div>

    `;


    const area =
        $("labyrinth");

    const dot =
        $("labDot");


    let active=false;


    function move(e){

        const rect =
            area.getBoundingClientRect();


        const x =
            clamp(
                e.clientX -
                rect.left,

                12,

                rect.width-12
            );


        const y =
            clamp(
                e.clientY -
                rect.top,

                12,

                rect.height-12
            );


        dot.style.left =
            (x-12)+"px";


        dot.style.top =
            (y-12)+"px";


        const px =
            x/rect.width;


        const py =
            y/rect.height;


        const hit =

            (
                px>.15 &&
                px<.85 &&
                py>.15 &&
                py<.25
            )

            ||

            (
                px>.15 &&
                px<.25 &&
                py>.25 &&
                py<.75
            )

            ||

            (
                px>.25 &&
                px<.85 &&
                py>.65 &&
                py<.75
            )

            ||

            (
                px>.75 &&
                px<.85 &&
                py>.25 &&
                py<.65
            )

            ||

            (
                px>.35 &&
                px<.45 &&
                py>.25 &&
                py<.55
            );


        if(
            hit &&
            active
        ){

            active=false;


            failedChallenge();


            sfx(
                "bad"
            );


            if(
                errors<=0
            ){

                gameOver();

                return;

            }


            toast(
                "Стіна — життя втрачено"
            );


            setTimeout(
                startLabyrinth,
                500
            );


            return;

        }


        if(
            px>.88 &&
            py>.88
        ){

            active=false;


            successfulChallenge();


            sfx(
                "victory"
            );


            setTimeout(()=>{

                level++;

                nextLogicQuestion();

            },600);

        }

    }


    area.onpointerdown =
        ()=>{

            active=true;

        };


    area.onpointermove =
        e=>{

            if(active){

                move(e);

            }

        };


    window.addEventListener(
        "pointerup",
        ()=>{

            active=false;

        }
    );

}


/* =========================================
   MEMORY
========================================= */

function startMemory(){

    const symbols = [
        "◆",
        "●",
        "▲",
        "■",
        "★",
        "✦"
    ];


    const sequence =
        Array.from(
            {
                length:5
            },
            () =>
                rand(symbols)
        );


    $("challenge")
        .innerHTML = `

        <div class="challenge-header">

            <div class="tag">
                🧠 Memory
            </div>


            <h2>
                Запам'ятай
            </h2>


            <p>
                Послідовність зникне
                через секунду.
            </p>

        </div>


        <div
            class="sequence"
            id="memorySeq"
        >

            ${
                sequence.map(
                    symbol=>`

                        <div class="seq-item">

                            ${symbol}

                        </div>

                    `
                ).join("")
            }

        </div>


        <div
            id="memoryQuestion"
            style="
                text-align:center;
                color:var(--muted);
                margin-top:18px;
            "
        ></div>

    `;


    setTimeout(()=>{

        const third =
            sequence[2];


        const options =
            shuffle(
                [
                    third,
                    ...symbols.filter(
                        s=>s!==third
                    )
                ]
            ).slice(
                0,
                4
            );


        $("memorySeq")
            .innerHTML="";


        $("memoryQuestion")
            .innerHTML = `

                <div
                    style="
                        font-size:16px;
                        color:#fff;
                        margin-bottom:16px
                    "
                >

                    Який символ був
                    <b>третім</b>?

                </div>


                <div class="answers">

                    ${
                        options.map(
                            answer=>`

                                <button
                                    class="answer"
                                    onclick="
                                        memoryAnswer(
                                            this,
                                            ${JSON.stringify(answer)},
                                            ${JSON.stringify(third)}
                                        )
                                    "
                                >

                                    ${answer}

                                </button>

                            `
                        ).join("")
                    }

                </div>

            `;

    },1000);


    window.memoryAnswer =
        function(
            button,
            answer,
            correct
        ){

            const buttons =
                document.querySelectorAll(
                    ".answer"
                );


            buttons.forEach(
                b=>{
                    b.disabled=true;
                }
            );


            if(
                answer===correct
            ){

                button.classList
                    .add(
                        "correct"
                    );


                successfulChallenge();


                score+=130;

                xp+=20;


                setTimeout(()=>{

                    level++;

                    nextLogicQuestion();

                },550);

            }else{

                button.classList
                    .add(
                        "wrong"
                    );


                failedChallenge();


                if(
                    errors<=0
                ){

                    setTimeout(
                        gameOver,
                        400
                    );

                }else{

                    setTimeout(()=>{

                        level++;

                        nextLogicQuestion();

                    },650);

                }

            }

        };

}


/* =========================================
   BOSS
========================================= */

function startBoss(){

    clearAllTimers();


    startMusic(
        "boss"
    );


    sfx(
        "boss"
    );


    let phase=0;

    const total=3;


    $("challenge")
        .innerHTML = `

        <div class="challenge-header">

            <div class="tag">
                👑 BOSS CHALLENGE
            </div>


            <h2>
                Mind + Reflex + Focus
            </h2>


            <p>
                Пройди три фази без провалу.
            </p>

        </div>


        <div class="boss">

            <div
                class="boss-card"
                id="bossCard"
            >

                <div
                    class="boss-number"
                    id="bossNumber"
                >
                    01
                </div>


                <div
                    id="bossTask"
                    style="
                        color:var(--muted)
                    "
                >
                    Вибери більше число.
                </div>


                <div
                    class="boss-buttons"
                    id="bossButtons"
                ></div>

            </div>

        </div>

    `;


    function renderBossPhase(){

        phase++;


        if(
            phase===1
        ){

            $("bossNumber")
                .textContent =
                    "01";


            $("bossTask")
                .textContent =
                    "Вибери більше число";


            $("bossButtons")
                .innerHTML = `

                    <button
                        class="boss-btn"
                        onclick="
                            bossCorrect()
                        "
                    >
                        7
                    </button>


                    <button
                        class="boss-btn"
                        onclick="
                            bossWrong()
                        "
                    >
                        5
                    </button>


                    <button
                        class="boss-btn"
                        onclick="
                            bossWrong()
                        "
                    >
                        6
                    </button>


                    <button
                        class="boss-btn"
                        onclick="
                            bossWrong()
                        "
                    >
                        4
                    </button>

                `;

        }


        else if(
            phase===2
        ){

            $("bossNumber")
                .textContent =
                    "02";


            $("bossTask")
                .textContent =
                    "Натисни синю ціль";


            $("bossButtons")
                .innerHTML = `

                    <button
                        class="boss-btn"
                        style="
                            background:#438cff
                        "
                        onclick="
                            bossCorrect()
                        "
                    >
                        СИНЯ
                    </button>


                    <button
                        class="boss-btn"
                        onclick="
                            bossWrong()
                        "
                    >
                        ЧЕРВОНА
                    </button>


                    <button
                        class="boss-btn"
                        onclick="
                            bossWrong()
                        "
                    >
                        ЖОВТА
                    </button>


                    <button
                        class="boss-btn"
                        onclick="
                            bossWrong()
                        "
                    >
                        ЗЕЛЕНА
                    </button>

                `;

        }


        else{

            $("bossNumber")
                .textContent =
                    "03";


            $("bossTask")
                .textContent =
                    "Скільки трикутників?";


            $("bossButtons")
                .innerHTML = `

                    <button
                        class="boss-btn"
                        onclick="
                            bossCorrect()
                        "
                    >
                        2
                    </button>


                    <button
                        class="boss-btn"
                        onclick="
                            bossWrong()
                        "
                    >
                        1
                    </button>


                    <button
                        class="boss-btn"
                        onclick="
                            bossWrong()
                        "
                    >
                        3
                    </button>


                    <button
                        class="boss-btn"
                        onclick="
                            bossWrong()
                        "
                    >
                        4
                    </button>

                `;

        }

    }


    function finishBoss(){

        successfulChallenge();


        sfx(
            "victory"
        );


        toast(
            "👑 BOSS ПОДОЛАНО"
        );


        setTimeout(()=>{

            level++;

            nextLogicQuestion();

        },800);

    }


    window.bossCorrect =
        function(){

            score+=180;

            xp+=25;

            combo++;


            sfx(
                "hit"
            );


            vibrate(
                22
            );


            if(
                phase<total
            ){

                setTimeout(
                    renderBossPhase,
                    320
                );

            }else{

                finishBoss();

            }

        };


    window.bossWrong =
        function(){

            failedChallenge();


            if(
                errors<=0
            ){

                gameOver();

            }else{

                toast(
                    "❌ Помилка"
                );

            }

        };


    renderBossPhase();

}


/* =========================================
   HIT EFFECT
========================================= */

function createHit(
    x,
    y
){

    const effect =
        document.createElement(
            "div"
        );


    effect.style.position=
        "fixed";


    effect.style.left=
        x+"px";


    effect.style.top=
        y+"px";


    effect.style.width=
        "60px";


    effect.style.height=
        "60px";


    effect.style.border=
        "2px solid var(--accent)";


    effect.style.borderRadius=
        "50%";


    effect.style.pointerEvents=
        "none";


    effect.style.transform=
        "translate(-50%,-50%)";


    effect.style.zIndex=
        "190";


    effect.animate(

        [
            {
                opacity:1,
                transform:
                    "translate(-50%,-50%) scale(.4)"
            },

            {
                opacity:0,
                transform:
                    "translate(-50%,-50%) scale(1.8)"
            }
        ],

        {
            duration:320,
            easing:"ease-out"
        }

    );


    document.body
        .appendChild(
            effect
        );


    setTimeout(()=>{

        effect.remove();

    },350);

}


/* =========================================
   GAME OVER
========================================= */

function gameOver(){

    clearAllTimers();


    startMusic(
        "menu"
    );


    const oldBest =
        Number(
            localStorage.getItem(
                "neuroBest"
            ) || 0
        );


    const isNew =
        score>oldBest;


    if(isNew){

        localStorage.setItem(
            "neuroBest",
            String(
                Math.round(score)
            )
        );

    }


    $("gameScreen")
        .classList
        .remove(
            "active"
        );


    $("resultScreen")
        .classList
        .add(
            "active"
        );


    $("resultIcon")
        .textContent =
            isNew
                ? "🏆"
                : "💥";


    $("resultTitle")
        .textContent =
            isNew
                ? "НОВИЙ РЕКОРД"
                : "ЗАБІГ ЗАВЕРШЕНО";


    $("resultText")
        .textContent =
            isNew
                ? "Ти встановив новий рекорд."
                : "Спробуй ще раз і побий свій результат.";


    $("resultScore")
        .textContent =
            Math.round(
                score
            );


    $("resultXP")
        .textContent =
            xp;


    $("resultLevel")
        .textContent =
            level;


    $("resultCombo")
        .textContent =
            bestCombo;


    $("resMind")
        .textContent =
            Math.min(
                100,
                Math.round(
                    logicDone*4
                )
            );


    $("resReflex")
        .textContent =
            Math.min(
                100,
                Math.round(
                    totalChallenges
                    ?
                    score /
                    (totalChallenges*180)
                    :
                    0
                )
            );


    $("resFocus")
        .textContent =
            Math.min(
                100,
                Math.round(
                    (
                        successfulSinceLife+
                        logicDone
                    )*2.5
                )
            );


    $("resMotor")
        .textContent =
            Math.min(
                100,
                motorCount*12
            );


    $("lifeNote")
        .textContent =
            `Виконань: ${totalChallenges}. `+
            `Одне життя повертається `+
            `після 3 успішних випробувань.`;

}


/* =========================================
   HOME
========================================= */

function returnHome(){

    clearAllTimers();


    startMusic(
        "menu"
    );


    $("resultScreen")
        .classList
        .remove(
            "active"
        );


    $("gameScreen")
        .classList
        .remove(
            "active"
        );


    $("startScreen")
        .classList
        .add(
            "active"
        );


    $("bestScore")
        .textContent =
            Number(
                localStorage.getItem(
                    "neuroBest"
                ) || 0
            );

}

            !musicTimer

            startMusic(

            );

        }
    },
    {
        once:true
    }
);

$("bestScore")
