<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEURO — Doctor NEX</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#030714;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font:inherit;
  color:#fff;
  cursor:pointer;
}

.hidden{display:none!important}

.app{
  width:min(100%,760px);
  margin:auto;
  min-height:100vh;
  padding:16px;
}

/* =========================
   LOGO
========================= */

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:5px;
  color:#55e8ff;
  text-shadow:0 0 25px #18cfff;
}

.subtitle{
  text-align:center;
  color:#7890b5;
  font-size:12px;
  letter-spacing:3px;
  margin-bottom:14px;
}

/* =========================
   NEX
========================= */

.nex-stage{
  height:290px;
  border:1px solid #12375b;
  border-radius:24px;
  background:
    radial-gradient(circle at 50% 70%,rgba(0,220,255,.15),transparent 45%),
    linear-gradient(145deg,#09132e,#071022);
  position:relative;
  overflow:hidden;
  margin-bottom:12px;
}

.nex-stage.game-stage{
  height:280px;
}

.nex{
  position:absolute;
  left:50%;
  bottom:4px;
  width:150px;
  height:225px;
  transform:translateX(-50%);
  transform-origin:50% 90%;
  z-index:5;
}

.nex-head{
  position:absolute;
  width:92px;
  height:92px;
  left:29px;
  top:0;
  background:#ffd0a3;
  border-radius:45% 45% 48% 48%;
  z-index:5;
  box-shadow:0 4px 15px #0005;
}

.nex-hair{
  position:absolute;
  width:94px;
  height:42px;
  left:-1px;
  top:-2px;
  background:#74492f;
  border-radius:35px 35px 12px 12px;
}

.eye{
  position:absolute;
  width:9px;
  height:13px;
  background:#152640;
  border-radius:50%;
  top:49px;
  transition:.2s;
}

.eye.left{left:26px}
.eye.right{right:26px}

.nex-mouth{
  position:absolute;
  width:28px;
  height:12px;
  left:32px;
  top:68px;
  border-bottom:3px solid #743e3b;
  border-radius:0 0 50% 50%;
  transition:.2s;
}

.nex-body{
  position:absolute;
  width:108px;
  height:125px;
  left:21px;
  top:83px;
  background:#f7faff;
  border-radius:25px 25px 15px 15px;
  box-shadow:0 8px 20px #0005;
}

.nex-shirt{
  position:absolute;
  width:45px;
  height:103px;
  left:31px;
  top:10px;
  background:#092747;
  border-radius:5px 5px 12px 12px;
}

.nex-shirt:after{
  content:"N";
  position:absolute;
  top:30px;
  width:100%;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#51e8ff;
}

.stethoscope{
  position:absolute;
  width:52px;
  height:63px;
  left:27px;
  top:2px;
  border:3px solid #172e47;
  border-top:0;
  border-radius:0 0 30px 30px;
}

.stethoscope:after{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  background:#172e47;
  border-radius:50%;
  left:18px;
  bottom:-7px;
}

.arm{
  position:absolute;
  width:28px;
  height:88px;
  background:#f7faff;
  border-radius:18px;
  top:95px;
  z-index:1;
  transform-origin:top center;
}

.arm.left{
  left:4px;
  transform:rotate(12deg);
}

.arm.right{
  right:4px;
  transform:rotate(-12deg);
}

.nex-bubble{
  position:absolute;
  left:12px;
  top:12px;
  max-width:310px;
  padding:12px 14px;
  border:1px solid #16d9ff;
  border-radius:16px;
  background:#061426ee;
  color:#e9fbff;
  font-size:14px;
  line-height:1.25;
  z-index:20;
}

/* =========================
   NEX REACTIONS
========================= */

.nex.happy{
  animation:nexHappy 1.15s ease;
  filter:drop-shadow(0 0 22px #2dffb4);
}

.nex.sad{
  animation:nexSad 1.1s ease;
  filter:drop-shadow(0 0 18px #ff4268);
}

.nex.think{
  animation:nexThink 1s ease;
}

.nex.surprise{
  animation:nexSurprise 1s ease;
  filter:drop-shadow(0 0 25px #ffe14a);
}

.nex.encourage{
  animation:nexEncourage 1s ease;
}

.nex.combo{
  animation:nexCombo 1.25s ease;
  filter:drop-shadow(0 0 35px #28eaff);
}

.nex.victory{
  animation:nexVictory 1.5s ease;
  filter:drop-shadow(0 0 40px #2dffb4);
}

.nex.happy .nex-mouth,
.nex.combo .nex-mouth,
.nex.victory .nex-mouth{
  width:36px;
  height:20px;
  left:28px;
  top:65px;
  border-bottom:5px solid #743e3b;
  border-radius:0 0 50% 50%;
}

.nex.sad .nex-mouth{
  width:28px;
  height:12px;
  left:32px;
  top:76px;
  border-top:4px solid #743e3b;
  border-bottom:0;
  border-radius:50% 50% 0 0;
}

.nex.surprise .nex-mouth{
  width:18px;
  height:18px;
  left:37px;
  top:67px;
  border:4px solid #743e3b;
  border-radius:50%;
}

.nex.happy .eye,
.nex.combo .eye,
.nex.victory .eye{
  transform:scaleY(.75);
}

.nex.surprise .eye{
  transform:scale(1.25);
}

.nex.think .eye.left{
  transform:translateY(-5px);
}

.nex.think .eye.right{
  transform:translateY(-2px);
}

@keyframes nexHappy{
  0%{transform:translateX(-50%)}
  20%{transform:translateX(-50%) translateY(-22px) scale(1.08) rotate(-5deg)}
  40%{transform:translateX(-50%) rotate(5deg)}
  60%{transform:translateX(-50%) translateY(-14px) scale(1.06) rotate(-3deg)}
  80%{transform:translateX(-50%) rotate(2deg)}
  100%{transform:translateX(-50%)}
}

@keyframes nexSad{
  0%{transform:translateX(-50%)}
  20%{transform:translateX(-50%) rotate(-12deg)}
  40%{transform:translateX(-50%) rotate(12deg)}
  60%{transform:translateX(-50%) rotate(-8deg)}
  80%{transform:translateX(-50%) rotate(5deg)}
  100%{transform:translateX(-50%)}
}

@keyframes nexThink{
  0%{transform:translateX(-50%)}
  30%{transform:translateX(-50%) translateX(-10px) rotate(-3deg)}
  60%{transform:translateX(-50%) translateX(10px) rotate(3deg)}
  100%{transform:translateX(-50%)}
}

@keyframes nexSurprise{
  0%{transform:translateX(-50%) scale(1)}
  25%{transform:translateX(-50%) scale(1.18) translateY(-8px)}
  50%{transform:translateX(-50%) scale(.94)}
  75%{transform:translateX(-50%) scale(1.12)}
  100%{transform:translateX(-50%) scale(1)}
}

@keyframes nexEncourage{
  0%{transform:translateX(-50%)}
  20%{transform:translateX(-50%) rotate(-8deg)}
  40%{transform:translateX(-50%) rotate(8deg)}
  60%{transform:translateX(-50%) rotate(-8deg)}
  80%{transform:translateX(-50%) rotate(5deg)}
  100%{transform:translateX(-50%)}
}

@keyframes nexCombo{
  0%{transform:translateX(-50%)}
  25%{transform:translateX(-50%) translateY(-28px) scale(1.2)}
  50%{transform:translateX(-50%) scale(.96)}
  75%{transform:translateX(-50%) translateY(-16px) scale(1.12)}
  100%{transform:translateX(-50%)}
}

@keyframes nexVictory{
  0%{transform:translateX(-50%)}
  20%{transform:translateX(-50%) translateY(-32px) rotate(-8deg) scale(1.1)}
  40%{transform:translateX(-50%) rotate(8deg)}
  60%{transform:translateX(-50%) translateY(-24px) rotate(-5deg) scale(1.08)}
  80%{transform:translateX(-50%) rotate(4deg)}
  100%{transform:translateX(-50%)}
}

/* =========================
   BUTTONS / CARDS
========================= */

.bigbtn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px;
  font-weight:900;
  font-size:18px;
  background:linear-gradient(100deg,#16d5ee,#5268ff);
  box-shadow:0 8px 25px #176eff30;
}

.smallrow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.smallbtn{
  border:1px solid #18385f;
  background:#0c1935;
  border-radius:13px;
  padding:14px;
}

.card{
  background:#071128;
  border:1px solid #153359;
  border-radius:22px;
  padding:18px;
  margin-bottom:12px;
}

/* =========================
   HUD
========================= */

.hud{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:8px;
}

.hudbox{
  background:#071128;
  border:1px solid #153359;
  border-radius:18px;
  padding:10px;
  text-align:center;
}

.hudbox small{
  color:#7185a7;
  display:block;
  font-size:10px;
  text-transform:uppercase;
}

.hudbox strong{
  color:#53e5ff;
  font-size:18px;
}

.progress{
  height:7px;
  border-radius:10px;
  background:#0d1c36;
  overflow:hidden;
  margin-bottom:12px;
}

.progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#1ad7ed,#5d62ff);
  width:0;
  transition:.3s;
}

/* =========================
   QUESTIONS
========================= */

.type{
  color:#4de4ff;
  text-align:center;
  font-size:12px;
  letter-spacing:2px;
  font-weight:bold;
  margin-bottom:12px;
}

.question{
  font-size:21px;
  font-weight:800;
  text-align:center;
  line-height:1.3;
  margin-bottom:18px;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.answer{
  min-height:62px;
  border:1px solid #203d69;
  background:#0d1b38;
  border-radius:14px;
  padding:12px;
  font-weight:bold;
}

.answer.correct{
  background:#0c573d;
  border-color:#2dffb2;
}

.answer.wrong{
  background:#632536;
  border-color:#ff5575;
}

/* =========================
   MOTOR HEADER
========================= */

.motor-head{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}

.motor-stat{
  background:#0a1730;
  border:1px solid #1a3b63;
  border-radius:13px;
  padding:9px;
  text-align:center;
}

.motor-stat small{
  display:block;
  color:#748bad;
  font-size:10px;
  text-transform:uppercase;
  margin-bottom:3px;
}

.motor-stat b{
  font-size:18px;
  color:#53e5ff;
}

.motor-stat.time-warning b{
  color:#ffcf4d;
}

.motor-stat.time-danger b{
  color:#ff5274;
}

.motor-status{
  text-align:center;
  min-height:22px;
  color:#91a7ca;
  font-size:13px;
  margin-bottom:8px;
}

/* =========================
   MOTOR AREA
========================= */

.motor{
  position:relative;
  height:330px;
  border:1px solid #1b416b;
  border-radius:20px;
  overflow:hidden;
  background:
    radial-gradient(circle at center,#0a1c39,#040a17 70%);
  touch-action:manipulation;
}

.motor::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,transparent 49.8%,#123252 50%,transparent 50.2%),
    linear-gradient(0deg,transparent 49.8%,#123252 50%,transparent 50.2%);
  opacity:.25;
}

/* =========================
   CATCH BALL
========================= */

.catch-ball{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%,#fff 0 8%,#a7f9ff 9%,#20dfff 42%,#0873cf 100%);
  border:3px solid #74f5ff;
  box-shadow:
    0 0 12px #22eaff,
    0 0 35px #009dff;
  z-index:5;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  transition:left .12s,top .12s,transform .1s;
}

.catch-ball:active{
  transform:scale(.82);
}

.catch-ball.hit{
  animation:ballHit .25s ease;
}

@keyframes ballHit{
  0%{transform:scale(1)}
  50%{transform:scale(1.45);opacity:.6}
  100%{transform:scale(1)}
}

.motor-target-label{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#385170;
  font-size:12px;
  pointer-events:none;
}

/* =========================
   REACTION
========================= */

.reaction-zone{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:4;
}

.react-btn{
  width:190px;
  height:190px;
  border-radius:50%;
  border:5px solid #233c66;
  background:#101d3b;
  font-size:23px;
  font-weight:900;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.react-btn.go{
  background:#1de5a3;
  color:#03130f;
  border-color:#7affd0;
  box-shadow:0 0 50px #1de5a3;
}

/* =========================
   PRECISION
========================= */

.precision-center{
  position:absolute;
  width:110px;
  height:110px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border:3px dashed #38e3ff;
  border-radius:50%;
  pointer-events:none;
}

.precision-ball{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:#ffcf42;
  border:3px solid #fff1a3;
  box-shadow:0 0 25px #ffcf42;
  z-index:5;
  cursor:pointer;
  touch-action:manipulation;
}

/* =========================
   TRACKING
========================= */

.tracking-target{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:50%;
  background:
    radial-gradient(circle,#fff,#37e7ff 35%,#0876ff 70%);
  border:3px solid #9df9ff;
  box-shadow:0 0 30px #20ddff;
  z-index:5;
  cursor:pointer;
  touch-action:manipulation;
}

/* =========================
   RESULT
========================= */

.result{
  text-align:center;
}

.result h1{
  color:#55e8ff;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  padding:16px;
  background:#0c1935;
  border:1px solid #193860;
  border-radius:14px;
}

.stat b{
  display:block;
  font-size:22px;
  color:#52e5ff;
}

.stat span{
  color:#788eaf;
  font-size:11px;
}

/* =========================
   SETTINGS
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modalbox{
  width:min(100%,480px);
  background:#08142d;
  border:1px solid #1d426e;
  border-radius:22px;
  padding:20px;
}

.diff{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.diff button{
  padding:13px;
  border:1px solid #1a3b63;
  background:#0d1b37;
  border-radius:12px;
}

.diff button.active{
  background:#174b67;
  border-color:#38e3ff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .app{
    padding:10px;
  }

  .logo{
    font-size:34px;
  }

  .nex-stage{
    height:275px;
  }

  .nex-stage.game-stage{
    height:270px;
  }

  .question{
    font-size:18px;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .motor{
    height:290px;
  }

  .motor-stat b{
    font-size:16px;
  }

}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     START
===================================================== -->

<section id="start">

  <div class="logo">NEURO</div>

  <div class="subtitle">
    MIND • FOCUS • REFLEX • MOTOR
  </div>

  <div class="nex-stage">

    <div id="startBubble" class="nex-bubble">
      Привіт! Я Doctor NEX. Перевіримо твій мозок?
    </div>

    <div id="nexStart" class="nex">

      <div class="nex-head">
        <div class="nex-hair"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nex-mouth"></div>
      </div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="nex-body">
        <div class="nex-shirt"></div>
        <div class="stethoscope"></div>
      </div>

    </div>

  </div>

  <div class="hud">

    <div class="hudbox">
      <small>Рекорд</small>
      <strong id="best">0</strong>
    </div>

    <div class="hudbox">
      <small>Рівень</small>
      <strong>1</strong>
    </div>

    <div class="hudbox">
      <small>Життя</small>
      <strong>3</strong>
    </div>

  </div>

  <button class="bigbtn" id="startBtn">
    🧠 ПОЧАТИ NEURO
  </button>

  <div class="smallrow">

    <button class="smallbtn" id="dailyBtn">
      📅 DAILY
    </button>

    <button class="smallbtn" id="settingsBtn">
      ⚙️ НАЛАШТУВАННЯ
    </button>

  </div>

</section>


<!-- =====================================================
     GAME
===================================================== -->

<section id="game" class="hidden">

  <div class="hud">

    <div class="hudbox">
      <small>Блок</small>
      <strong id="block">1</strong>
    </div>

    <div class="hudbox">
      <small>Життя</small>
      <strong id="lives">❤️ ❤️ ❤️</strong>
    </div>

    <div class="hudbox">
      <small>Очки</small>
      <strong id="score">0</strong>
    </div>

  </div>

  <div class="progress">
    <i id="progress"></i>
  </div>

  <div class="nex-stage game-stage">

    <div id="gameBubble" class="nex-bubble">
      Не поспішай. Подумай.
    </div>

    <div id="nexGame" class="nex">

      <div class="nex-head">
        <div class="nex-hair"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="nex-mouth"></div>
      </div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="nex-body">
        <div class="nex-shirt"></div>
        <div class="stethoscope"></div>
      </div>

    </div>

  </div>

  <div id="challenge" class="card"></div>

</section>


<!-- =====================================================
     RESULT
===================================================== -->

<section id="result" class="hidden">

  <div class="card result">

    <h1>NEURO COMPLETE</h1>

    <div
      id="finalScore"
      style="font-size:46px;font-weight:900"
    >
      0
    </div>

    <div style="color:#7186a8">
      ОЧКИ
    </div>

    <br>

    <div class="stats">

      <div class="stat">
        <b id="rMind">0</b>
        <span>MIND</span>
      </div>

      <div class="stat">
        <b id="rFocus">0</b>
        <span>FOCUS</span>
      </div>

      <div class="stat">
        <b id="rMemory">0</b>
        <span>MEMORY</span>
      </div>

      <div class="stat">
        <b id="rReflex">0</b>
        <span>REFLEX</span>
      </div>

      <div class="stat">
        <b id="rMotor">0</b>
        <span>MOTOR</span>
      </div>

      <div class="stat">
        <b id="rCombo">0</b>
        <span>BEST COMBO</span>
      </div>

    </div>

    <br>

    <button class="bigbtn" onclick="goHome()">
      🏠 НА ГОЛОВНИЙ ЕКРАН
    </button>

  </div>

</section>

</div>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div id="settingsModal" class="modal hidden">

  <div class="modalbox">

    <h2>⚙️ Налаштування</h2>

    <p>Складність</p>

    <div class="diff">

      <button data-diff="easy">Easy</button>
      <button data-diff="normal">Normal</button>
      <button data-diff="hard">Hard</button>
      <button data-diff="expert">Expert</button>
      <button data-diff="adaptive">Adaptive</button>

    </div>

    <br>

    <button
      class="smallbtn"
      style="width:100%"
      id="closeSettings"
    >
      ЗАКРИТИ
    </button>

  </div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

const S={

  level:1,
  block:1,
  step:0,

  score:0,
  lives:3,

  combo:0,
  bestCombo:0,

  mind:0,
  focus:0,
  memory:0,
  reflex:0,
  motor:0,

  correct:0,
  total:0,

  difficulty:
    localStorage.getItem("neuroDifficulty") ||
    "normal"

};


/* =====================================================
   DIFFICULTY
===================================================== */

const DIFF={

  easy:{
    speed:.75,
    time:1.35
  },

  normal:{
    speed:1,
    time:1
  },

  hard:{
    speed:1.3,
    time:.8
  },

  expert:{
    speed:1.6,
    time:.62
  },

  adaptive:{
    speed:1,
    time:1
  }

};


function difficulty(){

  if(S.difficulty!=="adaptive"){
    return DIFF[S.difficulty];
  }

  const rate=
    S.total
      ? S.correct/S.total
      : .5;

  if(rate>.8)
    return DIFF.hard;

  if(rate<.45)
    return DIFF.easy;

  return DIFF.normal;

}

function startGame(){

  S.level=1;
  S.block=1;
  S.step=0;

  S.score=0;
  S.lives=3;

  S.combo=0;
  S.bestCombo=0;

  S.mind=0;
  S.focus=0;
  S.memory=0;
  S.reflex=0;
  S.motor=0;

  S.correct=0;
  S.total=0;


  start.classList.add("hidden");

  result.classList.add("hidden");

  game.classList.remove("hidden");


  nexReact(
    "encourage",
    "Починаємо! 4 завдання для мозку — потім моторика."
  );


  updateHUD();

  nextTask();

}


function nextTask(){

  updateHUD();


  if(S.lives<=0){

    finishGame();
    return;

  }


  if(S.step<4){

    S.step++;

    nextQuestion();

  }else{

    S.step=5;

    startMotor();

  }

}

   LOGICAL TASK
===================================================== */

let currentQ=null;


function nextQuestion(){

  currentQ=
    Q[
      Math.floor(
        Math.random()*Q.length
      )
    ];


  NEX.think();


  challenge.innerHTML=`

    <div class="type">
      ${currentQ.type} • ${S.step}/5
    </div>

    <div class="question">
      ${currentQ.text}
    </div>

    <div class="answers">

      ${currentQ.answers
        .map((a,i)=>`

          <button
            class="answer"
            data-index="${i}"
          >
            ${a}
          </button>

        `)
        .join("")}

    </div>

  `;


  challenge
    .querySelectorAll(".answer")
    .forEach(btn=>{

      btn.onclick=()=>{

        answerQuestion(
          Number(btn.dataset.index),
          btn
        );

      };

    });

}


function answerQuestion(index,btn){

  const buttons=
    challenge.querySelectorAll(".answer");


  buttons.forEach(
    b=>b.disabled=true
  );


  S.total++;


  const good=
    index===currentQ.correct;


  if(good){

    btn.classList.add("correct");

    buttons[
      currentQ.correct
    ].classList.add("correct");


    S.correct++;

    S.combo++;

    S.bestCombo=
      Math.max(
        S.bestCombo,
        S.combo
      );


    S.score+=
      100+
      S.combo*10;


    if(currentQ.stat==="mind")
      S.mind++;

    if(currentQ.stat==="focus")
      S.focus++;

    if(currentQ.stat==="memory")
      S.memory++;


    NEX.correct();


    updateHUD();


    setTimeout(
      nextTask,
      1100
    );


  }else{

    btn.classList.add("wrong");

    buttons[
      currentQ.correct
    ].classList.add("correct");


    S.lives--;

    S.combo=0;


    NEX.wrong();


    updateHUD();


    setTimeout(()=>{

      if(S.lives<=0){

        finishGame();

      }else{

        NEX.encourage();

        setTimeout(
          nextTask,
          800
        );

      }

    },1200);

  }

}

let motorTimer=null;
let motorInterval=null;
let motorRunning=false;

let motorTimeLeft=0;
let motorTarget=0;
let motorHits=0;


function clearMotorTimers(){

  clearTimeout(motorTimer);

  clearInterval(motorInterval);

  motorTimer=null;
  motorInterval=null;

  motorRunning=false;

}


function motorLayout(title,goal,time){

  challenge.innerHTML=`

    <div class="type">
      MOTOR • ${title}
    </div>

    <div class="motor-head">

      <div class="motor-stat">
        <small>Прогрес</small>
        <b id="motorProgress">
          0 / ${goal}
        </b>
      </div>

      <div class="motor-stat" id="timeBox">
        <small>Час</small>
        <b id="motorTime">
          ${time}
        </b>
      </div>

      <div class="motor-stat">
        <small>Життя</small>
        <b id="motorLives">
          ${"❤️".repeat(S.lives)}
        </b>
      </div>

    </div>

    <div
      class="motor-status"
      id="motorStatus"
    >
      Підготуйся...
    </div>

    <div
      class="motor"
      id="motorArea"
    ></div>

  `;

}


function updateMotorHUD(){

  const progress=
    document.getElementById(
      "motorProgress"
    );

  const time=
    document.getElementById(
      "motorTime"
    );

  const lives=
    document.getElementById(
      "motorLives"
    );

  if(progress){

    progress.textContent=
      `${motorHits} / ${motorTarget}`;

  }

  if(time){

    time.textContent=
      motorTimeLeft;

  }

  if(lives){

    lives.textContent=
      "❤️".repeat(S.lives)+
      "🖤".repeat(
        Math.max(0,3-S.lives)
      );

  }

}


function motorTimerStart(seconds,onTimeUp){

  motorTimeLeft=seconds;

  updateMotorHUD();


  motorInterval=
    setInterval(()=>{

      motorTimeLeft--;

      updateMotorHUD();


      const timeBox=
        document.getElementById(
          "timeBox"
        );


      if(timeBox){

        timeBox.classList.toggle(
          "time-warning",
          motorTimeLeft<=5 &&
          motorTimeLeft>2
        );

        timeBox.classList.toggle(
          "time-danger",
          motorTimeLeft<=2
        );

      }


      if(motorTimeLeft<=0){

        clearInterval(
          motorInterval
        );

        motorInterval=null;

        onTimeUp();

      }

    },1000);

}

function startMotor(){

  clearMotorTimers();

  NEX.motor();


  const types=[

  ];


  const fn=

    ];


  setTimeout(

  );

}


/* =====================================================
   1. CATCH BALL
===================================================== */

function motorCatchBall(){

  motorTarget=8;
  motorHits=0;
  motorRunning=true;


  const time=
    S.difficulty==="easy"
      ? 20
      : S.difficulty==="hard"
      ? 14
      : S.difficulty==="expert"
      ? 12
      : 17;


  motorLayout(
    "CATCH",
    motorTarget,
    time
  );


  const area=
    document.getElementById(
      "motorArea"
    );


  const status=
    document.getElementById(
      "motorStatus"
    );


  status.textContent=
    "Натискай синю кульку • 8 влучань";


  function spawnBall(){

    if(!motorRunning)
      return;


    const ball=
      document.createElement("button");


    ball.className="catch-ball";

    ball.type="button";

    ball.setAttribute(
      "aria-label",
      "Зловити кульку"
    );


    /*
       Безпечні координати.
       Кулька ніколи не виходить за межі.
    */

    const padding=18;

    const maxX=
      Math.max(
        padding,
        area.clientWidth-
        58-
        padding
      );

    const maxY=
      Math.max(
        padding,
        area.clientHeight-
        58-
        padding
      );


    ball.style.left=
      (
        padding+
        Math.random()*
        (maxX-padding)
      )+"px";


    ball.style.top=
      (
        padding+
        Math.random()*
        (maxY-padding)
      )+"px";


    area.appendChild(ball);


    let clicked=false;


    ball.addEventListener(
      "pointerdown",
      e=>{

        e.preventDefault();
        e.stopPropagation();


        if(clicked || !motorRunning)
          return;


        clicked=true;


        motorHits++;

        S.motor++;
        S.reflex++;

        S.score+=60;


        ball.classList.add("hit");


        updateMotorHUD();


        if(motorHits>=motorTarget){

          motorRunning=false;

          clearMotorTimers();

          status.textContent=
            "🎯 Відмінно! 8 / 8";


          NEX.correct();


          setTimeout(
            ()=>finishMotor(true),
            700
          );


          return;

        }


        status.textContent=
          `Влучання зараховано! Ще ${
            motorTarget-motorHits
          }`;


        NEX.correct();


        setTimeout(()=>{

          if(ball.parentNode)
            ball.remove();

          spawnBall();

        },130);


      },
      {passive:false}
    );


    /*
       Якщо не натиснув вчасно —
       кулька просто переміщується,
       а не ламає завдання.
    */

    setTimeout(()=>{

      if(
        motorRunning &&
        ball.parentNode &&
        !clicked
      ){

        ball.remove();

        spawnBall();

      }

    },850*difficulty().time);

  }


  spawnBall();


  motorTimerStart(
    time,
    ()=>{

      if(!motorRunning)
        return;


      motorRunning=false;


      status.textContent=
        `⏱ Час вийшов: ${motorHits} / ${motorTarget}`;


      NEX.sad();


      setTimeout(
        ()=>finishMotor(false),
        900
      );

    }
  );

}


/* =====================================================
   2. REACTION
===================================================== */

function motorReaction(){

  motorTarget=1;
  motorHits=0;
  motorRunning=true;


  const time=8;


  motorLayout(
    "REACTION",
    1,
    time
  );


  const area=
    document.getElementById(

  const status=
    document.getElementById(
      "motorStatus"
    );


  area.innerHTML=`

    <div class="reaction-zone">

      <button
        class="react-btn"
        id="reactBtn"
        type="button"
      >
        ЧЕКАЙ...
      </button>

    </div>

  `;


  const btn=
    document.getElementById(
      "reactBtn"
    );


  let ready=false;


  status.textContent=
    "Не натискай завчасно";


  /*
     Загальний таймер
  */

  motorTimerStart(
    time,
    ()=>{

      if(!motorRunning)
        return;


      motorRunning=false;


      status.textContent=
        "⏱ Ти не встиг";


      NEX.sad();


      setTimeout(
        ()=>finishMotor(false),
        900
      );

    }
  );


  const delay=
    1200+
    Math.random()*2200;


  motorTimer=
    setTimeout(()=>{

      if(!motorRunning)
        return;


      ready=true;

      btn.classList.add("go");

      btn.textContent=
        "НАТИСКАЙ!";

      status.textContent=
        "⚡ ЗАРАЗ!";


      NEX.surprise();

    },delay);


  btn.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();


      if(!motorRunning)
        return;


      if(!ready){

        motorRunning=false;

        clearMotorTimers();


        S.lives--;

        updateMotorHUD();


        status.textContent=
          "❌ Зарано!";


        NEX.sad();


        setTimeout(
          ()=>finishMotor(false),
          900
        );


        return;

      }


      motorRunning=false;

      clearMotorTimers();


      motorHits=1;

      S.reflex++;
      S.motor++;

      S.score+=150;


      updateMotorHUD();


      status.textContent=
        "⚡ РЕАКЦІЮ ЗАРАХОВАНО!";


      NEX.correct();


      setTimeout(
        ()=>finishMotor(true),
        900
      );

    },
    {passive:false}
  );

}

function motorPrecision(){

  motorTarget=5;
  motorHits=0;
  motorRunning=true;


  const time=15;


  motorLayout(
    "PRECISION",
    motorTarget,
    time
  );


  const area=
    document.getElementById(
      "motorArea"
    );


  const status=
    document.getElementById(
      "motorStatus"
    );


  status.textContent=
    "Натискай жовту ціль, коли вона в центрі";


  const center=
    document.createElement("div");


  center.className=
    "precision-center";


  area.appendChild(center);


  const ball=
    document.createElement("button");


  ball.className=
    "precision-ball";

  ball.type="button";


  area.appendChild(ball);


  let x=0;

  let direction=1;


  const loop=
    setInterval(()=>{

      if(!motorRunning)
        return;


      x+=
        direction*
        4*
        difficulty().speed;


      const maxX=
        area.clientWidth-52;


      if(x>=maxX)
        direction=-1;


      if(x<=0)
        direction=1;


      ball.style.left=
        x+"px";


      ball.style.top=
        (area.clientHeight/2-26)+"px";


    },20);


  motorTimer=
    setInterval(()=>{

      if(!motorRunning)
        return;


      /*
         Нічого не робимо.
         Окремий інтервал потрібен тільки
         для плавного руху.
      */

    },100);


  ball.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();


      if(!motorRunning)
        return;


      const centerX=
        area.clientWidth/2;


      const ballCenter=
        x+26;


      const distance=
        Math.abs(
          centerX-ballCenter
        );


      if(distance<58){

        motorHits++;

        S.motor++;
        S.reflex++;

        S.score+=80;


        updateMotorHUD();


        status.textContent=
          `🎯 Точно! ${motorHits}/${motorTarget}`;


        NEX.correct();


        if(motorHits>=motorTarget){

          motorRunning=false;

          clearInterval(loop);
          clearMotorTimers();


          status.textContent=
            "🎯 Точність: 5 / 5";


          setTimeout(
            ()=>finishMotor(true),
            800
          );

        }

      }else{

        status.textContent=
          "Мимо центру — спробуй ще";


        NEX.surprise();

      }

    },
    {passive:false}
  );


  /*
     Окремий таймер часу.
  */

  const seconds=time;


  let left=seconds;


  motorTimeLeft=left;

  updateMotorHUD();


  const clock=
    setInterval(()=>{

      if(!motorRunning){

        clearInterval(clock);
        return;

      }


      left--;

      motorTimeLeft=left;

      updateMotorHUD();


      if(left<=0){

        clearInterval(clock);

        motorRunning=false;

        clearInterval(loop);

        clearMotorTimers();


        status.textContent=
          `⏱ Час: ${motorHits}/${motorTarget}`;


        NEX.sad();


        setTimeout(
          ()=>finishMotor(false),
          900
        );

      }

    },1000);

}


/* =====================================================
   MOTOR FINISH
===================================================== */

function finishMotor(success){

  if(!motorRunning && !success){

    /*
       дозволяємо завершення після помилки
    */

  }


  clearMotorTimers();


  motorRunning=false;


  if(success){

    S.score+=250;

    S.level++;

    S.block++;

    S.step=0;


    NEX.victory();


    setTimeout(()=>{

      if(S.lives>0)
        nextTask();
      else
        finishGame();

    },1500);


  }else{

    S.lives--;

    S.combo=0;


    updateHUD();


    if(S.lives<=0){

      setTimeout(
        finishGame,
        700
      );

    }else{

      NEX.encourage();


      S.step=0;


      setTimeout(
        nextTask,
        1200
      );

    }

  }

}


/* =====================================================
   GAME OVER
===================================================== */

function finishGame(){

  clearMotorTimers();


  motorRunning=false;


  game.classList.add("hidden");

  result.classList.remove("hidden");


  document.getElementById(
    "finalScore"
  ).textContent=S.score;


  document.getElementById(
    "rMind"
  ).textContent=S.mind;

  document.getElementById(
    "rFocus"
  ).textContent=S.focus;

  document.getElementById(
    "rMemory"
  ).textContent=S.memory;

  document.getElementById(
    "rReflex"
  ).textContent=S.reflex;

  document.getElementById(
    "rMotor"
  ).textContent=S.motor;

  document.getElementById(
    "rCombo"
  ).textContent=S.bestCombo;


  const old=
    Number(
      localStorage.getItem(
        "neuroBest"
      )||0
    );


  if(S.score>old){

    localStorage.setItem(
      "neuroBest",
      S.score
    );

  }

}


/* =====================================================
   HOME
===================================================== */

function goHome(){

  clearMotorTimers();

  motorRunning=false;


  result.classList.add("hidden");

  game.classList.add("hidden");

  start.classList.remove("hidden");


  document.getElementById(
    "best"
  ).textContent=
    localStorage.getItem(
      "neuroBest"
    )||0;


  nexReact(
    "happy",
    "Готовий перевірити себе ще раз?"
  );

}


/* =====================================================
   SETTINGS
===================================================== */

document
  .getElementById("settingsBtn")
  .onclick=()=>{

    document
      .getElementById("settingsModal")
      .classList
      .remove("hidden");

    updateDifficultyButtons();

  };


document
  .getElementById("closeSettings")
  .onclick=()=>{

    document
      .getElementById("settingsModal")
      .classList
      .add("hidden");

  };


document
  .querySelectorAll("[data-diff]")
  .forEach(btn=>{

    btn.onclick=()=>{

      S.difficulty=
        btn.dataset.diff;


      localStorage.setItem(
        "neuroDifficulty",
        S.difficulty
      );


      updateDifficultyButtons();


      nexReact(
        "think",
        "Складність змінено."
      );

    };

  });


function updateDifficultyButtons(){

  document
    .querySelectorAll("[data-diff]")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        btn.dataset.diff===
        S.difficulty
      );

    });

}


/* =====================================================
   BUTTONS
===================================================== */

document
  .getElementById("startBtn")
  .onclick=startGame;


document
  .getElementById("dailyBtn")
  .onclick=()=>{

    nexReact(
      "surprise",
      "Daily ще готується. Скоро буде окремий виклик!"
    );

  };


/* =====================================================
   INIT
===================================================== */

document
  .getElementById("best")
  .textContent=
    localStorage.getItem(
      "neuroBest"
    )||0;


updateDifficultyButtons();

</script>
